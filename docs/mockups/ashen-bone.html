<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Ashen Bone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" />
<style>
/* Bone: aged parchment, iron-gall ink. Oxblood = touch, deep brass = earned,
   gold = EXP. Same layout as the live Ashen main screen. */
:root {
  --bg: #e4dbc6; --frame: #efe7d4; --well: rgba(90,70,40,.08);
  --ink: #241c10; --text: #5e5342; --faint: #8a7e66;
  --line: rgba(90,70,40,.24); --line-mid: rgba(90,70,40,.38);
  --touch: #7c2d22; --touch-line: rgba(124,45,34,.55); --touch-fill: rgba(124,45,34,.08);
  --earned: #8a6a22; --earned-line: rgba(138,106,34,.55);
  --exp: #b8861a; --bad: #a8321e; --good: #3f6b3a; --mag: #6a4a9a;
  --done: #c8bc9e; --done-line: #a89a78; --done-text: #8a7e66;
}
* { box-sizing: border-box; }
body { margin: 0; background: #cfc5ad; color: var(--text); font: 500 16px/1.35 'Alegreya', Georgia, serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: var(--ink); margin: 0 0 6px; }
.lede { text-align: center; margin: 0 0 24px; }
.phones { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; align-items: flex-start; }
.phone { width: 390px; background: var(--bg); border: 1px solid var(--line-mid); border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px rgba(60,40,20,.28); position: relative; }
.cap { font: 600 12px 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; }
.sans { font-family: 'Alegreya Sans', sans-serif; }

/* fight stage */
.stagebar { display: flex; justify-content: space-between; align-items: center; padding: 18px 16px 0; }
.stagebar .cap { color: var(--text); letter-spacing: .3em; }
.menu { width: 40px; height: 40px; border-radius: 6px; background: var(--touch-fill); border: 1px solid var(--line); display: grid; place-content: center; gap: 4px; }
.menu i { display: block; width: 18px; height: 2px; background: var(--ink); }
.stage { position: relative; height: 350px; margin-top: 4px; background: radial-gradient(70% 55% at 72% 62%, rgba(255,250,235,.7), transparent 70%), radial-gradient(60% 40% at 25% 100%, rgba(90,70,40,.18), transparent 70%); }
.boss { position: absolute; right: 12px; top: 20px; width: 190px; image-rendering: pixelated; filter: drop-shadow(2px 0 0 #2a1a10) drop-shadow(-2px 0 0 #2a1a10) drop-shadow(0 2px 0 #2a1a10) drop-shadow(0 -2px 0 #2a1a10) drop-shadow(0 8px 14px rgba(60,30,10,.35)); }
.hero { position: absolute; left: 6px; top: 150px; width: 150px; image-rendering: pixelated; filter: drop-shadow(0 8px 10px rgba(60,40,20,.4)); }
.unit { position: absolute; }
.unit.b { left: 16px; top: 18px; width: 205px; }
.unit.h { left: 172px; top: 232px; width: 202px; }
.uname { display: flex; align-items: center; gap: 6px; font: 600 14px 'Cinzel', serif; letter-spacing: .2em; color: var(--ink); margin-bottom: 4px; }
.uname small { font-size: 12px; color: var(--earned); letter-spacing: .1em; }
.uname svg { width: 12px; height: 12px; stroke: var(--touch); fill: none; stroke-width: 2; }
.hp { height: 14px; border-radius: 2px; background: rgba(60,40,20,.2); border: 1px solid var(--line-mid); position: relative; overflow: hidden; }
.hp b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#c4402a, #8c2616); }
.hp span { position: absolute; right: 5px; top: -1px; font: 700 11px/14px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.hp.mine span { color: var(--ink); text-shadow: none; }
.hp.mine b { background: linear-gradient(#c4402a, #8c2616); }
.stats { display: flex; gap: 9px; margin-top: 5px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); white-space: nowrap; }
.stats span { display: inline-flex; align-items: center; gap: 3px; }
.stats svg, .ico { width: 13px; height: 13px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* panels */
.panel { position: relative; margin: 18px 14px 0; background: var(--frame); border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 12px; }
.panel::before { content: ''; position: absolute; top: -1px; left: 12px; right: 12px; height: 1px; background: linear-gradient(90deg, transparent, var(--touch-line), transparent); }
.panel::after { content: ''; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--frame); border: 1px solid var(--touch-line); }
.phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.phead .cap { color: var(--ink); font-size: 13px; }
.pill { font: 700 13px 'Alegreya Sans', sans-serif; color: var(--touch); background: var(--touch-fill); border: 1px solid var(--touch-line); border-radius: 6px; padding: 9px 12px; min-height: 40px; }
.group { font: 600 11px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 10px 0 4px; }
.habit { display: flex; align-items: center; gap: 12px; padding: 9px 4px; min-height: 44px; position: relative; }
.habit .chk { width: 18px; height: 18px; flex: none; transform: rotate(45deg) scale(.85); border: 1.6px solid var(--ink); border-radius: 2px; margin-left: 6px; }
.habit.bad .chk { border-color: var(--bad); }
.habit.bad::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; background: var(--bad); border-radius: 1px; }
.habit .nm { flex: 1; font: 700 19px 'Alegreya', serif; color: var(--ink); }
.habit.done .chk { background: var(--done); border-color: var(--done-line); }
.habit.done .nm { color: var(--done-text); font-weight: 500; text-decoration: line-through; text-decoration-color: rgba(90,70,40,.6); text-decoration-thickness: 1.25px; }
.streak { display: inline-flex; align-items: center; gap: 3px; font: 700 14px 'Alegreya Sans', sans-serif; color: var(--ink); }
.habit.done .streak, .habit.idle .streak { color: var(--text); }
.streak svg { width: 13px; height: 13px; stroke: var(--text); fill: none; stroke-width: 1.8; }
.plate { font: 600 10px 'Cinzel', serif; color: var(--earned); border: 1px solid var(--earned-line); border-radius: 4px; padding: 2px 7px; min-width: 32px; text-align: center; background: rgba(138,106,34,.06); }
.dmg { font: 700 17px 'Alegreya Sans', sans-serif; min-width: 50px; text-align: right; }
.phys { color: #a8321e; } .magic { color: var(--mag); } .heal { color: var(--good); }

.quest { display: flex; align-items: center; gap: 12px; padding: 12px 12px; margin-bottom: 8px; border-radius: 4px; background: var(--well); border-left: 2px solid var(--line-mid); }
.quest.soon { border-left-color: var(--exp); background: linear-gradient(90deg, rgba(184,134,26,.14), var(--well)); }
.quest .chk { width: 18px; height: 18px; transform: rotate(45deg) scale(.85); border: 1.6px solid var(--ink); border-radius: 2px; flex: none; margin: 0 6px; }
.quest .mid { flex: 1; }
.quest .qn { font: 700 18px 'Alegreya', serif; color: var(--ink); }
.dots { display: flex; align-items: center; gap: 6px; margin-top: 3px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--text); }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--earned); }
.dots i.o { background: none; border: 1.5px solid var(--earned); }
.dots em { font-style: normal; margin-left: 4px; }
.quest.soon .dots em { color: var(--exp); }
.xp { text-align: center; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--exp); }
.xp svg { display: block; margin: 0 auto 1px; width: 22px; height: 22px; stroke: var(--exp); fill: none; stroke-width: 1.5; stroke-linejoin: round; }

.log { padding: 9px 2px; border-top: 1px solid var(--line); font: 500 16px 'Alegreya', serif; color: var(--ink); display: flex; gap: 10px; align-items: center; }
.log:first-of-type { border-top: 0; }
.log b { font-family: 'Alegreya Sans', sans-serif; }
.pager { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 24px 0 26px; }
.pager i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.pager i.c { width: 9px; height: 9px; background: none; border: 1.5px solid var(--text); }

/* scrolled state: pinned header */
.pin { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--frame); border-bottom: 1px solid var(--line-mid); position: relative; }
.pin::after { content: ''; position: absolute; bottom: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--frame); border-right: 1px solid var(--touch-line); border-bottom: 1px solid var(--touch-line); z-index: 2; }
.badge { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(90,70,40,.3); background: var(--bg); overflow: hidden; flex: none; }
.badge img { position: absolute; width: 74px; left: -14px; top: -4px; image-rendering: pixelated; }
.lv { position: absolute; left: 30px; top: 30px; z-index: 3; width: 24px; height: 24px; transform: rotate(45deg); background: var(--frame); border: 1.5px solid var(--earned); display: grid; place-content: center; }
.lv b { transform: rotate(-45deg); font: 600 11px 'Cinzel', serif; color: var(--earned); }
.pinmid { flex: 1; }
.pinrow { display: flex; justify-content: space-between; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); margin-bottom: 4px; }
.pinrow .cap { font-size: 12px; color: var(--ink); }
.bars { height: 7px; border-radius: 2px; background: rgba(60,40,20,.2); overflow: hidden; display: flex; }
.bars b { display: block; width: 41%; background: linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 0); }
.bars .r { margin-left: auto; width: 62%; background: linear-gradient(#c4402a, #8c2616); }
.thumb { width: 46px; height: 46px; border: 1px solid var(--line-mid); border-radius: 6px; background: var(--bg); overflow: hidden; flex: none; }
.thumb img { width: 62px; margin: -2px 0 0 -8px; image-rendering: pixelated; }
.exprow { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); }
.exprow .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(60,40,20,.2); }
.exprow .bar b { display: block; width: 55%; height: 100%; background: var(--exp); border-radius: 2px; }
.lock { height: 22px; }
</style>
</head>
<body>
<div class="page">
  <h1>Ashen · Bone</h1>
  <p class="lede">The main screen in the Bone palette: fight view on the left, scrolled with the pinned header on the right.</p>
  <div class="phones" id="phones"></div>
</div>
<script>
const S = (d, c) => `<svg class="ico" viewBox="0 0 24 24" style="stroke:${c}">${d}</svg>`;
const I = {
  sword: c => S('<path d="M5 19 17 7M14 4h6v6M5 19l-1 1M7 15l2 2"/>', c),
  magic: c => S('<path d="M4 20 16 8M14 3v4M12 5h4M19 10v3M17.5 11.5h3"/>', c),
  armor: c => S('<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/>', c),
  ward: c => S('<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6zM12 3v18"/>', c),
  aim: c => S('<circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>', c),
  heart: c => S('<path d="M12 20S4 15 4 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15 12 20 12 20z"/>', c),
  bolt: c => S('<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>', c),
  flame: c => `<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/></svg>`,
  chev: `<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>`,
  spark: `<svg viewBox="0 0 24 24"><path d="M12 3c.5 4 2 6 6 6.5-4 .5-5.5 2.5-6 6.5-.5-4-2-6-6-6.5 4-.5 5.5-2.5 6-6.5zM18 14c.3 2 1 3 3 3.3-2 .3-2.7 1.3-3 3.2-.3-1.900-1-2.900-3-3.200 2-.3 2.700-1.300 3-3.300z"/></svg>`,
};
const habits = `
  <div class="group">DAILY</div>
  <div class="habit bad"><span class="chk"></span><span class="nm">Doomscrolling</span><span class="streak">${I.flame}12</span><span class="plate">II</span><span class="dmg heal">1.09K</span></div>
  <div class="habit done"><span class="chk"></span><span class="nm">Morning run</span><span class="streak">${I.flame}23</span><span class="plate">III</span><span class="dmg phys">5.96K</span></div>
  <div class="habit done"><span class="chk"></span><span class="nm">Read 20 pages</span><span class="streak">${I.flame}9</span><span class="plate">IV</span><span class="dmg magic">1.41K</span></div>
  <div class="habit"><span class="chk"></span><span class="nm">Meditate</span><span class="streak">${I.flame}4</span><span class="plate">I</span><span class="dmg magic">566</span></div>
  <div class="group" style="margin-top:16px">WEEKLY</div>
  <div class="habit"><span class="chk"></span><span class="nm">Gym</span><span class="streak">${I.flame}5</span><span class="plate">VIII</span><span class="dmg phys">34.3K</span></div>`;
const quests = `
  <div class="phead"><span class="cap">Quests</span><span class="pill">+ New quest</span></div>
  <div class="quest soon"><span class="chk"></span><div class="mid"><div class="qn">Call the dentist</div><div class="dots"><i></i><i class="o"></i><i class="o"></i><em>2 days left</em></div></div><div class="xp">${I.spark}+EXP</div></div>
  <div class="quest"><span class="chk"></span><div class="mid"><div class="qn">Finish the tax return</div><div class="dots"><i></i><i></i><i></i><em>6 days left</em></div></div><div class="xp">${I.spark}+EXP</div></div>`;
const log = `
  <div class="phead"><span class="cap">Log</span></div>
  <div class="log">${I.heart('#3f6b3a')}<span>Ember Heart <b class="heal">+287</b> HP</span></div>
  <div class="log">${I.sword('#a8321e')}<span>Used “Read 20 pages” — dealt <b class="phys">113</b> damage</span></div>
  <div class="log">${I.sword('#a8321e')}<span>Used “Morning run” — dealt <b class="phys">425</b> damage</span></div>`;
const pager = `<div class="pager"><i></i><i class="c"></i><i></i></div>`;

const fight = `
<div class="phone">
  <div class="stagebar"><span class="cap">Boss #9</span><span class="menu"><i></i><i></i><i></i></span></div>
  <div class="stage">
    <img class="boss" src="../../public/sprites/bosses/balanced@3x.png" alt="">
    <img class="hero" src="../../public/sprites/player/warrior@3x.png" alt="">
    <div class="unit b">
      <div class="uname">DRIFTER ${I.chev}</div>
      <div class="hp"><b style="width:41%"></b><span>266 / 648</span></div>
      <div class="stats"><span>${I.sword('#a8321e')}61</span><span>${I.magic('#6a4a9a')}58</span><span>${I.armor('#5e5342')}213</span><span>${I.ward('#4a6a9a')}221</span><span>${I.aim('#b8861a')}1%</span></div>
    </div>
    <div class="unit h">
      <div class="uname">RYN <small>14</small> ${I.chev}</div>
      <div class="hp mine"><b style="width:18%"></b><span>1.04K / 5.74K</span></div>
      <div class="stats"><span>${I.sword('#a8321e')}1.4K</span><span>${I.magic('#6a4a9a')}416</span><span>${I.heart('#3f6b3a')}526</span><span>${I.bolt('#5e5342')}611</span><span>${I.aim('#b8861a')}3%</span></div>
    </div>
  </div>
  <div class="panel"><div class="phead"><span class="cap">Skills</span><span class="pill">+ New habit</span></div>${habits}</div>
  <div class="panel">${quests}</div>
  <div class="panel">${log}</div>
  ${pager}
</div>`;

const scrolled = `
<div class="phone">
  <div class="pin">
    <div class="badge"><img src="../../public/sprites/player/warrior@3x.png" alt=""></div>
    <div class="lv"><b>14</b></div>
    <div class="pinmid">
      <div class="pinrow"><span>266 / 648</span><span class="cap">DRIFTER</span></div>
      <div class="bars"><b></b><b class="r"></b></div>
    </div>
    <div class="thumb"><img src="../../public/sprites/bosses/balanced.png" alt=""></div>
  </div>
  <div style="height:14px"></div>
  <div class="panel" style="margin-top:6px"><div class="phead"><span class="cap">Skills</span><span class="pill">+ New habit</span></div>${habits}</div>
  <div class="panel">${quests}</div>
  <div class="panel">${log}</div>
  ${pager}
</div>`;
document.getElementById('phones').innerHTML = fight + scrolled;
</script>
</body>
</html>
