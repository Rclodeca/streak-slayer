<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Rank gem</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya:wght@500&display=swap" />
<style>
/* Real app screenshots (iPhone width, 2x), cropped to the skill rows and the
   skill popup's rank box. Each column is a CSS layer from rank-gem/ over
   Ashen as it is now. */
:root { --text: #b0a796; --text-h: #ece3cd; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--text-h); background: #070606; font: 500 16px/1.4 'Alegreya', Georgia, serif; }
.page { max-width: 1760px; margin: 0 auto; padding: 30px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; margin: 0 0 6px; }
.lede { text-align: center; color: var(--text); margin: 0 0 24px; }
h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(150,141,126,.3), transparent); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.col { width: 330px; max-width: 100%; }
.key b { display: block; font: 600 11px 'Cinzel', serif; letter-spacing: .18em; color: var(--text-h); margin-bottom: 4px; }
.key { color: var(--text); font-size: 15px; min-height: 48px; }
.col img { width: 100%; display: block; border: 1px solid rgba(150,141,126,.18); border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <h1>Rank gem</h1>
  <p class="lede">The rank numeral's setting, on the skill rows and in the skill popup. Ranks II, III, IV, I and VIII.</p>
  <div id="cols"></div>
</div>
<script>
const COLS = [
  ['now', 'Now', 'Ember diamond with a gold edge, as on the death screen.'],
  ['a', 'A · Diamond, no edge', 'Just the glowing ember diamond.'],
  ['b', 'B · Ember plate', 'The same fire and gold edge, on a rectangle.'],
  ['c', 'C · Ember plate, no edge', 'A glowing ember rectangle.'],
  ['d', 'D · Dark plate', 'The earlier plate: dark, gold edge, no fire.'],
];
const el = document.getElementById('cols');
el.insertAdjacentHTML('beforeend', `<div class="row">${COLS.map(([, t, d]) => `<div class="col key"><b>${t}</b>${d}</div>`).join('')}</div>`);
for (const [s, label] of [['rows', 'Skill rows'], ['block', 'Skill popup']]) {
  el.insertAdjacentHTML('beforeend', `<h2>${label}</h2><div class="row">${COLS.map(([v]) => `<div class="col"><img src="rank-gem/${s}-${v}.png" alt=""></div>`).join('')}</div>`);
}
</script>
</body>
</html>
