<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut popups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The remaining popups in Pixel-cut (Moonlit): start screen, death, daily
   update, reroll, boss skill, quest complete / failed, quests unlocked, skill
   detail, revive toast. Same content and order as the Vue components, with
   the chrome from pixel-forms / pixel-levelup. Everything is tappable. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 44px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.col > p { margin: 0 0 10px; min-height: 96px; font-size: 14.5px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; min-height: 30px; }
.sw button { padding: 5px 10px; background: #26282e; border: 1px solid #3a3d46; color: #b8b6b0; font: 700 12px 'Alegreya Sans', sans-serif; cursor: pointer; }
.sw button.on { background: #dbe2ee; color: #12141a; border-color: #dbe2ee; }
button, input { font: inherit; }

.phone {
  --bg: #07080c; --frame: #141720; --well: #0d1017; --ink: #f0f3f7; --text: #a9adb6; --dim: #6a6f7a; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --good: #7fc17a;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --phys: #d0604f; --magic: #ab8dd8; --true: #f1e9d6; --heal: #92bf88;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --sunk: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b;
  --lifted: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo);
  position: relative; width: 390px; padding: 54px 10px 28px; background: radial-gradient(70% 30% at 50% 6%, #1c2230, transparent 70%), var(--bg);
  border: 1px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.phone.modalp::before { content: ''; position: absolute; inset: 0; background: rgba(3,4,6,.6); pointer-events: none; }
.phone > * { position: relative; }
svg.i { width: 14px; height: 14px; flex: none; }
.ic { display: inline-flex; }

/* ---- Popup chrome (pixel-forms / pixel-levelup) ---- */
.modal { clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); padding: 0 12px 14px; }
.mhead { display: flex; align-items: center; min-height: 52px; }
.mhead h3 { margin: 0; flex: 1; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
.mhead.c { justify-content: center; }
.mhead.c h3 { flex: none; }
.mhead.red h3 { color: var(--bad); letter-spacing: .3em; }
.close { width: 40px; height: 40px; margin-right: -4px; display: grid; place-items: center; clip-path: var(--px2); background: rgba(219,226,238,.06); border: 1px solid rgba(219,226,238,.25); color: var(--touch); }
.close svg { width: 16px; height: 16px; }
.lbl { display: block; margin: 14px 2px 8px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.lbl:first-child { margin-top: 2px; }
.well { clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); }
.sock { flex: none; display: grid; place-items: center; clip-path: var(--px2); background: #07090d; box-shadow: inset 0 0 0 2px var(--r, #2a3140), inset 4px 4px 0 #020305; }
.sock svg { width: 20px; height: 20px; }
.ink { color: var(--ink); }

/* Silver key: the main button. --face/--base/--fg set the colour. */
.cta { --lp: 3px; --face: #c8d0dd; --base: #7d8595; --fg: #12141a; --sh: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18);
  position: relative; display: block; width: 100%; margin-top: 18px; height: calc(46px + var(--lp)); padding: 0 8px var(--lp); border: 0; background: none; cursor: pointer;
  font: 700 16px 'Alegreya Sans', sans-serif; color: var(--fg); letter-spacing: .02em; -webkit-tap-highlight-color: transparent; }
.cta::before, .cta::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.cta::before { top: var(--lp); bottom: 0; background: var(--base); }
.cta::after { top: 0; bottom: var(--lp); background: var(--face); box-shadow: var(--sh); transition: top .07s, bottom .07s; }
.cta > span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; transition: transform .07s; }
.cta:active::after { top: var(--lp); bottom: 0; }
.cta:active > span { transform: translateY(var(--lp)); }
.cta.bad { --face: #d4574a; --base: #6e2a24; --fg: #fff; --sh: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.22); }
.cta.good { --face: #7fc17a; --base: #3d6a3a; --fg: #12301a; --sh: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.18); }
.cta[disabled] { --face: #1d2230; --base: #0a0c11; --fg: #5f6470; --sh: inset 0 2px 0 rgba(255,255,255,.06); cursor: default; }
.cta[disabled]::after { top: var(--lp); bottom: 0; }
.cta[disabled] > span { transform: translateY(var(--lp)); }
.back { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 44px; margin-top: 6px; background: none; border: 0; color: var(--text); font: 700 14px 'Alegreya Sans', sans-serif; cursor: pointer; }
.back svg { width: 16px; height: 16px; }

/* Small toggle key ("I did this"): raised, presses down and lights silver when on */
.tk { --lp: 3px; --face: #232a3a; --base: #0a0c11; --fg: var(--touch); position: relative; flex: none; height: calc(34px + var(--lp)); padding: 0 12px var(--lp); border: 0; background: none; cursor: pointer;
  font: 700 13px 'Alegreya Sans', sans-serif; color: var(--fg); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.tk::before, .tk::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.tk::before { top: var(--lp); bottom: 0; background: var(--base); }
.tk::after { top: 0; bottom: var(--lp); background: var(--face); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 2px 0 0 rgba(255,255,255,.05); transition: top .07s, bottom .07s; }
.tk > span { position: relative; z-index: 1; display: inline-block; transition: transform .07s; }
.tk.on { --face: #c8d0dd; --fg: #12141a; }
.tk.on::after { top: var(--lp); bottom: 0; box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18); }
.tk.on > span { transform: translateY(var(--lp)); }

/* Lifted card (as on the main screen), with a tone spine on the left */
.lc { --tone: var(--bad); position: relative; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 8px 8px 16px; clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--lip); box-shadow: var(--lifted); }
.lc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
.lc.ok { --tone: var(--good); }
.lc .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lc .nt { font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); overflow-wrap: anywhere; }
.lc .mt { display: flex; align-items: center; gap: 8px; font: 700 12px 'Alegreya Sans', sans-serif; color: #7c808b; text-transform: capitalize; }
.lc .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.lc .out { font: 800 13px 'Alegreya Sans', sans-serif; color: var(--tone); }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }

/* Rank pips (brass squares, in fours) and quest pips (brass circles) */
.pp { display: flex; gap: 4px; }
.pp i { width: 4px; height: 4px; background: var(--brass); }
.pp i:nth-child(5) { margin-left: 4px; }
.qpips { display: inline-flex; gap: 3px; }
.qpips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--brass); }
.qpips i.lit { background: var(--brass); }
.streak { display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; }

/* ================= 1 · Start screen ================= */
.start { text-align: center; padding: 4px 4px 0; }
.start .eyebrow { margin: 0; font-size: 14.5px; color: var(--text); }
.start .title { margin: 6px 0 0; font: 700 27px/1.1 'Cinzel', serif; letter-spacing: .16em; text-indent: .16em; color: var(--ink); text-shadow: 0 2px 0 #05070a; }
.start .rule { width: 56px; height: 4px; margin: 10px auto 0; background: var(--brass); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
.stage { position: relative; height: 196px; margin: 12px -10px 0; overflow: hidden; background: #0c0f17; border-top: 3px solid var(--lip); border-bottom: 3px solid var(--lip); }
.stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(closest-side at 50% 68%, rgba(255,255,255,.1), rgba(255,255,255,.03) 70%, transparent); }
.stars { position: absolute; left: 0; top: 4px; width: 2px; height: 2px; background: transparent;
  box-shadow: 40px 20px #3a4358, 120px 12px #2c3446, 230px 30px #3a4358, 300px 10px #4a5470, 352px 52px #2c3446, 200px 60px #2c3446, 70px 70px #232a39, 330px 80px #3a4358, 20px 50px #2c3446; }
.plinth { position: absolute; left: 50%; bottom: 20px; width: 132px; height: 18px; margin-left: -66px; }
.plinth::before { content: ''; position: absolute; inset: 0; clip-path: polygon(6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, 100% 3px, 100% 100%, 0 100%, 0 3px, 6px 3px);
  background: #1f2534; box-shadow: inset 0 3px 0 #3a4358, inset 0 6px 0 #283041, inset 0 -3px 0 #10141d; }
.stage .hero { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); image-rendering: pixelated; filter: drop-shadow(0 0 12px rgba(0,0,0,.8)); }
.stage .hero.fated { filter: brightness(0) drop-shadow(0 0 10px rgba(216,180,106,.35)); opacity: .85; }
.stage .fm { position: absolute; left: 0; right: 0; bottom: 78px; text-align: center; font: 700 40px 'Cinzel', serif; color: var(--brass); text-shadow: 0 2px 0 #05070a; }
.turn { --lp: 3px; position: absolute; top: 50%; width: 46px; height: calc(46px + var(--lp)); margin-top: -26px; padding: 0 0 var(--lp); border: 0; background: none; color: var(--touch); cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
.turn::before, .turn::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.turn::before { top: var(--lp); bottom: 0; background: #0a0c11; }
.turn::after { top: 0; bottom: var(--lp); background: #232a3a; box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 2px 0 0 rgba(255,255,255,.05); transition: top .07s, bottom .07s; }
.turn svg { position: relative; z-index: 1; width: 22px; height: 22px; transition: transform .07s; }
.turn:active::after { top: var(--lp); bottom: 0; } .turn:active svg { transform: translateY(var(--lp)); }
.turn.l { left: 10px; } .turn.r { right: 10px; }
.pname { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 0; font: 600 12px 'Cinzel', serif; letter-spacing: .24em; text-indent: .24em; color: var(--ink); text-transform: uppercase; }
.pname svg { width: 16px; height: 16px; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 9px 0 0; }
.dots i { width: 6px; height: 6px; background: #2a3140; }
.dots i.on { background: var(--touch); }
.oath { margin-top: 16px; text-align: left; padding: 12px; clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); }
.oath h2 { margin: 2px 0 0; text-align: center; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-indent: .24em; text-transform: uppercase; color: var(--ink); }
.oath .fell { margin: 6px 0 0; text-align: center; font-size: 14px; color: var(--text); }
.name { width: 100%; height: 50px; padding: 0 14px; clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); border: 0; color: var(--ink); font: 600 17px 'Alegreya', Georgia, serif; outline: none; }
.name::placeholder { color: var(--dim); font-weight: 500; }
.name:focus { box-shadow: var(--sunk), inset 0 0 0 2px rgba(219,226,238,.5); }
.rules { margin: 14px 0 0; padding: 4px 8px; list-style: none; }
.rules li { display: grid; grid-template-columns: 34px 52px 1fr; align-items: center; gap: 8px; padding: 8px 0; }
.rules li + li { border-top: 1px solid rgba(255,255,255,.05); }
.rules .sock { width: 34px; height: 34px; }
.rules .sock svg { width: 16px; height: 16px; }
.rules b { font: 600 11px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.rules span.tx { font-size: 14.5px; color: var(--text); }

/* ================= 2 · Death ================= */
.death { text-align: center; }
.grave { position: relative; height: 140px; margin: 2px 0 0; overflow: hidden; background: #090b10; }
.grave::before { content: ''; position: absolute; inset: 0; background: radial-gradient(closest-side at 50% 80%, rgba(212,87,74,.16), transparent); }
.grave img { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); image-rendering: pixelated; filter: grayscale(1) brightness(.5);
  -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 92%); mask-image: linear-gradient(180deg, #000 30%, transparent 92%); }
.death h2 { margin: 14px 0 0; font: 600 22px 'Alegreya', Georgia, serif; color: var(--ink); }
.death .meta { margin: 2px 0 0; font-size: 14px; }
.death .kept { margin: 18px 0 10px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-indent: .24em; text-transform: uppercase; color: var(--text); }
.embers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ember { display: grid; justify-items: center; gap: 6px; width: 52px; }
.ember .sock { --r: #3a3322; width: 44px; height: 44px; }
.ember .grp { display: grid; grid-template-columns: repeat(4, 4px); gap: 3px; }
.ember .grp i { width: 4px; height: 4px; background: var(--brass); }
.ember .sock.cold .grp i { opacity: .4; }
.ember .num { font: 700 12px 'Cinzel', serif; color: var(--brass); }
.ember .st { display: inline-flex; align-items: center; gap: 2px; min-height: 14px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--ink); }
.ember .st svg { width: 11px; height: 11px; }
.ember.cold .st { color: var(--dim); font-weight: 500; }

/* ================= 3 / 7 · Daily update, Deadline passed ================= */
.grp-l { margin: 12px 2px 7px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.grp-l:first-of-type { margin-top: 2px; }
.intro { margin: 2px 0 12px; padding: 10px 12px 10px 16px; position: relative; font-size: 14.5px; color: var(--text); clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); }
.intro::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--bad); }

/* ================= 4 · Reroll ================= */
.sub { margin: 0 2px 12px; text-align: center; font-size: 14.5px; color: var(--text); }
.rr { width: 100%; border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.rr .pick { flex: none; width: 24px; height: 24px; display: grid; place-items: center; clip-path: var(--px2); background: #07090d; box-shadow: inset 0 0 0 2px #2a3140, inset 3px 3px 0 #020305; }
.rr .pick i { width: 10px; height: 10px; background: transparent; }
.rr.sel { background: #141a28; box-shadow: inset 0 0 0 2px rgba(219,226,238,.55), inset 3px 3px 0 #0a0d14; }
.rr.sel .pick { box-shadow: inset 0 0 0 2px #aeb8c8, inset 3px 3px 0 #020305; }
.rr.sel .pick i { background: var(--touch); }
.rr .dmg { flex: none; min-width: 44px; text-align: right; font: 800 15px 'Alegreya Sans', sans-serif; color: var(--c); }
.rr .mt svg { width: 12px; height: 12px; }
.rr .star { display: inline-flex; margin-left: 5px; vertical-align: -1px; color: #c8a96e; }
.rr .star svg { width: 13px; height: 13px; }

/* ================= 5 · Boss skill ================= */
.bs { text-align: center; padding: 6px 0 0; }
.bs .bsock { --r: #7a2e28; width: 112px; height: 112px; margin: 0 auto; clip-path: var(--px); background: radial-gradient(circle, rgba(212,87,74,.22), #07090d 72%); box-shadow: inset 0 0 0 2px var(--r), inset 5px 5px 0 #020305; display: grid; place-items: center; animation: rise .4s cubic-bezier(.2,.9,.3,1.2); }
.bs .bsock svg { width: 52px; height: 52px; filter: drop-shadow(0 0 8px currentColor); }
.bs .sn { margin: 14px 0 0; font: 700 22px 'Cinzel', serif; letter-spacing: .14em; text-indent: .14em; color: var(--ink); text-transform: uppercase; }
.bs .sl { margin: 6px 0 0; font: 600 17px 'Alegreya', Georgia, serif; color: var(--ink); min-height: 24px; }
.bs .sl.damage { color: var(--phys); font-weight: 700; } .bs .sl.heal { color: var(--heal); font-weight: 700; } .bs .sl.dim { color: var(--text); font-weight: 500; }
.bs.failed .bsock { --r: #3a3322; background: #07090d; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.94); } }
@media (prefers-reduced-motion: reduce) { .bs .bsock, .plate { animation: none; } }

/* ================= 6 · Quest complete ================= */
.qc { text-align: center; padding: 2px 0 0; }
.plate { position: relative; width: 96px; height: 96px; margin: 2px auto 14px; display: grid; place-items: center; animation: rise .45s cubic-bezier(.2,.9,.3,1.2); }
.plate::before, .plate::after { content: ''; position: absolute; clip-path: var(--px); }
.plate::before { inset: 0; background: linear-gradient(#e6d3a1, #a58f58); }
.plate::after { inset: 4px; background: #11141c; box-shadow: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b; }
.plate svg { position: relative; z-index: 1; width: 44px; height: 44px; color: var(--brass); }
.qc .deed { margin: 0; font: 600 20px 'Alegreya', Georgia, serif; color: var(--ink); overflow-wrap: anywhere; }
.qc .qpips { margin-top: 10px; }
.qc .qpips i { width: 9px; height: 9px; }
.exprow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; padding: 12px; }
.exprow svg { width: 24px; height: 24px; }
.exprow b { font: 800 28px 'Alegreya Sans', sans-serif; color: #d8b46a; letter-spacing: .02em; }

/* ================= 8 · Quests unlocked ================= */
.qu { text-align: center; }
.qu .plate { width: 84px; height: 84px; }
.qu .plate::before { background: linear-gradient(#c8d0dd, #7d8595); }
.qu .plate svg { color: var(--touch); width: 36px; height: 36px; }
.qu .tag { margin: 0 0 14px; font: 500 16px 'Alegreya', Georgia, serif; color: var(--text); }

/* ================= 9 · Skill detail ================= */
.sk-name { margin: 0; flex: 1; font: 600 20px 'Alegreya', Georgia, serif; color: var(--ink); }
.sk-meta { display: flex; align-items: center; gap: 6px; margin: -2px 2px 12px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--text); }
.sk-meta svg { width: 14px; height: 14px; }
.rankb { padding: 10px 12px 12px; }
.rankb .top { display: flex; align-items: center; justify-content: space-between; }
.rankb .rl { font: 600 11px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
.bar { height: 8px; margin-top: 9px; background: #07090d; box-shadow: inset 2px 2px 0 #020305; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brass); box-shadow: inset 0 2px 0 rgba(255,255,255,.3); }
.rankb .cap { display: flex; justify-content: space-between; margin-top: 7px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); }
.rankb .cap b { color: var(--brass); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { --lp: 3px; position: relative; height: calc(41px + var(--lp)); padding: 0 0 var(--lp); border: 0; background: none; color: var(--touch); cursor: pointer; font: 700 14px 'Alegreya Sans', sans-serif; }
.day::before, .day::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.day::before { top: var(--lp); bottom: 0; background: #0a0c11; }
.day::after { top: 0; bottom: var(--lp); background: #232a3a; box-shadow: inset 0 2px 0 rgba(255,255,255,.1); }
.day span { position: relative; z-index: 1; display: inline-block; }
.day.on { color: #12141a; } .day.on::after { top: var(--lp); bottom: 0; background: #c8d0dd; } .day.on span { transform: translateY(var(--lp)); }
.dl { display: flex; justify-content: space-between; margin: 0 2px 8px; }
.dl .lbl { margin: 0; }
.dl span.n { font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); }
.sum { margin: 0; padding: 4px 12px; }
.sum .r { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font: 600 14.5px 'Alegreya Sans', sans-serif; color: var(--text); }
.sum .r + .r { border-top: 1px solid rgba(255,255,255,.05); }
.sum .r dt, .sum .r dd { margin: 0; display: inline-flex; align-items: center; gap: 7px; }
.sum .r dd { color: var(--ink); font-weight: 800; }
.sum .r svg { width: 14px; height: 14px; }
.sum .tot { padding: 11px 0 9px; }
.sum .tot dt { font: 600 11px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
.sum .tot dd { font-size: 24px; color: var(--c); }
.od { --lp: 3px; position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 12px; height: calc(48px + var(--lp)); padding: 0 14px var(--lp); border: 0; background: none; cursor: pointer; font: 700 15px 'Alegreya Sans', sans-serif; color: var(--ink); }
.od::before, .od::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.od::before { top: var(--lp); bottom: 0; background: #0a0c11; }
.od::after { top: 0; bottom: var(--lp); background: var(--card); box-shadow: var(--lifted); }
.od > * { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; }
.od .ch { display: inline-flex; gap: 4px; }
.od .ch i { width: 9px; height: 9px; clip-path: var(--px2); background: var(--brass); }
.od .ch i.sp { background: #07090d; box-shadow: inset 0 0 0 2px #3a3322; }
.od small { font: 800 14px 'Alegreya Sans', sans-serif; color: var(--phys); }
.rm { display: block; width: 100%; height: 44px; margin-top: 10px; background: none; border: 0; color: color-mix(in srgb, var(--bad) 75%, #fff); font: 700 14px 'Alegreya Sans', sans-serif; cursor: pointer; }
.rm.lock { color: var(--dim); }

/* ================= 10 · Revive toast ================= */
.toast { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); animation: drop .4s cubic-bezier(.2,.9,.3,1.1); }
.toast .sock { --r: #a58f58; width: 40px; height: 40px; }
.toast .sock svg { width: 20px; height: 20px; color: var(--brass); }
.toast .t { font: 600 15.5px/1.25 'Alegreya', Georgia, serif; color: var(--ink); }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.behind { height: 120px; margin-top: 14px; opacity: .5; background: repeating-linear-gradient(0deg, #141720 0 52px, transparent 52px 60px); clip-path: var(--px); }
</style>
</head>

/* ---------- 1 · Start screen ---------- */

      { k: 'cleric', n: 'Mage', ic: 'magic', c: C.magic },

      };
      const anyBlow = items.some((it, i) => strikes(it, i));
      el.innerHTML = `<div class="modal"><div class="mhead c"><h3>Daily update</h3></div>
        ${group('miss', 'Left undone')}${group('reward', 'Resisted')}
        <button class="cta ${anyBlow ? 'bad' : 'good'}" type="button"><span>${anyBlow ? 'Take the blow' : 'Claim'}</span></button></div>`;
    };
    el.addEventListener('click', (e) => { const b = e.target.closest('.tk'); if (b) { over[+b.dataset.i] = !over[+b.dataset.i]; draw(); } });
    draw();
  },
});

/* ---------- 4 · Reroll ---------- */
add({
  tag: '4', title: 'Reroll habit', modal: true,
  note: 'The reroll step of the level-up popup. Rows are the main-screen skill cards with the type colour as the spine; a square pick socket stands where the strike button would be. Pick one and the key reads “Reroll …”.',
  init(el) {
    const SK = [
      ['Meditate', 'phys', 21, 6, '1.2k', true, 'daily'], ['Stretch', 'magic', 8, 3, '640', false, 'daily'],
      ['Journal', 'true', 4, 2, '410', false, 'daily'], ['Drink water', 'heal', 0, 0, '220', false, 'daily'],
      ['Call a friend', 'phys', 3, 1, '980', false, 'weekly'],
    ];
    let pick = null;
    const row = (s, i) => { const [n, t, st, r, d, sp] = s;
      return `<li><button class="lc rr ${pick === i ? 'sel' : ''}" type="button" data-i="${i}" style="--tone:${C[t]};--c:${C[t]}" aria-pressed="${pick === i}">
        <span class="pick"><i></i></span>
        <span class="nm"><span class="nt">${n}${sp ? `<span class="star">${icon('star', C.gold)}</span>` : ''}</span>
          <span class="mt">${st >= 2 ? `<span class="streak">${icon('streak', C.streak)}${st}</span>` : ''}${rankPips(r)}</span></span>
        <span class="dmg">${d}</span></button></li>`; };
    const draw = () => {
      const g = (label, k) => `<p class="grp-l">${label}</p><ul class="list">${SK.map((s, i) => [s, i]).filter(([s]) => s[6] === k).map(([s, i]) => row(s, i)).join('')}</ul>`;
      el.innerHTML = `<div class="modal"><div class="mhead c"><h3>Level up!</h3></div>
        <p class="sub">Pick a skill to re-roll. Its damage type changes; nothing else does.</p>
        ${g('Daily', 'daily')}${g('Weekly', 'weekly')}
        <button class="cta" type="button" ${pick === null ? 'disabled' : ''}><span>${pick === null ? 'Pick a skill' : `Reroll ${SK[pick][0]}`}</span></button>
        <button class="back" type="button">${icon('left')}Back</button></div>`;
    };
    el.addEventListener('click', (e) => { const b = e.target.closest('.rr'); if (b) { const i = +b.dataset.i; pick = pick === i ? null : i; draw(); } });
    draw();
  },
});

/* ---------- 5 · Boss skill ---------- */
add({
  tag: '5', title: 'Boss skill', modal: true,
  note: 'The card a boss skill pops up with. The icon sits in a big red-lit socket (grey-gold when it failed); name in caps, then the effect line. Switch skills to see each tone.',
  switches: ['Ravage', 'Blind', 'Doom', 'Mend', 'Empower', 'Ascend', 'Resisted', 'Failed'],
  init(el, ui) {
    const SKS = [
      { n: 'Ravage', ic: 'bossHit', c: C.phys, line: '−1.2k HP', tone: 'damage' },
      { n: 'Blind', ic: 'blind', c: C.crit, line: 'No crits · 2 days' },
      { n: 'Doom', ic: 'doom', c: C.violet, line: 'Half your HP · 3 days' },
      { n: 'Mend', ic: 'mend', c: C.phys, line: 'Boss +860 HP', tone: 'heal' },
      { n: 'Empower', ic: 'empower', c: C.phys, line: 'Armor doubled' },
      { n: 'Ascend', ic: 'ascend', c: C.phys, line: 'All stats doubled' },
      { n: 'Rend', ic: 'bossHit', c: C.phys, line: 'Resisted', tone: 'dim' },
      { n: 'Failed', ic: 'skillFailed', c: C.gold, failed: true },
    ];
    const draw = (i) => { const s = SKS[i];
      el.innerHTML = `<div class="modal"><div class="mhead"><h3>Boss skill</h3>${closeKey}</div>
        <div class="bs ${s.failed ? 'failed' : ''}" key="${i}"><div class="bsock">${icon(s.ic, s.c)}</div><p class="sn">${s.n}</p>${s.line ? `<p class="sl ${s.tone || ''}">${s.line}</p>` : '<p class="sl"></p>'}</div>
        <button class="cta" type="button"><span>OK</span></button></div>`; };
    ui.onSwitch = draw; draw(0);
  },
});

/* ---------- 6 · Quest complete ---------- */
add({
  tag: '6', title: 'Quest complete', modal: true,
  note: 'Brass plate = earned. The deed, its difficulty pips, then the EXP in a sunk well in the EXP gold. Switch difficulty to see the reward scale.',
  switches: ['Easy', 'Medium', 'Hard'],
  init(el, ui) {
    const D = [['Water the plants', 1, '30'], ['Book the dentist', 2, '80'], ['Clean the garage', 3, '160']];
    const draw = (i) => { const [d, p, x] = D[i];
      el.innerHTML = `<div class="modal"><div class="mhead"><h3>Quest complete</h3>${closeKey}</div>
        <div class="qc"><div class="plate">${icon('badgeCheck')}</div><p class="deed">${d}</p>${pips(p)}
          <div class="exprow well">${icon('exp', C.exp)}<b>+${x} EXP</b></div></div>
        <button class="cta" type="button"><span>Onward</span></button></div>`; };
    ui.onSwitch = draw; draw(2);
  },
});

/* ---------- 7 · Quest failed ---------- */
add({
  tag: '7', title: 'Quest failed', modal: true,
  note: 'Deadline passed. Same card as the daily update: red spine, “I did this” key. Press it and the card shows its reward instead of the blow. Intro kept as is, in a sunk well with a red edge.',
  init(el) {
    const Q = [{ n: 'Clean the garage', p: 3, due: 'Due Nov 1', r: '+160 EXP' }, { n: 'File the taxes', p: 1, due: 'Due Oct 30', r: '+30 EXP' }];
    const over = Q.map(() => false);
    const draw = () => {
      const all = over.every(Boolean);
      el.innerHTML = `<div class="modal"><div class="mhead c"><h3>Deadline passed</h3></div>
        <p class="intro">The boss strikes for every deed left undone.</p>
        <ul class="list">${Q.map((q, i) => `<li class="lc ${over[i] ? 'ok' : ''}"><div class="nm"><span class="nt">${q.n}</span><span class="mt">${pips(q.p)}<span style="text-transform:none">${q.due}</span></span></div>
          <div class="side"><span class="out">${over[i] ? q.r : 'Strikes back'}</span><button class="tk ${over[i] ? 'on' : ''}" type="button" data-i="${i}"><span>I did this</span></button></div></li>`).join('')}</ul>
        <button class="cta ${all ? 'good' : 'bad'}" type="button"><span>${all ? 'Claim' : 'Take the blow'}</span></button></div>`;
    };
    el.addEventListener('click', (e) => { const b = e.target.closest('.tk'); if (b) { over[+b.dataset.i] = !over[+b.dataset.i]; draw(); } });
    draw();
  },
});

/* ---------- 8 · Quests unlocked ---------- */
add({
  tag: '8', title: 'Quests unlocked', modal: true,
  note: 'Found in the code, not on your list. Silver plate (not brass: nothing earned yet), then the same three-rule ledger as the start screen.',
  init(el) {
    const R = [['quest', 'Swear', C.steel, 'Name a deed and a deadline.'], ['gift', 'Keep', C.gold, 'Done in time, receive a reward.'], ['swords', 'Break', C.health, 'Miss the deadline, the boss strikes.']];
    el.innerHTML = `<div class="modal qu"><div class="mhead c"><h3>Quests unlocked</h3></div>
      <div class="plate">${icon('quest')}</div><p class="tag">Some deeds are sworn only once.</p>
      <ul class="rules well" style="margin:0;text-align:left">${R.map(([ic, t, c, x]) => `<li><span class="sock">${icon(ic, c)}</span><b>${t}</b><span class="tx">${x}</span></li>`).join('')}</ul>
      <button class="cta" type="button"><span>Onward</span></button></div>`;
  },
});

/* ---------- 9 · Skill detail ---------- */
add({
  tag: '9', title: 'Skill detail', modal: true,
  note: 'Found in the code: the sheet a skill opens (HabitStatsModal). Rank in a sunk well with a brass bar, day keys as in the add popup, damage as a sunk ledger with the total in the type colour, Overdrive as a lifted card.',
  init(el) {
    const days = [true, true, false, true, true, true, false];
    const L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const draw = () => {
      el.innerHTML = `<div class="modal"><div class="mhead"><h2 class="sk-name">Meditate</h2>${closeKey}</div>
        <p class="sk-meta">${icon('sword', C.phys)}<span>Physical</span><span>·</span><span>Medium</span></p>
        <div class="rankb well"><div class="top"><span class="rl">Rank VI</span>${rankPips(6)}</div><div class="bar"><i style="width:62%"></i></div>
          <div class="cap"><span>21 days</span><span><b>VII</b> at 28 days</span></div></div>
        <div class="dl" style="margin-top:14px"><span class="lbl">Days</span><span class="n">${days.filter(Boolean).length} a week</span></div>
        <div class="days">${L.map((l, i) => `<button class="day ${days[i] ? 'on' : ''}" type="button" data-i="${i}"><span>${l}</span></button>`).join('')}</div>
        <dl class="sum well" style="margin-top:14px;--c:${C.phys}">
          <div class="r"><dt>Base</dt><dd>420</dd></div>
          <div class="r"><dt>${icon('streak', C.streak)}Streak</dt><dd>×1.35</dd></div>
          <div class="r"><dt>${icon('star', C.gold)}Special</dt><dd>×1.5</dd></div>
          <div class="r tot"><dt>Damage</dt><dd>1.2k</dd></div></dl>
        <button class="od" type="button"><span>Overdrive<span class="ch"><i></i><i></i><i class="sp"></i></span></span><small>840</small></button>
        <button class="rm" type="button">Remove habit</button></div>`;
    };
    el.addEventListener('click', (e) => { const b = e.target.closest('.day'); if (b) { days[+b.dataset.i] = !days[+b.dataset.i]; draw(); } });
    draw();
  },
});

/* ---------- 10 · Revive toast ---------- */
add({
  tag: '10', title: 'Phoenix revive', modal: false,
  note: 'Found in the code: the toast when a Phoenix Feather saves you. Same framed chrome as a popup, brass socket, no emoji.',
  init(el) {
    el.style.minHeight = '0';
    el.innerHTML = `<div class="toast"><span class="sock">${icon('feather')}</span><span class="t">Phoenix Feather consumed — revived at half health!</span></div><div class="behind"></div>`;
  },
});

/* ---------- build ---------- */
const grid = document.getElementById('grid');
for (const s of SECTIONS) {
  const col = document.createElement('div'); col.className = 'col';
  col.innerHTML = `<div class="tag">${s.tag}</div><h2>${s.title}</h2><p>${s.note}</p><div class="sw"></div><div class="phone ${s.modal ? 'modalp' : ''}"></div>`;
  grid.appendChild(col);
  const phone = col.querySelector('.phone'), sw = col.querySelector('.sw');
  const ui = { onSwitch: null };
  s.init(phone, ui);
  if (s.switches) {
    s.switches.forEach((label, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (i === (s.tag === '6' ? 2 : 0)) b.classList.add('on');
      b.addEventListener('click', () => { sw.querySelectorAll('button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); ui.onSwitch(i); });
      sw.appendChild(b);
    });
  }
}
</script>
</body>
</html>
