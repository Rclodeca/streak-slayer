<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Trim looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Trim's structure (cards, press-to-strike, rank pips, left quest checks)
   in more serious RPG materials. Same screen and data in each phone; only
   the look changes. Order follows HabitList.vue / QuestSection.vue. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; }
.col p { margin: 0 0 12px; min-height: 64px; font-size: 15px; }

/* ================= Base (Moonlit) ================= */
.phone {
  --bg: #07080c; --frame: #141720; --ink: #e8ebf0; --text: #a9adb6; --touch: #dbe2ee; --cap: var(--ink);
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --phys: #e5705c; --magic: #a98be0; --heal: #7fc17a; --true: #f1e9d6;
  --spent: #6a6f7a; --done: #3c4352; --done-line: #566074; --streak-i: #8d8475;
  --card: #171b25; --card-line: #232937; --card-lip: #0b0d12; --card-r: 10px; --resist-card: #141720; --spent-card: #12151d;
  --spent-face: #232836; --spent-base: #1a1d26;
  --add-c: var(--touch); --add-bg: rgba(219,226,238,.08); --add-line: rgba(219,226,238,.35); --add-r: 8px;
  --stage: radial-gradient(70% 55% at 72% 50%, #1c2230, transparent 70%);
  --boss-glow: rgba(224,120,58,.4); --log-r: 10px; --chk-r: 4px; --btn-r: 7px;
  width: 390px; padding-bottom: 28px; background: var(--bg); border: 1px solid #000; border-radius: 34px; overflow: hidden;
  box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
button { font: inherit; }
.cap { font: 600 11px 'Cinzel', serif; letter-spacing: .3em; text-transform: uppercase; color: var(--cap); }

.top { background: var(--stage), var(--bg); }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 0; }
.menu { width: 40px; height: 40px; border-radius: var(--add-r); background: var(--add-bg); border: 1px solid var(--add-line); display: grid; place-items: center; color: var(--add-c); }
.menu svg { width: 18px; height: 18px; }
.stage { position: relative; height: 300px; }
.boss { position: absolute; right: 8px; top: 6px; width: 172px; image-rendering: pixelated;
  filter: drop-shadow(2px 0 0 #2a1a10) drop-shadow(-2px 0 0 #2a1a10) drop-shadow(0 2px 0 #2a1a10) drop-shadow(0 -2px 0 #2a1a10) drop-shadow(0 0 12px var(--boss-glow)); }
.hero { position: absolute; left: 8px; top: 128px; width: 140px; image-rendering: pixelated; transform: scaleX(-1); filter: drop-shadow(0 0 18px rgba(0,0,0,.9)) brightness(.9); }
.platform { position: absolute; left: 6px; top: 262px; width: 150px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,165,200,.16), transparent); }
.unit { position: absolute; }
.unit.b { left: 16px; top: 22px; width: 188px; }
.unit.h { left: 172px; top: 196px; width: 202px; }
.uname { display: flex; align-items: center; gap: 6px; font: 600 12.5px 'Cinzel', serif; letter-spacing: .2em; color: var(--ink); margin-bottom: 5px; text-transform: uppercase; }
.uname small { font-size: 11px; color: var(--brass); letter-spacing: .1em; }
.uname .cue { display: inline-block; width: 6px; height: 6px; margin-left: 3px; border-top: 1.5px solid var(--text); border-right: 1.5px solid var(--text); transform: rotate(45deg); }
.bar { position: relative; height: 15px; border-radius: 2px; background: rgba(0,0,0,.5); border: 1px solid rgba(0,0,0,.6); overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#c4402a, #8c2616); }
.bar i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--exp); }
.bar span { position: absolute; right: 5px; top: 0; font: 700 10.5px/13px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.7); }
.stats { display: flex; gap: 8px; margin-top: 6px; font: 700 11px 'Alegreya Sans', sans-serif; color: color-mix(in srgb, var(--text) 80%, #000); white-space: nowrap; }
.stats span { display: inline-flex; align-items: center; gap: 2px; }
.stats svg { width: 12px; height: 12px; }

.sec { margin: 18px 12px 0; }
.shead { display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 2px; }
.shead h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--cap); text-transform: uppercase; }
.add { font: 700 12.5px 'Alegreya Sans', sans-serif; color: var(--add-c); background: var(--add-bg); border: 1px solid var(--add-line); border-radius: var(--add-r); padding: 8px 13px; min-height: 38px; }
.group { font: 600 10px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 12px 2px 7px; text-transform: uppercase; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }

/* Card */
.row { --face: linear-gradient(color-mix(in srgb, var(--c) 88%, #fff), color-mix(in srgb, var(--c) 82%, #000)); --base: color-mix(in srgb, var(--c) 40%, #000);
  --btn-sh: inset 0 1px 0 rgba(255,255,255,.18); --btn-c: #fff; --btn-ts: 0 1px 0 rgba(0,0,0,.35);
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 12px;
  background: var(--card); border: 1px solid var(--card-line); border-bottom: 3px solid var(--card-lip); border-radius: var(--card-r); }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nt { font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp { display: flex; gap: 4px; padding-left: 2px; }
.pp:empty { display: none; }
.pp i { width: 4px; height: 4px; transform: rotate(45deg); background: var(--brass); }
.pp i:nth-child(5) { margin-left: 4px; }
.meta { display: flex; align-items: center; gap: 7px; }
.streak { min-width: 26px; display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; }
.tagw { font: 700 12px 'Alegreya Sans', sans-serif; color: color-mix(in srgb, var(--text) 55%, #000); }
.next { font: 700 12px 'Alegreya Sans', sans-serif; color: var(--touch); opacity: .7; }

/* Press button: ::before is the lip, ::after the face */
.press { --lip: 3px; position: relative; flex: none; min-width: 58px; height: calc(34px + var(--lip)); padding: 0 10px var(--lip);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; cursor: pointer;
  font: 700 14.5px 'Alegreya Sans', sans-serif; color: var(--btn-c); text-shadow: var(--btn-ts); -webkit-tap-highlight-color: transparent; }
.press::before, .press::after { content: ''; position: absolute; left: 0; right: 0; border-radius: var(--btn-r); clip-path: var(--btn-clip, none); }
.press::before { top: var(--lip); bottom: 0; background: var(--base); }
.press::after { top: 0; bottom: var(--lip); background: var(--face); box-shadow: var(--btn-sh); transition: top .07s, bottom .07s; }
.press svg, .press b { position: relative; z-index: 1; font-weight: inherit; transition: transform .07s; }
.press svg { width: 13px; height: 13px; }
.press:active::after, .on .press::after { top: var(--lip); bottom: 0; }
.press:active > *, .on .press > * { transform: translateY(var(--lip)); }

/* Struck until dawn */
.phone .row.on { --face: var(--spent-face); --base: var(--spent-base); --btn-sh: none; --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); --btn-ts: none; background: var(--spent-card); }
.row.on .nt { color: var(--spent); }
.row.on .streak, .row.on .pp { opacity: .45; }

/* Resting today: flat, can't be pressed */
.rest { margin-top: 8px; }
.rest summary { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 2px; list-style: none; cursor: pointer;
  font: 600 10px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); text-transform: uppercase; }
.rest summary::-webkit-details-marker { display: none; }
.rest summary span { color: var(--touch); }
.rest summary::after { content: ''; width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translateY(-2px); }
.rest[open] summary::after { transform: rotate(225deg) translateY(-1px); }
.phone .row.resting { --face: var(--spent-card); --base: transparent; --btn-sh: inset 0 0 0 1px rgba(255,255,255,.05); --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); --btn-ts: none; background: var(--resist-card); }
.row.resting .nt { color: var(--text); font-weight: 500; }
.resting .press { pointer-events: none; }
.resting .press::after { top: var(--lip); bottom: 0; }
.resting .press > * { transform: translateY(var(--lip)); }

/* Resist: a dark face on a red lip */
.phone .resist .row { --face: linear-gradient(color-mix(in srgb, var(--card) 80%, #fff 0%), var(--resist-card)); --base: color-mix(in srgb, var(--bad) 55%, #000);
  --btn-c: color-mix(in srgb, var(--bad) 70%, #fff); --btn-ts: none; --btn-sh: inset 0 0 0 1px rgba(255,255,255,.04); background: var(--resist-card); }
.phone .resist .row.on { --face: var(--spent-face); --base: var(--spent-base); --btn-c: color-mix(in srgb, var(--bad) 40%, var(--spent)); }
.resist .nt { color: var(--text); font-weight: 500; }

/* Quests: a plain checkbox on the left */
.quest { padding-left: 4px; gap: 6px; }
.quest .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px 0; }
.quest .qn { font: 600 16px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest .qm { display: flex; align-items: center; gap: 6px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); }
.qpips { display: inline-flex; gap: 3px; }
.qpips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--brass); }
.qpips i.lit { background: var(--brass); }
.qm em { font-style: normal; }
.quest.soon .qm em { color: var(--exp); }
.reward { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding-right: 6px; font: 700 11px 'Alegreya Sans', sans-serif; color: var(--exp); }
.reward svg { width: 18px; height: 18px; }
.quest.side .reward { color: #c8a96e; }
.qchk { flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.qchk input { position: absolute; opacity: 0; pointer-events: none; }
.qchk i { width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--chk-r); background: rgba(0,0,0,.4); border: 1.5px solid var(--touch); transition: background .15s, border-color .15s; }
.qchk svg { width: 14px; height: 14px; opacity: 0; color: var(--touch); }
.quest.on .qchk i { background: var(--done); border-color: var(--done-line); }
.quest.on .qchk svg { opacity: 1; }
.quest.on .qn { color: var(--spent); }
.quest.on .reward { opacity: .4; }

/* Log */
.log { margin: 22px 12px 0; padding: 12px 14px 6px; background: var(--frame); border: 1px solid var(--card-line); border-radius: var(--log-r); }
.log h2 { margin: 0 0 6px; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--cap); text-transform: uppercase; }
.log ul { gap: 0; }
.log li { display: block; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.04); font-size: 14px; color: var(--text); }
.log li:first-child { border-top: 0; }
.log li > svg:first-child { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; }
.log .d { color: var(--phys); font-weight: 700; } .log .x { color: var(--exp); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.05); font-size: 12px; font-weight: 700; color: var(--ink); }
.chip svg { width: 11px; height: 11px; }

/* ================= A · Iron ================= */
.t-iron { --bg: #08090b; --frame: #15171c; --card-r: 4px; --btn-r: 3px; --chk-r: 2px; --add-r: 4px; --log-r: 4px;
  --stage: radial-gradient(70% 55% at 72% 50%, #1e2128, transparent 70%); --spent-card: #111317; --resist-card: #121418; --spent-face: #1e2127; --spent-base: #121418; }
.t-iron .row { --rv: #4d525c;
  background: radial-gradient(circle at 6px 6px, var(--rv) 0 1.3px, transparent 1.9px), radial-gradient(circle at 6px calc(100% - 6px), var(--rv) 0 1.3px, transparent 1.9px),
    radial-gradient(circle at calc(100% - 6px) 6px, var(--rv) 0 1.3px, transparent 1.9px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), var(--rv) 0 1.3px, transparent 1.9px),
    linear-gradient(#1e2127, #16181d);
  border-color: #2b2f37; border-top-color: #3b4049; border-bottom-color: #040506; padding: 6px 16px 6px 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 0 rgba(0,0,0,.6);
  --face: linear-gradient(color-mix(in srgb, var(--c) 66%, #2a2a2a), color-mix(in srgb, var(--c) 46%, #050505)); --base: #2c3038;
  --btn-sh: inset 0 0 0 1px #07080a, inset 0 2px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.3); }
.t-iron .row.on, .t-iron .row.resting, .t-iron .resist .row { --rv: #33373f; }
.t-iron .phone .row.on, .t-iron .row.on { background: radial-gradient(circle at 6px 6px, var(--rv) 0 1.3px, transparent 1.9px), radial-gradient(circle at 6px calc(100% - 6px), var(--rv) 0 1.3px, transparent 1.9px),
    radial-gradient(circle at calc(100% - 6px) 6px, var(--rv) 0 1.3px, transparent 1.9px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), var(--rv) 0 1.3px, transparent 1.9px), var(--spent-card); }
.t-iron .row[data-t='true'] { --btn-c: #16140f; --btn-ts: 0 1px 0 rgba(255,255,255,.2); }
.t-iron .row.on[data-t='true'] { --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); --btn-ts: none; }
.t-iron .quest { padding-left: 6px; }
.t-iron .qchk i { box-shadow: inset 1px 1px 0 rgba(0,0,0,.6); }
.t-iron .shead h2::after { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, #4a4f59, transparent); }

/* ================= B · Crypt stone ================= */
.t-stone { --bg: #0a0908; --frame: #181512; --ink: #ece6dc; --text: #a9a196; --touch: #e2e0d8; --spent: #6e6a62; --done: #3d3934; --done-line: #5a544c;
  --card-r: 6px; --btn-r: 4px; --chk-r: 3px; --add-r: 6px; --log-r: 6px; --spent-card: #13110f; --resist-card: #151311; --spent-face: #1c1a17; --spent-base: #0c0b0a;
  --add-bg: rgba(226,224,216,.07); --add-line: rgba(226,224,216,.3); --boss-glow: rgba(235,150,70,.3);
  --stage: radial-gradient(40% 38% at 20% 88%, rgba(235,150,70,.22), transparent 70%), radial-gradient(55% 45% at 78% 28%, rgba(190,200,225,.11), transparent 70%); }
.t-stone .row { background: linear-gradient(#1f1c19, #171512); border-color: #2e2a25; border-bottom-color: #060505; outline: 1px solid rgba(255,235,200,.05); outline-offset: -4px;
  --face: linear-gradient(color-mix(in srgb, var(--c) 20%, #3b3630), color-mix(in srgb, var(--c) 12%, #25221e)); --base: #0c0a09;
  --btn-c: color-mix(in srgb, var(--c) 85%, #fff); --btn-ts: 0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.06);
  --btn-sh: inset 1px 1px 0 rgba(255,240,220,.1), inset -1px 0 0 rgba(0,0,0,.4), inset 0 -2px 0 color-mix(in srgb, var(--c) 70%, transparent); }
.t-stone .row .press { --lip: 4px; }
.t-stone .platform { background: radial-gradient(closest-side, rgba(235,170,100,.16), transparent); }

/* ================= C · Hellforge ================= */
.t-hell { --bg: #080504; --frame: #1a120e; --ink: #eadbb8; --text: #a8937a; --touch: #eadbb8; --cap: #d8b45e; --brass: #d8b45e;
  --bad: #c8402f; --phys: #d0604f; --magic: #ab8dd8; --heal: #92bf88; --spent: #6e5a48; --done: #3a2620; --done-line: #5e3c30; --streak-i: #8d7a62;
  --card-r: 6px; --btn-r: 4px; --chk-r: 3px; --add-r: 6px; --log-r: 6px; --spent-card: #120c0a; --resist-card: #150e0b; --spent-face: #24180f; --spent-base: #100a07;
  --add-c: #f2d8c0; --add-bg: linear-gradient(180deg, #6a1a12, #3e0c08); --add-line: #8a3020; --boss-glow: rgba(220,80,30,.45);
  --stage: radial-gradient(80% 40% at 50% 108%, rgba(200,60,20,.24), transparent 70%), radial-gradient(60% 50% at 72% 40%, rgba(120,50,30,.14), transparent 70%); }
.t-hell .row { background: linear-gradient(#21170f, #160f0b); border: 2px solid #4a3624; border-bottom: 4px solid #241810; box-shadow: 0 0 0 1px #000, inset 0 0 14px rgba(0,0,0,.55);
  outline: 1px dashed rgba(200,150,90,.2); outline-offset: -6px;
  --face: linear-gradient(color-mix(in srgb, var(--c) 72%, #2a1208), color-mix(in srgb, var(--c) 44%, #100503)); --base: #3a2614;
  --btn-sh: inset 0 0 0 1.5px #8a6a40, inset 0 0 0 2.5px rgba(0,0,0,.55), inset 0 3px 3px rgba(255,220,170,.12); }
.t-hell .row[data-t='true'] { --btn-c: #1c130a; --btn-ts: 0 1px 0 rgba(255,240,210,.25); }
.t-hell .row.on[data-t='true'] { --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); --btn-ts: none; }
.t-hell .phone .row.on, .t-hell .row.on { border-color: #33251a; border-bottom-color: #1c120b; }
.t-hell .qchk i { border-color: #b8925a; }
.t-hell .log { border: 2px solid #4a3624; box-shadow: 0 0 0 1px #000; }
.t-hell .shead h2::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid #8a6a40; background: #1a120e; }
.t-hell .platform { background: radial-gradient(closest-side, rgba(220,90,40,.2), transparent); }
.t-hell .uname .cue { border-color: #a8937a; }

/* ================= D · Runic ================= */
.t-rune { --bg: #05070b; --frame: #0e1219; --ink: #e6ebf2; --text: #9aa3b2; --touch: #c9d6ea;
  --card-r: 2px; --btn-r: 3px; --chk-r: 1px; --add-r: 3px; --log-r: 2px; --spent-card: #0b0e14; --resist-card: #0c1017; --spent-face: #141924; --spent-base: #0b0e14;
  --add-bg: rgba(201,214,234,.05); --add-line: rgba(201,214,234,.3); --boss-glow: rgba(110,150,230,.35);
  --stage: radial-gradient(60% 50% at 72% 45%, rgba(90,130,200,.17), transparent 70%); }
.t-rune .row { background: #10141c; border-color: #1f2633; border-bottom-color: #040507; outline: 1px solid rgba(160,190,230,.07); outline-offset: -4px;
  --face: linear-gradient(#192030, #121722); --base: color-mix(in srgb, var(--c) 50%, #000);
  --btn-c: color-mix(in srgb, var(--c) 80%, #fff); --btn-ts: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent);
  --btn-sh: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 22%, transparent); }
.t-rune .row::before, .t-rune .row::after { content: ''; position: absolute; width: 7px; height: 7px; pointer-events: none; border-color: rgba(201,214,234,.35); border-style: solid; }
.t-rune .row::before { top: 2px; left: 2px; border-width: 1px 0 0 1px; }
.t-rune .row::after { bottom: 2px; right: 2px; border-width: 0 1px 1px 0; }
.t-rune .row.on::before, .t-rune .row.on::after, .t-rune .resist .row::before, .t-rune .resist .row::after, .t-rune .row.resting::before, .t-rune .row.resting::after { border-color: rgba(201,214,234,.14); }
.t-rune .press::before { box-shadow: 0 2px 8px color-mix(in srgb, var(--c) 35%, transparent); }
.t-rune .on .press::before, .t-rune .resting .press::before, .t-rune .resist .press::before { box-shadow: none; }
.t-rune .shead h2::before, .t-rune .shead h2::after { content: ''; width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid rgba(201,214,234,.5); }
.t-rune .log { outline: 1px solid rgba(160,190,230,.07); outline-offset: -4px; }

/* ================= E · Pixel-cut ================= */
.t-pixel { --card-r: 0; --btn-r: 0; --chk-r: 0; --add-r: 0; --log-r: 0;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)); }
.t-pixel .row { clip-path: var(--px); border: 0; border-bottom: 3px solid #05060a; background: #171b25;
  box-shadow: inset 2px 2px 0 #283041, inset -2px -2px 0 #0d1017;
  --face: color-mix(in srgb, var(--c) 82%, #000); --base: color-mix(in srgb, var(--c) 36%, #000); --btn-clip: var(--px2);
  --btn-sh: inset 0 2px 0 rgba(255,255,255,.28), inset 2px 0 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25), inset -2px 0 0 rgba(0,0,0,.15); }
.t-pixel .row[data-t='true'] { --btn-c: #1e1c18; --btn-ts: none; }
.t-pixel .row.on[data-t='true'] { --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); }
.t-pixel .phone .row.on, .t-pixel .row.on, .t-pixel .row.resting, .t-pixel .resist .row { box-shadow: inset 2px 2px 0 #1c2230, inset -2px -2px 0 #0a0c12; }
.t-pixel .pp i { transform: none; width: 4px; height: 4px; }
.t-pixel .qchk i { border-width: 2px; clip-path: var(--px2); }
.t-pixel .add, .t-pixel .menu { clip-path: var(--px2); }
.t-pixel .log { clip-path: var(--px); border: 0; box-shadow: inset 2px 2px 0 #232937, inset -2px -2px 0 #0b0d12; }
.t-pixel .bar { border-radius: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>Trim · looks</h1>
  <p class="lede">The Trim structure (cards, press to strike, rank pips, quest checks on the left) in more serious RPG materials. Each phone is the full main screen. Buttons, checks and the Resting fold all work.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// Lucide shapes the app uses (src/components/ui/statIcons.ts).
const SHIELD = '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>';
const LU = {
  physical: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  magic: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  true: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  healing: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  crit: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  armor: SHIELD,
  magicResist: SHIELD + '<path d="M12 22V2"/>',
  streak: '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
  exp: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>',
  gift: '<rect x="3" y="7" width="18" height="4" rx="1"/><path d="M12 7v14"/><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/>',
  quest: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  menu: '<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const COLOR = { physical: 'var(--phys)', magic: 'var(--magic)', true: 'var(--true)', healing: 'var(--heal)', crit: '#d6a24f', armor: '#a8a092', magicResist: '#8d9bd1', streak: 'var(--streak-i)', exp: '#d8b46a', quest: '#a8a092' };
const icon = (name, color = COLOR[name] || 'currentColor') => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:${color}">${LU[name]}</svg>`;
const TYPE_ICON = { heal: 'healing', phys: 'physical', magic: 'magic', true: 'true' };

// HabitList order: healing, physical, magic, true. Rank (0-8) is never lost.
const daily = [
  { n: 'Stretch',       t: 'heal',  d: '141', s: 12, r: 2 },
  { n: 'Morning run',   t: 'phys',  d: '1.1K', s: 23, r: 8, on: true },
  { n: 'Pushups',       t: 'phys',  d: '196', s: 4,  r: 1 },
  { n: 'Read 20 pages', t: 'magic', d: '288', s: 9,  r: 3, on: true },
  { n: 'Meditate',      t: 'true',  d: '74',  s: 0,  r: 0 },
];
const resting = [
  { n: 'Swim',          t: 'phys',  d: '230', s: 5,  r: 1, next: 'Thu' },
  { n: 'Guitar',        t: 'magic', d: '160', s: 3,  r: 0, next: 'Sat' },
];
const weekly = [
  { n: 'Call family',   t: 'heal',  d: '180', s: 0,  r: 0 },
  { n: 'Long hike',     t: 'phys',  d: '1.4K', s: 6, r: 5 },
];
const resist = [
  { n: 'Doomscroll',    t: 'phys',  d: '110', s: 9, r: 1 },
  { n: 'Late snacking', t: 'magic', d: '80',  s: 3, r: 0 },
  { n: 'Takeout',       t: 'magic', d: '150', s: 3, r: 0, week: true },
];
const quests = [
  { n: 'Call the dentist',      p: 1, due: '2 days left', soon: true },
  { n: 'Clear out the attic',   p: 2, due: '4 days left', side: true },
  { n: 'Finish the tax return', p: 3, due: '6 days left' },
];

const row = (h, cls = '') => `<li class="row${h.on ? ' on' : ''}${cls}" data-t="${h.t}" style="--c: var(--${h.t})">
  <span class="nm"><span class="nt">${h.n}</span><span class="pp">${'<i></i>'.repeat(h.r)}</span></span>
  <span class="meta">${h.next ? `<span class="next">${h.next}</span>` : ''}${h.week ? '<span class="tagw">Week</span>' : ''}<span class="streak">${h.s >= 3 ? icon('streak') + h.s : ''}</span></span>
  <button class="press" type="button">${icon(TYPE_ICON[h.t], 'currentColor')}<b>${h.d}</b></button>
</li>`;

const quest = (q) => `<li class="row quest${q.soon ? ' soon' : ''}${q.side ? ' side' : ''}">
  <label class="qchk"><input type="checkbox" aria-label="Complete ${q.n}"><i>${icon('check', 'currentColor')}</i></label>
  <span class="body"><span class="qn">${q.n}</span>
    <span class="qm"><span class="qpips">${[1, 2, 3].map((n) => `<i class="${n <= q.p ? 'lit' : ''}"></i>`).join('')}</span><em>${q.due}</em></span></span>
  <span class="reward">${icon(q.side ? 'gift' : 'exp', 'currentColor')}${q.side ? '+Item' : '+EXP'}</span>
</li>`;

const screen = (id) => `<div class="phone t-${id}">
  <div class="top"><div class="topbar"><span class="cap">Boss #9</span><span class="menu">${icon('menu', 'currentColor')}</span></div>
  <div class="stage">
    <img class="boss" src="../../public/sprites/bosses/balanced@3x.png" alt="">
    <span class="platform"></span>
    <img class="hero" src="../../public/sprites/player/warrior@3x.png" alt="">
    <div class="unit b"><div class="uname">Drifter <span class="cue"></span></div>
      <div class="bar"><b style="width:41%"></b><span>266 / 648</span></div>
      <div class="stats"><span>${icon('physical')}61</span><span>${icon('magic')}58</span><span>${icon('armor')}213</span><span>${icon('magicResist')}221</span><span>${icon('crit')}1%</span></div></div>
    <div class="unit h"><div class="uname">Ryn <small>14</small> <span class="cue"></span></div>
      <div class="bar"><b style="width:62%"></b><i style="width:38%"></i><span>3.56K / 5.74K</span></div>
      <div class="stats"><span>${icon('physical')}1.4K</span><span>${icon('magic')}416</span><span>${icon('healing')}526</span><span>${icon('true')}611</span><span>${icon('crit')}3%</span></div></div>
  </div></div>

  <section class="sec">
    <div class="shead"><h2>Skills</h2><button class="add" type="button">+ New habit</button></div>
    <div class="group">Daily</div>
    <ul>${daily.map((h) => row(h)).join('')}</ul>
    <details class="rest"><summary>Resting <span>${resting.length}</span></summary>
      <ul>${resting.map((h) => row(h, ' resting')).join('')}</ul></details>
    <div class="group">Weekly</div>
    <ul>${weekly.map((h) => row(h)).join('')}</ul>
  </section>

  <section class="sec resist">
    <div class="shead"><h2>Resist</h2></div>
    <ul>${resist.map((h) => row(h)).join('')}</ul>
  </section>

  <section class="sec">
    <div class="shead"><h2>Quests</h2><button class="add" type="button">+ New task</button></div>
    <ul>${quests.map(quest).join('')}</ul>
  </section>

  <section class="log"><h2>Log</h2><ul>
    <li>${icon('physical')}Used "Read 20 pages" — dealt <span class="d">288</span> damage</li>
    <li>${icon('physical')}Used "Morning run" — dealt <span class="d">1.1K</span> damage <span class="chip">${icon('crit')}Crit</span></li>
    <li>${icon('magic')}Missed "Pushups" — took <span class="d">58</span> damage</li>
    <li>${icon('quest')}Completed quest "Book the car service" — gained <span class="x">+120</span> EXP</li>
  </ul></section>
</div>`;

const OPTIONS = [
  { id: 'trim',  tag: 'REFERENCE', n: 'Trim', d: 'Where we are, with rank pips under the name and plain quest checks on the left.' },
  { id: 'iron',  tag: 'A', n: 'Iron', d: 'Riveted iron plates with a lit top edge and hard corners. Damage buttons are dark enamel in an iron setting.' },
  { id: 'stone', tag: 'B', n: 'Crypt stone', d: 'Warm carved stone with a chiselled line inside each card, candle and moon on the stage. Buttons are stone blocks; the damage colour is the carved number and a rune line.' },
  { id: 'hell',  tag: 'C', n: 'Hellforge', d: 'Black leather stitched in bronze, gold titles, blood-red add buttons, hellfire under the stage. Damage buttons are deep enamel in bronze frames.' },
  { id: 'rune',  tag: 'D', n: 'Runic', d: 'Sharp engraved slate with corner marks. Damage buttons are dark runestones lit from inside in their colour, glowing on a coloured lip.' },
  { id: 'pixel', tag: 'E', n: 'Pixel-cut', d: 'Stepped pixel corners and hard bevels, cut to match the sprites and item art. Flat-colour buttons with pixel highlights.' },
];

document.getElementById('grid').innerHTML = OPTIONS.map((o) => `<div class="col">
  <div class="tag">${o.tag}</div><h2>${o.n.toUpperCase()}</h2><p>${o.d}</p>
  ${screen(o.id)}
</div>`).join('');

document.addEventListener('click', (e) => {
  const b = e.target.closest('.press');
  if (b) b.closest('.row').classList.toggle('on');
});
document.addEventListener('change', (e) => {
  if (e.target.matches('.qchk input')) e.target.closest('.row').classList.toggle('on', e.target.checked);
});
</script>
</body>
</html>
