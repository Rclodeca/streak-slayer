<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Trial sets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The trial rework: 12 sets (ladders and two step sets), no one-offs. Three ways to
   show them on the Trials page. Pixel-cut, Midnight (the current Dark). Each phone is
   live: scroll it, tap Claim, tap a set to see its ladder. Player is about day 20. */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1340px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 820px; }
.row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.opt { width: 390px; max-width: 100%; }
.opt h2 { font: 600 13px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 4px; text-transform: uppercase; text-align: center; }
.opt > p { margin: 0 0 12px; font-size: 14.5px; text-align: center; min-height: 80px; }

.phone {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --moon: #dfe0f0; --moon-solid: #b0b1cb; --brass: #d2bb85; --brass-solid: #c7a560; --on-brass: #231c0c;
  --card: #2d2c50; --card-hi: #4d4c7e; --card-lo: #191a28; --card-lip: #0e0e19; --gem: #6fd6ea; --coin: #e9b949;
  --field: #0e0e19; --sunk-hi: #050509; --sunk-lo: #2a2a44;
  --struck-card: #1d1d30; --struck-hi: #2a2a42; --struck-lo: #121220; --struck-ink: #7c7c94;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  position: relative; width: 390px; max-width: 100%; height: 780px; overflow: hidden; background: var(--bg); color: var(--text);
  outline: 1px solid #000; border-radius: 4px; display: flex; flex-direction: column;
}
.phone svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The pinned stage (context only) */
.head { position: relative; flex: none; height: 232px; overflow: hidden; background: #07080c; border-bottom: 3px solid var(--card-lip); box-shadow: 0 10px 18px -8px rgba(0,0,0,.7); z-index: 2; }
.head .room { position: absolute; left: -21px; bottom: 0; width: 432px; max-width: none; image-rendering: pixelated; }
.head .hero { position: absolute; left: 44px; bottom: 26px; width: 128px; height: 128px; image-rendering: pixelated; }
.head .boss { position: absolute; right: 36px; bottom: 26px; width: 128px; height: 128px; image-rendering: pixelated; transform: scaleX(-1); }
.pl { position: absolute; z-index: 2; background: rgba(7,8,12,.88); clip-path: var(--px2); box-shadow: inset 2px 2px 0 #333c52, inset -2px -2px 0 #0c0f15; color: #f0f3f7; }
.purse { left: 8px; top: 8px; display: flex; gap: 10px; padding: 7px 10px; font: 700 14px 'Alegreya', serif; }
.purse span { display: flex; align-items: center; gap: 4px; }
.purse svg { width: 14px; height: 14px; }
.purse .g svg { color: var(--coin); } .purse .m svg { color: var(--gem); }
.btn36 { top: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #dbe2ee; }
.btn36.menu { right: 8px; } .btn36.gift { right: 50px; color: var(--moon); }
.btn36 .cnt { position: absolute; right: 1px; top: 1px; min-width: 16px; height: 16px; padding: 0 3px; background: var(--brass); color: var(--on-brass); font: 800 11px/16px 'Alegreya Sans'; text-align: center; clip-path: var(--px2); }

.body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #3f405a transparent; }
.body > * { flex-shrink: 0; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; background: #0e0e19; border-top: 2px solid #232337; }
.tabs span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 10.5px 'Alegreya Sans'; letter-spacing: .04em; color: #8a8aa6; }

.banner { display: flex; align-items: center; height: 38px; flex: none; margin-bottom: 2px; }
.banner .medal { width: 38px; height: 38px; display: grid; place-items: center; background: var(--card); color: var(--brass); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); position: relative; z-index: 1; }
.banner .cloth { flex: 1; display: flex; align-items: center; justify-content: space-between; height: 28px; margin-left: -4px; padding: 0 22px 0 14px; background: #202a40; box-shadow: inset 0 2px 0 #333c52; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); font: 600 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: #f0f3f7; }
.label { font: 700 11px 'Alegreya Sans'; letter-spacing: .16em; text-transform: uppercase; color: #9a9ab8; margin: 8px 0 0; }

/* Shared bits */
.card { position: relative; background: var(--card); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); color: var(--text); }
.card.ready { box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo), inset 0 0 0 3px color-mix(in srgb, var(--brass) 55%, #000); }
.card.complete { background: var(--struck-card); box-shadow: inset 2px 2px 0 var(--struck-hi), inset -2px -2px 0 var(--struck-lo); }
.card.complete .nm { color: var(--struck-ink); }
.card.complete .sock { opacity: .45; }
.sock { width: 42px; height: 42px; flex: none; display: grid; place-items: center; color: var(--moon-solid); background: #1c1c33; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #0b0b16, inset -2px -2px 0 var(--card-hi); }
.sock svg { width: 22px; height: 22px; }
.nm { font: 700 17px/1.2 'Alegreya', serif; color: var(--text-h); }
.deed { font-size: 13.5px; line-height: 1.3; color: var(--text); }
.st { font: 700 11px 'Alegreya Sans'; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.well { position: relative; height: 14px; background: var(--field); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.well i { position: absolute; left: 2px; top: 2px; bottom: 2px; background: var(--brass); box-shadow: inset 0 2px 0 color-mix(in srgb, var(--brass) 60%, #fff), inset 0 -2px 0 var(--brass-solid); }
.well b { position: absolute; right: 5px; top: 0; bottom: 0; display: flex; align-items: center; font: 800 11px 'Alegreya Sans'; color: var(--text-h); text-shadow: 0 0 3px #000, 0 0 2px #000; }
.pay { display: inline-flex; align-items: center; gap: 8px; font: 700 15px 'Alegreya', serif; color: var(--brass); white-space: nowrap; }
.pay span { display: inline-flex; align-items: center; gap: 3px; }
.pay svg { width: 15px; height: 15px; }
.pay .m svg { color: var(--gem); } .pay .g svg { color: var(--coin); }
.claim { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 0; cursor: pointer; background: var(--brass-solid); color: var(--on-brass); clip-path: var(--px2); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 0 color-mix(in srgb, var(--brass-solid) 55%, #000); font: 800 14px 'Alegreya Sans'; letter-spacing: .04em; }
.claim:active { transform: translateY(1px); }
.pips { display: flex; gap: 3px; }
.pips i { width: 9px; height: 9px; background: #14142a; box-shadow: inset 1px 1px 0 #050509, inset -1px -1px 0 #34345a; }
.pips i.done { background: var(--brass); box-shadow: inset 0 -2px 0 var(--brass-solid); }
.pips i.ready { background: transparent; box-shadow: inset 0 0 0 2px var(--brass); animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .35; } }

/* The full ladder (A's fold-out, B's sheet) */
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ladder li { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 0; border-top: 1px solid #3a3a62; }
.ladder li:first-child { border-top: 0; }
.ladder .mk { width: 22px; height: 22px; flex: none; display: grid; place-items: center; color: var(--on-brass); }
.ladder .mk svg { width: 14px; height: 14px; stroke-width: 3; }
.ladder li.done .mk { background: var(--brass); clip-path: var(--px2); }
.ladder li.ready .mk { box-shadow: inset 0 0 0 2px var(--brass); clip-path: var(--px2); }
.ladder li.todo .mk { color: #6d6d92; }
.ladder li.todo .mk svg { stroke-width: 2; }
.ladder .dd { flex: 1; font-size: 14px; color: var(--text-h); }
.ladder li.done .dd { color: var(--struck-ink); text-decoration: line-through; text-decoration-color: rgba(223,224,240,.3); }
.ladder li.todo .dd { color: #a6a6c4; }
.ladder li.done .pay { opacity: .45; }
.ladder .claim { min-height: 36px; padding: 0 10px; font-size: 13px; }

/* A · Ledger cards */
.a-card { display: flex; flex-direction: column; padding: 10px 12px 12px 10px; cursor: pointer; }
.a-top { display: flex; gap: 12px; align-items: flex-start; }
.a-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.a-nm { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.a-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: center; }
.a-card .ladder { display: none; margin: 10px 0 0 54px; }
.a-card.open .ladder { display: flex; }
.a-card .fold { color: #7f80a3; transition: transform .15s; }
.a-card.open .fold { transform: rotate(180deg); }

/* B · Trophy shelf */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.b-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; text-align: center; cursor: pointer; min-height: 150px; }
.b-tile .nm { font-size: 15px; }
.b-tile .well { align-self: stretch; }
.b-tile .claim { align-self: stretch; min-height: 40px; margin-top: auto; }
.b-tile .pay { margin-top: auto; font-size: 14px; }
.b-tile .done-line { margin-top: auto; }
.sheet-veil { position: absolute; inset: 0; background: rgba(4,4,10,.6); z-index: 6; display: none; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); background: #25244a; box-shadow: inset 0 3px 0 var(--card-hi); transform: translateY(100%); transition: transform .2s; }
.phone.sheet-on .sheet-veil { display: block; }
.phone.sheet-on .sheet { transform: none; }
.sheet .s-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sheet .s-top .nm { flex: 1; font-size: 19px; }
.sheet .x { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--moon); cursor: pointer; }

/* C · Step track */
.c-card { padding: 10px 12px 12px 10px; }
.c-top { display: flex; align-items: center; gap: 12px; }
.c-top .c-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.track { position: relative; display: flex; justify-content: space-between; margin: 12px 2px 0; }
.track::before { content: ''; position: absolute; left: 14px; right: 14px; top: 13px; height: 4px; background: var(--field); box-shadow: inset 0 1px 0 var(--sunk-hi); }
.track .fill { position: absolute; left: 14px; top: 13px; height: 4px; background: var(--brass); }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 30px; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
.node .sq { width: 30px; height: 30px; display: grid; place-items: center; background: #14142a; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #050509, inset -2px -2px 0 #34345a; color: #6d6d92; font: 800 11px 'Alegreya Sans'; }
.node .sq svg { width: 15px; height: 15px; }
.node.done .sq { background: var(--brass); color: var(--on-brass); box-shadow: inset 0 -3px 0 var(--brass-solid); }
.node.done .sq svg { stroke-width: 3; }
.node.ready { cursor: pointer; }
.node.ready .sq { background: var(--brass-solid); color: var(--on-brass); box-shadow: inset 0 0 0 2px #fff3cf; animation: glow 1.2s ease-in-out infinite; }
.node.now .sq { box-shadow: inset 0 0 0 2px var(--moon); color: var(--moon); }
.node .n { font: 800 11px 'Alegreya Sans'; color: #a6a6c4; white-space: nowrap; }
.node.done .n { color: var(--struck-ink); }
.node.now .n, .node.ready .n { color: var(--text-h); }
.c-now { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.c-now .deed { flex: 1; }
.c-card.complete .track .fill, .c-card.complete .node.done .sq { opacity: .5; }

.toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: #07080c; color: var(--moon); padding: 8px 14px; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #333c52; font: 700 13px 'Alegreya Sans'; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 9; display: flex; gap: 6px; align-items: center; }
.toast svg { width: 14px; height: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <h1>Trial sets</h1>
  <p class="lede">The 12 sets, no one-offs. A player about 20 days in: two rungs waiting to be claimed, First steps finished. Each phone is live: tap Claim, tap a set to see its whole ladder.</p>
  <div class="row" id="opts"></div>
</div>
<script>
const S = '../../public/sprites/';
const I = (p) => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
  sword: I('<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>'),
  scroll: I('<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>'),
  store: I('<path d="m2 7 4.41-4.41A2 2 0 0 1 7.830 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/>'),
  anvil: I('<path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>'),
  user: I('<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>'),
  menu: I('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  gift: I('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>'),
  gem: I('<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>'),
  coin: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M9 9.5h4.5a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5H15"/>'),
  check: I('<path d="M20 6 9 17l-5-5"/>'),
  lock: I('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),
  down: I('<path d="m6 9 6 6 6-6"/>'),
  x: I('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  footprints: I('<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/>'),
  trophy: I('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'),
  flame: I('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
  cal: I('<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>'),
  list: I('<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>'),
  shield: I('<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'),
  target: I('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
  sparkles: I('<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>'),
  up: I('<path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>'),
  swords: I('<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>'),
  award: I('<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>'),
};

// The 12 sets. Counter sets: count + goals. Step sets: per-step done flags.
// gold = boss kills at the current boss x the price factor (boss 15, climb I: 152 a kill, nearest 5).
const KILL = 152;
const gold = (k) => Math.max(5, Math.round((k * KILL) / 5) * 5);
const SETS = () => [
  { id: 'steps', name: 'First steps', icon: 'footprints', kind: 'steps', claimed: 3,
    rungs: [{ deed: 'Add a good skill', gems: 4, gold: 0.5, done: true }, { deed: 'Add a bad habit', gems: 4, gold: 0.5, done: true }, { deed: 'Add a quest', gems: 4, gold: 0.5, done: true }] },
  { id: 'bosses', name: 'Bosses slain', icon: 'trophy', count: 14, claimed: 2, deed: (n) => `Slay ${n} boss${n > 1 ? 'es' : ''}`,
    rungs: [[1, 4, 0.5], [5, 4, 0.5], [10, 6, 0.5], [25, 6, 1], [50, 6], [100, 7], [250, 8]] },
  { id: 'streak', name: 'Longest streak', icon: 'flame', count: 9, claimed: 2, deed: (n) => `Keep a skill on a ${n}-day streak`,
    rungs: [[3, 4], [7, 4], [14, 6], [30, 6], [60, 7], [100, 8]] },
  { id: 'perfect', name: 'Perfect days', icon: 'cal', count: 4, claimed: 2, deed: (n) => n === 1 ? 'Check off every daily skill in a day' : `Have ${n} perfect days`,
    rungs: [[1, 4], [3, 4], [7, 6], [15, 6], [30, 7]] },
  { id: 'quests', name: 'Quests completed', icon: 'list', count: 3, claimed: 1, deed: (n) => `Complete ${n} quest${n > 1 ? 's' : ''} on time`,
    rungs: [[1, 4], [3, 4], [10, 6], [25, 7]] },
  { id: 'resist', name: 'Bad habits resisted', icon: 'shield', count: 11, claimed: 1, deed: (n) => `Resist ${n} bad habits`,
    rungs: [[5, 4], [15, 6], [50, 7]] },
  { id: 'crits', name: 'Crits landed', icon: 'target', count: 18, claimed: 1, deed: (n) => `Land ${n} critical hits`,
    rungs: [[5, 4], [25, 6], [100, 7]] },
  { id: 'enchants', name: 'Enchants', icon: 'sparkles', count: 1, claimed: 1, deed: (n) => n === 1 ? 'Enchant an item' : `Enchant ${n} items`,
    rungs: [[1, 6], [3, 6], [6, 7], [10, 7]] },
  { id: 'ranks', name: 'Skill ranks raised', icon: 'up', count: 6, claimed: 2, deed: (n) => n === 1 ? "Raise a skill's rank" : `Raise skill ranks ${n} times`,
    rungs: [[1, 4], [5, 6], [15, 7], [30, 7]] },
  { id: 'epics', name: 'Epic finds', icon: 'gem', count: 0, claimed: 0, deed: (n) => n === 1 ? 'Find an epic item' : `Find ${n} epic items`,
    rungs: [[1, 6], [5, 6], [15, 7], ['relic', 7]] },
  { id: 'untouched', name: 'Untouched kills', icon: 'swords', count: 2, claimed: 1, deed: (n) => n === 1 ? 'Kill a boss that never hurt you' : `Kill ${n} bosses that never hurt you`,
    rungs: [[1, 4], [5, 6], [15, 7]] },
  { id: 'feats', name: 'Feats', icon: 'award', kind: 'steps', claimed: 2,
    rungs: [{ deed: 'Kill a boss with a critical hit', gems: 4, done: true }, { deed: 'Kill a boss with a true damage skill', gems: 4, done: true }, { deed: 'Check off a hard skill before noon', gems: 4, done: false }] },
].map((s) => {
  if (s.kind === 'steps') return s;
  return { ...s, rungs: s.rungs.map(([goal, gems, g]) => ({ goal, gems, gold: g, deed: goal === 'relic' ? 'Find a relic' : s.deed(goal), done: goal !== 'relic' && s.count >= goal })) };
});

// The claim queue for the demo: Bosses slain's 10 and Quests completed's 3 are waiting.
const st = (s, i) => (i < s.claimed ? 'done' : s.rungs[i].done ? 'ready' : 'todo');
const firstReady = (s) => s.rungs.findIndex((_, i) => st(s, i) === 'ready');
const firstOpen = (s) => s.rungs.findIndex((_, i) => st(s, i) !== 'done');
const complete = (s) => s.claimed >= s.rungs.length;
const order = (sets) => [...sets.filter((s) => firstReady(s) >= 0), ...sets.filter((s) => firstReady(s) < 0 && !complete(s)), ...sets.filter(complete)];
const short = (s, r) => r.goal === 'relic' ? 'R' : r.goal ?? '';

const pay = (r) => `<span class="pay"><span class="m">${ICON.gem}${r.gems}</span>${r.gold ? `<span class="g">${ICON.coin}${gold(r.gold)}</span>` : ''}</span>`;
const pips = (s) => `<span class="pips">${s.rungs.map((_, i) => `<i class="${st(s, i)}"></i>`).join('')}</span>`;
const well = (cur, max) => `<span class="well"><i style="width:calc(${Math.min(1, cur / max) * 100}% - 4px)"></i><b>${Math.min(cur, max)} / ${max}</b></span>`;
const claimBtn = (s, cls = '') => `<button type="button" class="claim ${cls}" data-claim="${s.id}">${ICON.gift}Claim</button>`;
// What a set shows for where it stands now.
function now(s) {
  const ri = firstReady(s);
  if (ri >= 0) return { r: s.rungs[ri], line: `<span class="deed">${s.rungs[ri].deed}</span><span class="st">Done</span>` };
  if (complete(s)) return { r: null, line: `<span class="st">All ${s.rungs.length} done</span>` };
  const r = s.rungs[firstOpen(s)];
  if (s.kind === 'steps') return { r, line: `<span class="deed">${r.deed}</span><span class="st">${s.rungs.filter((x) => x.done).length} of ${s.rungs.length}</span>` };
  if (r.goal === 'relic') return { r, line: `<span class="deed">${r.deed}</span><span class="st">Not yet</span>` };
  return { r, line: `<span class="deed">${r.deed}</span>${well(s.count, r.goal)}` };
}
const ladder = (s) => `<ul class="ladder">${s.rungs.map((r, i) => {
  const k = st(s, i);
  const mark = k === 'done' ? ICON.check : k === 'ready' ? '' : (s.kind === 'steps' ? '' : ICON.lock);
  return `<li class="${k}"><span class="mk">${mark}</span><span class="dd">${r.deed}</span>${k === 'ready' ? claimBtn(s) : pay(r)}</li>`;
}).join('')}</ul>`;

// A · Ledger cards: one card a set, the current rung up front, pips for the ladder, tap to fold out.
function cardA(s) {
  const n = now(s);
  const ready = firstReady(s) >= 0;
  return `<div class="card a-card ${ready ? 'ready' : ''} ${complete(s) ? 'complete' : ''}" data-set="${s.id}">
    <div class="a-top"><span class="sock">${ICON[s.icon]}</span>
      <div class="a-mid"><div class="a-nm"><span class="nm">${s.name}</span>${pips(s)}</div>${n.line}</div>
      <div class="a-side">${ready ? claimBtn(s) : n.r ? pay(n.r) : ''}<span class="fold">${ICON.down}</span></div>
    </div>${ladder(s)}</div>`;
}
// B · Trophy shelf: two across, a tile a set; tap opens the ladder in a sheet.
function tileB(s) {
  const n = now(s);
  const ready = firstReady(s) >= 0;
  const bar = !ready && !complete(s) && s.kind !== 'steps' && n.r.goal !== 'relic' ? well(s.count, n.r.goal) : '';
  return `<div class="card b-tile ${ready ? 'ready' : ''} ${complete(s) ? 'complete' : ''}" data-sheet="${s.id}">
    <span class="sock">${ICON[s.icon]}</span><span class="nm">${s.name}</span>${pips(s)}${bar}
    ${ready ? claimBtn(s) : complete(s) ? '<span class="st done-line">All done</span>' : pay(n.r)}</div>`;
}
// C · Step track: the whole ladder as a row of numbered steps, the next one ringed in silver.
function cardC(s) {
  const n = now(s);
  const ready = firstReady(s) >= 0;
  const open = firstOpen(s);
  const last = s.rungs.length - 1;
  const doneTo = s.claimed - 1;
  const fill = doneTo <= 0 ? 0 : (doneTo / last) * 100;
  const nodes = s.rungs.map((r, i) => {
    let k = st(s, i);
    if (k === 'todo' && i === open) k = 'now';
    const inner = k === 'done' ? ICON.check : s.kind === 'steps' ? i + 1 : short(s, r) === 'R' ? ICON.lock : short(s, r);
    const label = s.kind === 'steps' ? '' : r.goal === 'relic' ? 'Relic' : `${r.gems} ${'<span style="color:var(--gem)">◆</span>'}`;
    return `<button type="button" class="node ${k}" ${k === 'ready' ? `data-claim="${s.id}"` : ''}><span class="sq">${inner}</span><span class="n">${label}</span></button>`;
  }).join('');
  return `<div class="card c-card ${ready ? 'ready' : ''} ${complete(s) ? 'complete' : ''}">
    <div class="c-top"><span class="sock">${ICON[s.icon]}</span><div class="c-mid"><span class="nm">${s.name}</span></div>${ready ? '' : n.r ? pay(n.r) : ''}</div>
    <div class="track"><span class="fill" style="width:calc(${fill}% - ${fill ? 28 * fill / 100 : 0}px)"></span>${nodes}</div>
    <div class="c-now">${ready ? `<span class="deed">${n.r.deed}</span>${claimBtn(s)}` : n.line}</div></div>`;
}

const OPTIONS = [
  { key: 'A', name: 'A · Ledger cards', note: 'One card a set, like today\'s trial cards. The rung you\'re on up front with its bar and prize; pips by the name show the whole ladder. Tap a card to fold out every rung. Ready sets rise to the top, finished ones sink.',
    body: (sets) => order(sets).map(cardA).join('') },
  { key: 'B', name: 'B · Trophy shelf', note: 'Two across, a tile a set: icon, name, pips, the bar. The whole page fits in about two screens. Tap a tile for its ladder in a sheet. Claim right on the tile.',
    body: (sets) => `<div class="grid">${order(sets).map(tileB).join('')}</div>` },
  { key: 'C', name: 'C · Step track', note: 'Each set shows its whole ladder as a row of steps with the goal on each and the gems under it. Done steps in brass, the next ringed in silver, a ready one glows: tap it to claim.',
    body: (sets) => order(sets).map(cardC).join('') },
];

const head = () => `<div class="head">
  <img class="room" src="${S}stage/arena6b.png" alt="" />
  <img class="hero" src="${S}player/warrior.png" alt="" />
  <img class="boss" src="${S}bosses/armored.png" alt="" />
  <span class="pl purse"><span class="g">${ICON.coin}<b data-gold>340</b></span><span class="m">${ICON.gem}<b data-gems>68</b></span></span>
  <span class="pl btn36 gift">${ICON.gift}<span class="cnt" data-cnt>2</span></span>
  <span class="pl btn36 menu">${ICON.menu}</span></div>`;
const tabs = () => `<nav class="tabs">${[['Skills', ICON.sword], ['Quests', ICON.scroll], ['Shop', ICON.store], ['Talents', ICON.anvil], ['Hero', ICON.user]].map(([n, i]) => `<span>${i}${n}</span>`).join('')}</nav>`;
const banner = () => `<div class="banner"><span class="medal">${ICON.gift}</span><span class="cloth">Trials</span></div>`;

const root = document.getElementById('opts');
for (const o of OPTIONS) {
  const el = document.createElement('div');
  el.className = 'opt';
  el.innerHTML = `<h2>${o.name}</h2><p>${o.note}</p><div class="phone">${head()}<div class="body"></div>${tabs()}
    <div class="sheet-veil" data-close></div><div class="sheet"></div><div class="toast"></div></div>`;
  root.appendChild(el);
  wire(el, o);
}

function wire(el, o) {
  const sets = SETS();
  const phone = el.querySelector('.phone');
  const body = el.querySelector('.body');
  const sheet = el.querySelector('.sheet');
  const toast = el.querySelector('.toast');
  const opened = new Set();
  let sheetId = null;
  let gemsHeld = 68, goldHeld = 340, timer;
  const say = (html) => { toast.innerHTML = html; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 1500); };
  const paint = () => {
    body.innerHTML = banner() + o.body(sets);
    opened.forEach((id) => body.querySelector(`[data-set="${id}"]`)?.classList.add('open'));
    const waiting = sets.filter((s) => firstReady(s) >= 0).length;
    const cnt = el.querySelector('[data-cnt]');
    cnt.textContent = waiting; cnt.style.display = waiting ? '' : 'none';
    el.querySelector('[data-gems]').textContent = gemsHeld;
    el.querySelector('[data-gold]').textContent = goldHeld;
    if (sheetId) {
      const s = sets.find((x) => x.id === sheetId);
      sheet.innerHTML = `<div class="s-top"><span class="sock">${ICON[s.icon]}</span><span class="nm">${s.name}</span><button type="button" class="x" data-close>${ICON.x}</button></div>${ladder(s)}`;
    }
  };
  el.addEventListener('click', (e) => {
    const c = e.target.closest('[data-claim]');
    if (c) {
      e.stopPropagation();
      const s = sets.find((x) => x.id === c.dataset.claim);
      const r = s.rungs[firstReady(s)];
      s.claimed += 1;
      gemsHeld += r.gems;
      if (r.gold) goldHeld += gold(r.gold);
      say(`<span style="color:var(--gem);display:flex">${ICON.gem}</span>+${r.gems}${r.gold ? ` <span style="color:var(--coin);display:flex">${ICON.coin}</span>+${gold(r.gold)}` : ''}`);
      return paint();
    }
    if (e.target.closest('[data-close]')) { phone.classList.remove('sheet-on'); sheetId = null; return; }
    const sh = e.target.closest('[data-sheet]');
    if (sh) { sheetId = sh.dataset.sheet; paint(); phone.classList.add('sheet-on'); return; }
    const a = e.target.closest('[data-set]');
    if (a) { opened.has(a.dataset.set) ? opened.delete(a.dataset.set) : opened.add(a.dataset.set); a.classList.toggle('open'); }
  });
  paint();
}
</script>
</body>
</html>
