<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Enchanted gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@500;600;700&family=Noto+Sans+Runic&display=swap" />
<style>
/* Character popup > Equipment, rebuilt from the live Ashen (Moonlit) computed
   styles at iPhone width. "Now" is the app as it is (280a11f); A–E restyle
   only the enchanted rows. Open through the dev server so the sprite masks load:
   http://localhost:5173/streak-slayer/docs/mockups/enchanted-gear.html */
:root {
  --bg: #07080c; --frame: #141720; --well: rgba(0, 0, 0, 0.22);
  --text: #a9adb6; --text-h: #e8ebf0; --moon-solid: #a9b4c8;
  --gold: #e6cf9a; --gold-solid: #c8a96e; --gold-rgb: 230, 207, 154;
  --item-slot: 76px; --item-art: 180px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-h); font: 500 16px/1.45 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.18px; }
.page { max-width: 2200px; margin: 0 auto; padding: 30px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; margin: 0 0 6px; }
.lede { text-align: center; color: var(--text); margin: 0 0 24px; }
.cols { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.col { width: 340px; flex: none; }
.key b { display: block; font: 600 11px 'Cinzel', serif; letter-spacing: .18em; color: var(--text-h); margin-bottom: 4px; }
.key { color: var(--text); font-size: 15px; min-height: 92px; margin-bottom: 8px; }
.panel { background: var(--frame); border-radius: 6px; padding: 14px 12px 16px; box-shadow: inset 0 1px 0 rgba(200, 214, 240, .08); }
.group-label { margin: 0 0 8px; font: 600 11.2px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }

/* ---------- The row as it is in the app ---------- */
.gear-list { display: flex; flex-direction: column; gap: .4rem; margin: 0; padding: 0; list-style: none; }
.gear-row { position: relative; display: flex; align-items: center; gap: .6rem; padding: .3rem .6rem; background: var(--well); border-left: 2px solid var(--rarity); border-radius: 4px; }
.gear-icon { position: relative; flex-shrink: 0; width: var(--item-slot); height: var(--item-slot); border: 1px solid color-mix(in srgb, var(--rarity) 55%, transparent); border-radius: 4px; background: radial-gradient(circle, color-mix(in srgb, var(--rarity) 22%, transparent), rgba(0, 0, 0, .55) 72%); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .55), inset 0 0 0 4px color-mix(in srgb, var(--rarity) 22%, transparent), 0 0 14px -6px var(--rarity); }
.gear-art { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
.gear-art img { --rim: color-mix(in srgb, var(--rarity) 55%, #000); position: absolute; left: 50%; top: 50%; width: var(--item-art); height: var(--item-art); transform: translate(-50%, -50%); image-rendering: pixelated; filter: drop-shadow(2px 0 0 var(--rim)) drop-shadow(-2px 0 0 var(--rim)) drop-shadow(0 2px 0 var(--rim)) drop-shadow(0 -2px 0 var(--rim)) drop-shadow(0 0 6px color-mix(in srgb, var(--rarity) 45%, transparent)); }
.gear-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .2rem; }
.gear-name { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .4rem; color: var(--text-h); font: 600 16px 'Alegreya', Georgia, serif; }
.gear-rarity { color: var(--rarity); font: 600 13.6px 'Alegreya Sans', sans-serif; text-transform: capitalize; }
.gear-bonuses { display: flex; flex-wrap: wrap; gap: .2rem .75rem; }
.gear-bonus { display: inline-flex; align-items: center; gap: .3rem; color: var(--moon-solid); font-size: 12.8px; }
.gear-bonus svg { width: 14px; height: 14px; color: var(--k); }
.gear-bonus-label { color: var(--text); }
.gear-effect { color: var(--rarity); font-size: 12px; }
.tag, .tag-cap, .runes, .glint, .spark, .aura { display: none; }

/* Now: a pill and a faint silver glow. */
.opt-now .enchanted { box-shadow: 0 0 12px -6px var(--moon-solid); }
.opt-now .enchanted .tag { display: inline; margin-left: .4rem; padding: 0 .4rem; background: rgba(200, 169, 110, .1); border: 1px solid rgba(200, 169, 110, .5); border-radius: 999px; color: var(--moon-solid); font: 600 12.8px 'Alegreya Sans', sans-serif; }

/* Shared by A–E: an enchanted item's bonuses read in gold. */
.opt-a .enchanted .gear-bonus, .opt-b .enchanted .gear-bonus, .opt-c .enchanted .gear-bonus,
.opt-d .enchanted .gear-bonus, .opt-e .enchanted .gear-bonus { color: var(--gold); font-weight: 600; }
.tag.inline { font: 600 13.6px 'Alegreya Sans', sans-serif; color: var(--gold); }

/* ---------- A · Glint ---------- */
.opt-a .enchanted .tag { display: inline; }
.opt-a .enchanted .tag::before { content: '· '; color: var(--text); }
.opt-a .enchanted .gear-icon { box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .55), inset 0 0 0 4px color-mix(in srgb, var(--rarity) 22%, transparent), 0 0 16px -5px rgba(var(--gold-rgb), .7); }
.opt-a .enchanted .glint {
  display: block; position: absolute; inset: 0;
  -webkit-mask: var(--src) center / var(--item-art) var(--item-art) no-repeat; mask: var(--src) center / var(--item-art) var(--item-art) no-repeat;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 244, 214, .95) 50%, transparent 62%) no-repeat;
  background-size: 300% 100%; animation: glint 4.8s ease-in-out infinite var(--delay, 0s);
}
@keyframes glint { 0%, 55% { background-position: 120% 0; } 85%, 100% { background-position: -20% 0; } }

/* ---------- B · Rune ring ---------- */
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.opt-b .enchanted .tag { display: inline; padding: 0 .45rem; background: rgba(var(--gold-rgb), .08); border: 1px solid rgba(var(--gold-rgb), .45); border-radius: 999px; font-size: 12.8px; }
.opt-b .enchanted .gear-icon::before, .opt-b .enchanted .gear-icon::after { content: ''; position: absolute; inset: -4px; border-radius: 6px; pointer-events: none; }
.opt-b .enchanted .gear-icon::after { border: 1px solid rgba(var(--gold-rgb), .2); }
.opt-b .enchanted .gear-icon::before {
  padding: 1.5px;
  background: conic-gradient(from var(--spin), transparent 0 .5turn, rgba(var(--gold-rgb), .15) .62turn, rgba(255, 240, 205, 1) .74turn, transparent .76turn);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: spin 5s linear infinite var(--delay, 0s);
}
@keyframes spin { to { --spin: 360deg; } }

/* ---------- C · Pixel sparks ---------- */
.opt-c .enchanted .tag { display: inline-flex; align-items: center; gap: 4px; }
.opt-c .enchanted .tag::before { content: ''; width: 6px; height: 6px; background: var(--gold); clip-path: polygon(33% 0, 67% 0, 67% 33%, 100% 33%, 100% 67%, 67% 67%, 67% 100%, 33% 100%, 33% 67%, 0 67%, 0 33%, 33% 33%); }
.opt-c .enchanted .aura { display: block; position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, rgba(var(--gold-rgb), .32), transparent 62%); animation: breathe 3.2s ease-in-out infinite var(--delay, 0s); }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.opt-c .enchanted .spark { display: block; position: absolute; bottom: 14px; width: 4px; height: 4px; background: #fff1cc; box-shadow: 0 0 4px rgba(var(--gold-rgb), .9); opacity: 0; animation: rise 2.8s linear infinite; }
.opt-c .enchanted .spark:nth-of-type(1) { left: 22%; animation-delay: calc(var(--delay, 0s) + 0s); }
.opt-c .enchanted .spark:nth-of-type(2) { left: 64%; width: 2px; height: 2px; animation-delay: calc(var(--delay, 0s) + .9s); }
.opt-c .enchanted .spark:nth-of-type(3) { left: 44%; animation-delay: calc(var(--delay, 0s) + 1.6s); }
.opt-c .enchanted .spark:nth-of-type(4) { left: 78%; width: 2px; height: 2px; animation-delay: calc(var(--delay, 0s) + 2.2s); }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 70% { opacity: .8; } 100% { transform: translateY(-46px); opacity: 0; } }

/* ---------- D · Gilded (no motion) ---------- */
.opt-d .enchanted { background: linear-gradient(90deg, rgba(var(--gold-rgb), .11), rgba(var(--gold-rgb), 0) 75%), var(--well); box-shadow: inset 0 0 0 1px rgba(var(--gold-rgb), .26); }
.opt-d .enchanted .gear-icon { border-color: rgba(var(--gold-rgb), .7); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .55), inset 0 0 0 4px rgba(var(--gold-rgb), .25), 0 0 16px -5px rgba(var(--gold-rgb), .8); }
.opt-d .enchanted .gear-name { color: #f2e2bb; }
.opt-d .enchanted .tag-cap { display: block; margin-bottom: -2px; font: 600 9.5px 'Cinzel', serif; letter-spacing: .26em; color: var(--gold-solid); }

/* ---------- E · Inscribed ---------- */
.opt-e .enchanted .tag { display: inline; }
.opt-e .enchanted .tag::before { content: '· '; color: var(--text); }
.opt-e .enchanted .runes {
  display: block; margin-top: 1px; font: 400 12px 'Noto Sans Runic', serif; letter-spacing: .32em; white-space: nowrap; overflow: hidden;
  background: linear-gradient(90deg, rgba(var(--gold-rgb), .28) 30%, rgba(255, 242, 210, 1) 50%, rgba(var(--gold-rgb), .28) 70%) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: inscribe 5.5s linear infinite var(--delay, 0s);
}
@keyframes inscribe { from { background-position: 100% 0; } to { background-position: 0 0; } }
.opt-e .enchanted .gear-icon { box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .55), inset 0 0 0 4px color-mix(in srgb, var(--rarity) 22%, transparent), 0 0 16px -6px rgba(var(--gold-rgb), .7); }
</style>
</head>
<body>
<div class="page">
  <h1>Enchanted gear</h1>
  <p class="lede">Character popup, Equipment. Axe and Ember Heart are enchanted. A–E also turn the doubled bonuses gold.</p>
  <div class="cols" id="cols"></div>
</div>
<script>
const SPR = '../../public/sprites/items/';
const ICON = {
  sword: ['#d0604f', '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>'],
  shield: ['#a8a092', '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'],
  heart: ['#c33a2e', '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>'],
  heal: ['#92bf88', '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>'],
};
const ITEMS = [
  { id: 'executioners-axe', name: "Executioner's Axe", rarity: 'rare', color: '#7f9fd1', ench: true, delay: '0s', runes: 'ᚺᛖᚨᛞᛊ · ᚠᚨᛚᛚ · ᛒᛖᚠᛟᚱᛖ', bonus: [['sword', '+52%', 'Physical damage'], ['shield', '+300', 'Armor']] },
  { id: 'dragons-heart', name: "Dragon's Heart", rarity: 'rare', color: '#7f9fd1', bonus: [['heart', '+20%', 'Max health'], ['sword', '+10%', 'Physical damage']] },
  { id: 'plate-armor', name: 'Plate Armor', rarity: 'uncommon', color: '#86b08b', bonus: [['heart', '+10%', 'Max health']] },
  { id: 'ember-heart', name: 'Ember Heart', rarity: 'relic', color: '#ec8338', ench: true, delay: '-2.2s', runes: 'ᛖᛗᛒᛖᚱ · ᚾᛖᚢᛖᚱ · ᛞᛁᛖᛊ', effect: 'Heal 5% of max HP each day.', bonus: [['heart', '+20%', 'Max health'], ['heal', '+20%', 'Healing']] },
];
const OPTS = [
  ['now', 'Now', 'A pill under the name and a faint silver glow. The doubled stats look like any other.', 'tag'],
  ['a', 'A · Glint', 'A slow glint runs over the item every few seconds, like light on metal. "Enchanted" sits beside the rarity in gold.', 'tag inline'],
  ['b', 'B · Rune ring', 'A spark of gold circles the slot. Gold pill.', 'tag inline'],
  ['c', 'C · Pixel sparks', 'Gold pixel sparks rise out of the item over a breathing glow. Pixel star before "Enchanted".', 'tag inline'],
  ['d', 'D · Gilded', 'No motion: a gold frame and wash on the row, gold slot, pale gold name, small caps tag above it. Cheapest on Android.', 'tag'],
  ['e', 'E · Inscribed', 'A line of runes under the stats with light running through it, like a live inscription.', 'tag inline'],
];
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="--k:${ICON[k][0]}">${ICON[k][1]}</svg>`;
const row = (it, tagClass) => `
  <li class="gear-row${it.ench ? ' enchanted' : ''}" style="--rarity:${it.color};--src:url('${SPR}${it.id}.png');--delay:${it.delay || '0s'}">
    <span class="gear-icon"><span class="gear-art"><span class="aura"></span><img src="${SPR}${it.id}.png" alt="" /><span class="glint"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></span></span>
    <div class="gear-text">
      <span class="tag-cap">Enchanted</span>
      <span class="gear-name">${it.name} <span class="gear-rarity">${it.rarity}</span><span class="${tagClass}">Enchanted</span></span>
      <span class="gear-bonuses">${it.bonus.map(([k, v, l]) => `<span class="gear-bonus">${svg(k)}${v} <span class="gear-bonus-label">${l}</span></span>`).join('')}</span>
      ${it.effect ? `<span class="gear-effect">${it.effect}</span>` : ''}
      <span class="runes">${it.runes || ''}</span>
    </div>
  </li>`;
document.getElementById('cols').innerHTML = OPTS.map(([k, t, d, tagClass]) => `
  <div class="col opt-${k}">
    <div class="key"><b>${t}</b>${d}</div>
    <div class="panel"><h4 class="group-label">Equipment</h4><ul class="gear-list">${ITEMS.map((it) => row(it, tagClass)).join('')}</ul></div>
  </div>`).join('');
</script>
</body>
</html>
