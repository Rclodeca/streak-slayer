<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Hooded figure flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The hooded figure flow: new hero -> his opening line(s) -> (play) -> his
   death line -> bonfire -> new hero (fallen) -> one short line on return.
   Chrome copied from pixel-death-2.html and pixel-popups.html. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 44px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.col > p { margin: 0 0 10px; min-height: 96px; font-size: 14.5px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; min-height: 30px; }
.sw button { padding: 5px 10px; background: #26282e; border: 1px solid #3a3d46; color: #b8b6b0; font: 700 12px 'Alegreya Sans', sans-serif; cursor: pointer; }
.sw button.on { background: #dbe2ee; color: #12141a; border-color: #dbe2ee; }
button, input { font: inherit; }

.phone {
  --bg: #07080c; --frame: #141720; --well: #0d1017; --ink: #f0f3f7; --text: #a9adb6; --dim: #6a6f7a; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --good: #7fc17a;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --phys: #d0604f; --magic: #ab8dd8; --true: #f1e9d6; --heal: #92bf88;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --sunk: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b;
  --lifted: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo);
  position: relative; width: 390px; padding: 54px 10px 28px; background: radial-gradient(70% 30% at 50% 6%, #1c2230, transparent 70%), var(--bg);
  border: 1px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.phone.modalp::before { content: ''; position: absolute; inset: 0; background: rgba(3,4,6,.6); pointer-events: none; }
.phone > * { position: relative; }
svg.i { width: 14px; height: 14px; flex: none; }
.ic { display: inline-flex; }

/* ---- Popup chrome (pixel-forms / pixel-levelup) ---- */
.modal { clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); padding: 0 12px 14px; }
.mhead { display: flex; align-items: center; min-height: 52px; }
.mhead h3 { margin: 0; flex: 1; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
.mhead.c { justify-content: center; }
.mhead.c h3 { flex: none; }
.mhead.red h3 { color: var(--bad); letter-spacing: .3em; }
.close { width: 40px; height: 40px; margin-right: -4px; display: grid; place-items: center; clip-path: var(--px2); background: rgba(219,226,238,.06); border: 1px solid rgba(219,226,238,.25); color: var(--touch); }
.close svg { width: 16px; height: 16px; }
.lbl { display: block; margin: 14px 2px 8px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.lbl:first-child { margin-top: 2px; }
.well { clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); }
.sock { flex: none; display: grid; place-items: center; clip-path: var(--px2); background: #07090d; box-shadow: inset 0 0 0 2px var(--r, #2a3140), inset 4px 4px 0 #020305; }
.sock svg { width: 20px; height: 20px; }
.ink { color: var(--ink); }

/* Silver key: the main button. --face/--base/--fg set the colour. */
.cta { --lp: 3px; --face: #c8d0dd; --base: #7d8595; --fg: #12141a; --sh: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18);
  position: relative; display: block; width: 100%; margin-top: 18px; height: calc(46px + var(--lp)); padding: 0 8px var(--lp); border: 0; background: none; cursor: pointer;
  font: 700 16px 'Alegreya Sans', sans-serif; color: var(--fg); letter-spacing: .02em; -webkit-tap-highlight-color: transparent; }
.cta::before, .cta::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.cta::before { top: var(--lp); bottom: 0; background: var(--base); }
.cta::after { top: 0; bottom: var(--lp); background: var(--face); box-shadow: var(--sh); transition: top .07s, bottom .07s; }
.cta > span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; transition: transform .07s; }
.cta:active::after { top: var(--lp); bottom: 0; }
.cta:active > span { transform: translateY(var(--lp)); }
.cta.bad { --face: #d4574a; --base: #6e2a24; --fg: #fff; --sh: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.22); }
.cta.good { --face: #7fc17a; --base: #3d6a3a; --fg: #12301a; --sh: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.18); }
.cta[disabled] { --face: #1d2230; --base: #0a0c11; --fg: #5f6470; --sh: inset 0 2px 0 rgba(255,255,255,.06); cursor: default; }
.cta[disabled]::after { top: var(--lp); bottom: 0; }
.cta[disabled] > span { transform: translateY(var(--lp)); }
.back { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 44px; margin-top: 6px; background: none; border: 0; color: var(--text); font: 700 14px 'Alegreya Sans', sans-serif; cursor: pointer; }
.back svg { width: 16px; height: 16px; }

/* Small toggle key ("I did this"): raised, presses down and lights silver when on */
.tk { --lp: 3px; --face: #232a3a; --base: #0a0c11; --fg: var(--touch); position: relative; flex: none; height: calc(34px + var(--lp)); padding: 0 12px var(--lp); border: 0; background: none; cursor: pointer;
  font: 700 13px 'Alegreya Sans', sans-serif; color: var(--fg); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.tk::before, .tk::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.tk::before { top: var(--lp); bottom: 0; background: var(--base); }
.tk::after { top: 0; bottom: var(--lp); background: var(--face); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 2px 0 0 rgba(255,255,255,.05); transition: top .07s, bottom .07s; }
.tk > span { position: relative; z-index: 1; display: inline-block; transition: transform .07s; }
.tk.on { --face: #c8d0dd; --fg: #12141a; }
.tk.on::after { top: var(--lp); bottom: 0; box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18); }
.tk.on > span { transform: translateY(var(--lp)); }

/* Lifted card (as on the main screen), with a tone spine on the left */
.lc { --tone: var(--bad); position: relative; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 8px 8px 16px; clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--lip); box-shadow: var(--lifted); }
.lc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
.lc.ok { --tone: var(--good); }
.lc .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lc .nt { font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); overflow-wrap: anywhere; }
.lc .mt { display: flex; align-items: center; gap: 8px; font: 700 12px 'Alegreya Sans', sans-serif; color: #7c808b; text-transform: capitalize; }
.lc .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.lc .out { font: 800 13px 'Alegreya Sans', sans-serif; color: var(--tone); }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }

/* Rank pips (brass squares, in fours) and quest pips (brass circles) */
.pp { display: flex; gap: 4px; }
.pp i { width: 4px; height: 4px; background: var(--brass); }
.pp i:nth-child(5) { margin-left: 4px; }
.qpips { display: inline-flex; gap: 3px; }
.qpips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--brass); }
.qpips i.lit { background: var(--brass); }
.streak { display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; }


.col > h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.col > p { min-height: 78px; }
.phone { min-height: 760px; }
.phone.full { padding: 0; }
.st { display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.st svg { width: 12px; height: 12px; }
.st.cold { color: var(--dim); font-weight: 500; }
.kept { margin: 16px 2px 10px; text-align: center; text-indent: .24em; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.died { font: 700 34px 'Cinzel', serif; letter-spacing: .2em; text-indent: .2em; color: var(--bad); text-shadow: 0 3px 0 #3a1512, 0 6px 0 #05070a; text-align: center; }
.sub2 { text-align: center; font-size: 14px; color: var(--text); margin: 4px 0 0; }
.cta.late { opacity: 0; animation: fadeup .4s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }

/* ===== E · Shatter ===== */
.sh-wrap { position: relative; height: 230px; margin: 4px 0 0; }
.sh-wrap::before { content: ''; position: absolute; left: 50%; bottom: 14px; width: 150px; height: 10px; margin-left: -75px; background: radial-gradient(closest-side, rgba(212,87,74,.35), transparent); }
.shard-box { position: absolute; left: 50%; bottom: 18px; width: 112px; height: 112px; transform: translateX(-50%) scale(1.6); transform-origin: 50% 100%; filter: grayscale(1) brightness(.75); }
.shard { position: absolute; width: 8px; height: 8px; image-rendering: pixelated; background-size: 112px 112px;
  animation: crumble 1.1s cubic-bezier(.5,0,.9,.6) forwards; animation-delay: var(--d); }
@keyframes crumble { 0% { transform: none; opacity: 1; } 15% { transform: translate(calc(var(--x) * .2), -3px); } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
.sh-wrap .died { position: absolute; left: 0; right: 0; top: 34px; opacity: 0; animation: slam .35s cubic-bezier(.2,1.6,.4,1) 1.5s forwards; }
@keyframes slam { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; transform: none; } }
.sh-wrap .sub2 { position: absolute; left: 0; right: 0; top: 86px; opacity: 0; animation: fadeup .4s 1.8s forwards; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chip { --tone: var(--phys); position: relative; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 10px 0 14px; clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--lip); box-shadow: var(--lifted); opacity: 0; animation: fadeup .35s ease-out forwards; animation-delay: var(--d); }
.chip::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tone); }
.chip .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.chip .nt { font: 600 14.5px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.cold { --tone: #2a3140; background: #141823; box-shadow: none; }
.chip.cold .nt { color: var(--text); }

/* ===== F · Bonfire ===== */
.bf { position: relative; min-height: 760px; padding: 64px 12px 28px; background: radial-gradient(60% 34% at 50% 44%, rgba(224,138,60,.22), transparent 70%), #050609; text-align: center; overflow: hidden; }
.bf .died { font-size: 26px; text-shadow: 0 3px 0 #05070a; }
.fire-stage { position: relative; height: 250px; margin-top: 10px; }
.fire { position: absolute; left: 50%; bottom: 42px; width: 6px; height: 6px; margin-left: -30px; }
.fire i { position: absolute; left: 0; top: 0; width: 6px; height: 6px; opacity: 0; animation: flick .6s steps(1) infinite; }
.fire i:nth-child(1) { opacity: 1; animation-name: flickA; }
.fire i:nth-child(2) { animation-name: flickB; }
@keyframes flickA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes flickB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
.logs { position: absolute; left: 50%; bottom: 30px; width: 84px; height: 14px; margin-left: -42px; }
.logs::before, .logs::after { content: ''; position: absolute; left: 0; right: 0; height: 8px; background: #4a3020; box-shadow: inset 0 2px 0 #6b4630, inset 0 -2px 0 #24160e; }
.logs::before { top: 0; transform: rotate(8deg); } .logs::after { bottom: 0; transform: rotate(-8deg); }
.glow { position: absolute; left: 50%; bottom: 18px; width: 220px; height: 30px; margin-left: -110px; background: radial-gradient(closest-side, rgba(224,138,60,.3), transparent); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .6; } }
.spark { position: absolute; left: calc(50% + var(--x)); bottom: 110px; width: 3px; height: 3px; background: #f2cf6a; box-shadow: 0 0 4px #e08a3c; opacity: 0; animation: rise2 var(--t) linear infinite; animation-delay: var(--d); }
@keyframes rise2 { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -150px); } }
.spirit { position: absolute; left: 20px; bottom: 30px; width: 112px; height: 112px; image-rendering: pixelated; filter: grayscale(1) brightness(1.6) sepia(.2) hue-rotate(180deg); opacity: .28; animation: drift 3.2s ease-in-out infinite; -webkit-mask-image: linear-gradient(#000 40%, transparent 95%); mask-image: linear-gradient(#000 40%, transparent 95%); }
@keyframes drift { 50% { transform: translateY(-6px); opacity: .38; } }
.blade { position: absolute; right: 52px; bottom: 30px; width: 6px; height: 66px; background: linear-gradient(90deg, #8d96a8 50%, #5b6272 50%); clip-path: polygon(0 6px, 50% 0, 100% 6px, 100% 100%, 0 100%); }
.blade::before { content: ''; position: absolute; left: -9px; top: 14px; width: 24px; height: 5px; background: #6b5a3a; }
.mound { position: absolute; left: -12px; right: -12px; bottom: 0; height: 32px; background: #0c0e14; box-shadow: inset 0 3px 0 #171b25; }
.kindle { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
.kindle li { display: grid; justify-items: center; gap: 5px; width: 104px; padding: 10px 6px 8px; clip-path: var(--px); background: #0e1017; box-shadow: inset 0 0 0 1px #2a2418, inset 0 -18px 24px -12px rgba(224,138,60,.18); }
.kindle .fl { width: 22px; height: 22px; color: #e08a3c; filter: drop-shadow(0 0 5px rgba(224,138,60,.7)); animation: breathe 1.8s ease-in-out infinite; animation-delay: var(--d); }
.kindle .fl svg { width: 22px; height: 22px; }
.kindle .n { font: 600 13.5px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.kindle li.cold { box-shadow: inset 0 0 0 1px #1b1f29; }
.kindle li.cold .fl { color: #4a4f5a; filter: none; animation: none; }
.kindle li.cold .n { color: var(--text); }
.kindle .pp { justify-content: center; }

/* ===== G · Continue? ===== */
.ar { position: relative; min-height: 760px; padding: 70px 18px 28px; background: #000; text-align: center; overflow: hidden; }
.ar::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
.ar .died { font-size: 38px; animation: blink2 1.1s steps(1) 3; }
@keyframes blink2 { 50% { opacity: 0; } }
.ar .who { margin: 8px 0 0; font: 700 13px 'Alegreya Sans', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--text); }
.cont { margin: 26px 0 0; font: 600 13px 'Cinzel', serif; letter-spacing: .3em; text-indent: .3em; color: var(--ink); }
.count { display: block; margin: 2px 0 0; font: 700 84px/1 'Cinzel', serif; color: var(--brass); text-shadow: 0 4px 0 #4a3e22, 0 8px 0 #05070a; }
.count.tick { animation: tick .25s ease-out; }
@keyframes tick { from { transform: scale(1.3); opacity: .4; } }
.hs { margin: 24px 0 0; padding: 0; list-style: none; text-align: left; }
.hs .hdr, .hs li { display: grid; grid-template-columns: 22px 1fr auto 40px; gap: 8px; align-items: center; }
.hs .hdr { margin-bottom: 6px; font: 600 9.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--dim); }
.hs li { min-height: 30px; font: 700 14px 'Alegreya Sans', sans-serif; color: var(--ink); text-transform: uppercase; letter-spacing: .06em; opacity: 0; animation: fadeup .2s steps(2) forwards; animation-delay: var(--d); }
.hs li .ix { color: var(--brass); }
.hs li .n { display: flex; gap: 6px; overflow: hidden; white-space: nowrap; }
.hs li .n::after { content: '. . . . . . . . . . . . . . . . . . . .'; color: #2e3340; overflow: hidden; }
.hs li .st { justify-content: flex-end; }
.hs li.cold { color: var(--dim); }
.ar .cta { margin-top: 26px; }
.ar .cta > span { animation: blink2 1s steps(1) infinite; }

/* ===== H · Boss speaks ===== */
.bsp { position: relative; min-height: 760px; padding: 0; overflow: hidden; background: linear-gradient(#170a0b, #0b0d14 60%); }
.bsp .scene { position: relative; height: 420px; }
.bsp .scene::before { content: ''; position: absolute; inset: 0; background: radial-gradient(50% 40% at 62% 62%, rgba(212,87,74,.25), transparent 70%); }
.bsp .boss { position: absolute; left: 58%; bottom: 30px; width: 256px; height: 256px; transform: translateX(-50%); image-rendering: pixelated; animation: loom 4s ease-in-out infinite; }
@keyframes loom { 50% { transform: translateX(-50%) translateY(-4px); } }
.bsp .hero { position: absolute; left: 40px; bottom: 6px; width: 112px; image-rendering: pixelated; transform: rotate(-90deg); transform-origin: 50% 80%; filter: grayscale(1) brightness(.45); }
.bsp .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: #0c0f17; box-shadow: inset 0 3px 0 #1d2230; }
.bsp .tag2 { position: absolute; left: 0; right: 0; top: 64px; }
.dlg { position: relative; margin: -10px 10px 0; padding: 22px 16px 16px; min-height: 150px; clip-path: var(--px); background: #07080c; box-shadow: inset 0 0 0 3px #c8d0dd, inset 0 0 0 5px #07080c, inset 0 0 0 6px #4a5266; cursor: pointer; }
.dlg .speaker { position: absolute; left: 14px; top: -1px; padding: 3px 10px; font: 600 10px 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; color: #12141a; background: #c8d0dd; clip-path: var(--px2); }
.dlg .line { margin: 4px 0 0; font: 600 20px/1.35 'Alegreya', Georgia, serif; color: var(--ink); min-height: 54px; }
.dlg .next { position: absolute; right: 14px; bottom: 10px; color: var(--touch); font-size: 12px; animation: bob .7s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.dlg .embers { margin-top: 6px; }
.embers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ember { display: grid; justify-items: center; gap: 6px; width: 48px; }
.ember .sock { --r: #3a3322; width: 40px; height: 40px; }
.ember .grp { display: grid; grid-template-columns: repeat(4, 4px); gap: 3px; }
.ember .grp i { width: 4px; height: 4px; background: var(--brass); }
.ember.cold .grp i { opacity: .4; }
.bsp .cta { margin: 14px 10px 0; width: calc(100% - 20px); }

/* ===== I · Cairn ===== */
.cn { position: relative; min-height: 760px; padding: 64px 12px 28px; background: radial-gradient(70% 40% at 50% 30%, #1a2030, transparent 70%), #07080c; text-align: center; overflow: hidden; }
.cn .stars { top: 40px; }
.cairn { position: relative; display: flex; flex-direction: column-reverse; align-items: center; gap: 0; margin: 22px 0 0; }
.cairn .ground { width: 100%; height: 14px; background: #10131b; box-shadow: inset 0 3px 0 #1d2230; }
.stone { --w: 200px; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; width: var(--w); height: 42px; padding: 0 10px; margin-top: -3px; clip-path: var(--px); background: #283042; box-shadow: inset 3px 3px 0 #3d4760, inset -3px -3px 0 #161b26; border-bottom: 3px solid #0a0c11;
  opacity: 0; animation: drop2 .32s cubic-bezier(.3,0,.6,1.4) forwards; animation-delay: var(--d); }
@keyframes drop2 { from { opacity: 0; transform: translateY(-80px); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
.stone .nm { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.stone .nt { font: 600 14px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stone .ty { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tone); }
.stone.cold { background: #1a1f2b; box-shadow: inset 3px 3px 0 #262c3b, inset -3px -3px 0 #0f121a; }
.stone.cold .nt { color: var(--text); }
.stone.cold::after { content: ''; position: absolute; left: 46%; top: 0; width: 14px; height: 100%; background: #07080c; clip-path: polygon(40% 0, 70% 0, 45% 35%, 75% 55%, 40% 100%, 25% 100%, 55% 58%, 25% 36%); }
.cairn .top { position: relative; width: 26px; height: 40px; margin-bottom: -3px; opacity: 0; animation: fadeup .4s forwards; animation-delay: var(--d); }
.cairn .top .flame { position: absolute; left: 3px; top: 0; width: 20px; height: 20px; color: #c8d0dd; filter: drop-shadow(0 0 8px rgba(200,208,221,.8)); animation: breathe 2s ease-in-out infinite; }
.cairn .top .flame svg { width: 20px; height: 20px; }
.cairn .top::after { content: ''; position: absolute; left: 9px; bottom: 0; width: 8px; height: 18px; background: #3d4760; box-shadow: inset -2px 0 0 #161b26; }
.cn .who { margin: 4px 0 0; font: 600 18px 'Alegreya', Georgia, serif; color: var(--ink); }
.cn .meta { margin: 2px 0 0; font-size: 14px; }
.cn .died { font-size: 22px; letter-spacing: .3em; text-shadow: 0 2px 0 #05070a; }
/* ================= 1 · Start screen ================= */
.start { text-align: center; padding: 4px 4px 0; }
.start .eyebrow { margin: 0; font-size: 14.5px; color: var(--text); }
.start .title { margin: 6px 0 0; font: 700 27px/1.1 'Cinzel', serif; letter-spacing: .16em; text-indent: .16em; color: var(--ink); text-shadow: 0 2px 0 #05070a; }
.start .rule { width: 56px; height: 4px; margin: 10px auto 0; background: var(--brass); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
.stage { position: relative; height: 196px; margin: 12px -10px 0; overflow: hidden; background: #0c0f17; border-top: 3px solid var(--lip); border-bottom: 3px solid var(--lip); }
.stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(closest-side at 50% 68%, rgba(255,255,255,.1), rgba(255,255,255,.03) 70%, transparent); }
.stars { position: absolute; left: 0; top: 4px; width: 2px; height: 2px; background: transparent;
  box-shadow: 40px 20px #3a4358, 120px 12px #2c3446, 230px 30px #3a4358, 300px 10px #4a5470, 352px 52px #2c3446, 200px 60px #2c3446, 70px 70px #232a39, 330px 80px #3a4358, 20px 50px #2c3446; }
.plinth { position: absolute; left: 50%; bottom: 20px; width: 132px; height: 18px; margin-left: -66px; }
.plinth::before { content: ''; position: absolute; inset: 0; clip-path: polygon(6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, 100% 3px, 100% 100%, 0 100%, 0 3px, 6px 3px);
  background: #1f2534; box-shadow: inset 0 3px 0 #3a4358, inset 0 6px 0 #283041, inset 0 -3px 0 #10141d; }
.stage .hero { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); image-rendering: pixelated; filter: drop-shadow(0 0 12px rgba(0,0,0,.8)); }
.stage .hero.fated { filter: brightness(0) drop-shadow(0 0 10px rgba(216,180,106,.35)); opacity: .85; }
.stage .fm { position: absolute; left: 0; right: 0; bottom: 78px; text-align: center; font: 700 40px 'Cinzel', serif; color: var(--brass); text-shadow: 0 2px 0 #05070a; }
.turn { --lp: 3px; position: absolute; top: 50%; width: 46px; height: calc(46px + var(--lp)); margin-top: -26px; padding: 0 0 var(--lp); border: 0; background: none; color: var(--touch); cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
.turn::before, .turn::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.turn::before { top: var(--lp); bottom: 0; background: #0a0c11; }
.turn::after { top: 0; bottom: var(--lp); background: #232a3a; box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 2px 0 0 rgba(255,255,255,.05); transition: top .07s, bottom .07s; }
.turn svg { position: relative; z-index: 1; width: 22px; height: 22px; transition: transform .07s; }
.turn:active::after { top: var(--lp); bottom: 0; } .turn:active svg { transform: translateY(var(--lp)); }
.turn.l { left: 10px; } .turn.r { right: 10px; }
.pname { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 0; font: 600 12px 'Cinzel', serif; letter-spacing: .24em; text-indent: .24em; color: var(--ink); text-transform: uppercase; }
.pname svg { width: 16px; height: 16px; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 9px 0 0; }
.dots i { width: 6px; height: 6px; background: #2a3140; }
.dots i.on { background: var(--touch); }
.oath { margin-top: 16px; text-align: left; padding: 12px; clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); }
.oath h2 { margin: 2px 0 0; text-align: center; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-indent: .24em; text-transform: uppercase; color: var(--ink); }
.oath .fell { margin: 6px 0 0; text-align: center; font-size: 14px; color: var(--text); }
.name { width: 100%; height: 50px; padding: 0 14px; clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); border: 0; color: var(--ink); font: 600 17px 'Alegreya', Georgia, serif; outline: none; }
.name::placeholder { color: var(--dim); font-weight: 500; }
.name:focus { box-shadow: var(--sunk), inset 0 0 0 2px rgba(219,226,238,.5); }
.rules { margin: 14px 0 0; padding: 4px 8px; list-style: none; }
.rules li { display: grid; grid-template-columns: 34px 52px 1fr; align-items: center; gap: 8px; padding: 8px 0; }
.rules li + li { border-top: 1px solid rgba(255,255,255,.05); }
.rules .sock { width: 34px; height: 34px; }
.rules .sock svg { width: 16px; height: 16px; }
.rules b { font: 600 11px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.rules span.tx { font-size: 14.5px; color: var(--text); }


.wrap { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; }
.side { width: 360px; }
.side h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 8px; text-transform: uppercase; }
.side p { margin: 0 0 12px; font-size: 14.5px; }
.steps { display: flex; flex-direction: column; gap: 6px; margin: 0 0 22px; }
.steps button { display: flex; gap: 10px; align-items: center; padding: 8px 10px; text-align: left; background: #26282e; border: 1px solid #3a3d46; color: #b8b6b0; font: 700 13px 'Alegreya Sans', sans-serif; cursor: pointer; }
.steps button b { width: 18px; color: #8f8b80; }
.steps button.on { background: #dbe2ee; color: #12141a; border-color: #dbe2ee; }
.steps button.on b { color: #12141a; }
.sets { display: flex; gap: 6px; margin: 0 0 10px; }
.sets button { padding: 5px 10px; background: #26282e; border: 1px solid #3a3d46; color: #b8b6b0; font: 700 12px 'Alegreya Sans', sans-serif; cursor: pointer; }
.sets button.on { background: #dbe2ee; color: #12141a; border-color: #dbe2ee; }
.lines { margin: 0; padding: 10px 12px; background: #202227; border: 1px solid #33363e; font-size: 14px; }
.lines dt { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: #8f8b80; margin-top: 8px; }
.lines dt:first-child { margin-top: 0; }
.lines dd { margin: 2px 0 0; color: #ece8de; font-family: 'Alegreya', Georgia, serif; font-size: 15px; }

/* the figure's scenes */
.phone.full { padding: 0; }
.fig { position: relative; min-height: 760px; overflow: hidden; background: linear-gradient(#120a10, #0b0d14 60%); cursor: pointer; }
.fig .scene { position: relative; height: 500px; }
.fig .scene::before { content: ''; position: absolute; inset: 0; background: radial-gradient(50% 40% at 62% 62%, rgba(171,141,216,.18), transparent 70%); }
.fig.death .scene::before { background: radial-gradient(50% 40% at 62% 62%, rgba(212,87,74,.25), transparent 70%); }
.fig .boss { position: absolute; left: 60%; bottom: 30px; width: 256px; height: 256px; transform: translateX(-50%); image-rendering: pixelated; animation: loom 4s ease-in-out infinite; }
.fig .me { position: absolute; left: 70px; bottom: 30px; width: 112px; transform: translateX(-50%); image-rendering: pixelated; }
.fig.death .me { left: 80px; bottom: 4px; transform: translateX(-50%) rotate(-90deg); transform-origin: 50% 50%; filter: grayscale(1) brightness(.45); }
.fig .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: #0c0f17; box-shadow: inset 0 3px 0 #1d2230; }
.fig .dlg { margin-top: -10px; min-height: 130px; }
.fig .dots2 { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 5px; }
.fig .dots2 i { width: 5px; height: 5px; background: #2a3140; } .fig .dots2 i.on { background: var(--touch); }
.skip { position: absolute; right: 12px; top: 54px; z-index: 2; padding: 0 12px; height: 34px; background: none; border: 1px solid rgba(219,226,238,.2); color: var(--text); font: 700 12px 'Alegreya Sans', sans-serif; cursor: pointer; }
.fig .next.done { animation: bob .7s steps(2) infinite; } .fig .next:not(.done) { opacity: 0; }

/* play placeholder */
.play { min-height: 760px; display: grid; place-content: center; gap: 14px; padding: 0 30px; text-align: center; background: repeating-linear-gradient(0deg, #11141c 0 64px, #0b0d13 64px 72px); }
.play p { margin: 0; font-size: 14.5px; color: var(--text); }
.play .cta { width: 240px; margin: 0 auto; }

/* bonfire, calmer: no "You died" */
.bf { padding-top: 70px; }
.bf .ep { margin: 0; font: 600 18px 'Alegreya', Georgia, serif; color: var(--ink); }
.bf .ep2 { margin: 2px 0 0; font-size: 14px; color: var(--text); }

/* start screen in a full phone */
.phone.start-p { padding: 54px 10px 28px; }
</style>
</head>

<div class="page">

  <p class="lede">One phone, the whole path. Tap the text box to finish a line, tap again for the next. Death and return lines are random: revisit those steps to hear another.</p>
  <div class="wrap">

    <div class="side">
      <h2>Steps</h2>
      <div class="steps" id="steps"></div>
      <h2>Lines</h2>
      <dl class="lines" id="lines"></dl>
    </div>
  </div>
</div>

1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742\"/><path d=\"m2 2 20 20\"/><path d=\"M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05\"/>","wounds":"<path d=\"M10 10.01h.01\"/><path d=\"M10 14.01h.01\"/><path d=\"M14 10.01h.01\"/><path d=\"M14 14.01h.01\"/><path d=\"M18 6v12\"/><path d=\"M6 6v12\"/><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"/>","reflect":"<path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11\"/>","badgeCheck":"<path d=\"M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z\"/><path d=\"m9 12 2 2 4-4\"/>","left":"<path d=\"m15 18-6-6 6-6\"/>","right":"<path d=\"m9 18 6-6-6-6\"/>","x":"<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>","plus":"<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>","feather":"<path d=\"M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z\"/><path d=\"M16 8 2 22\"/><path d=\"M17.5 15H9\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","clock":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/>","bossHit":"<polyline points=\"14.5 17.5 3 6 3 3 6 3 17.5 14.5\"/><line x1=\"13\" x2=\"19\" y1=\"19\" y2=\"13\"/><line x1=\"16\" x2=\"20\" y1=\"16\" y2=\"20\"/><line x1=\"19\" x2=\"21\" y1=\"21\" y2=\"19\"/><polyline points=\"14.5 6.5 18 3 21 3 21 6 17.5 9.5\"/><line x1=\"5\" x2=\"9\" y1=\"14\" y2=\"18\"/><line x1=\"7\" x2=\"4\" y1=\"17\" y2=\"20\"/><line x1=\"3\" x2=\"5\" y1=\"19\" y2=\"21\"/>","lock":"<rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 9.9-1\"/>","flame":"<path d=\"M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4\"/>"};
const SPR = '../../public/sprites/';
const icon = (n, col) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${col ? ` style="color:${col}"` : ''}>${LU[n]}</svg>`;
// The app's Moonlit icon colours.
const C = { phys: '#d0604f', magic: '#ab8dd8', true: '#f1e9d6', heal: '#92bf88', streak: '#8d8475', exp: '#d8b46a', gold: '#c8a96e', steel: '#a8a092', violet: '#a58bd0', crit: '#d6a24f', health: '#c33a2e' };
const pips = (n) => `<span class="qpips">${[1, 2, 3].map((k) => `<i class="${k <= n ? 'lit' : ''}"></i>`).join('')}</span>`;
const rankPips = (n) => `<span class="pp">${Array.from({ length: n }, () => '<i></i>').join('')}</span>`;
const closeKey = `<span class="close">${icon('x')}</span>`;



const C2 = C;
const BOSS = `${SPR}bosses/hooded.png`, HERO = `${SPR}player/warrior.png`;
const SK = [['Meditate', 'phys', 6, 21], ['Stretch', 'magic', 5, 14], ['Journal', 'true', 4, 9], ['Drink water', 'heal', 3, 6], ['Call a friend', 'phys', 2, 0], ['Read a chapter', 'magic', 1, 2]];
const streak = (s) => s ? `<span class="st">${icon('streak', C.streak)}${s}</span>` : '<span class="st cold">—</span>';
const rnd = (a, b) => a + Math.random() * (b - a);

// The opening is fixed (Mocking); death and return lines are drawn at random,
// never the same one twice in a row. Numbers are the run's real ones.
const INTRO = ['Habits, is it?', 'How sweet.', 'Let’s see how long they hold.'];
const DEATH = ['Fourteen levels… and still you fall.', 'Boss nine. Further than most.', 'They always come back.'];
const BACK = ['Back so soon.', 'Again? Good.', 'You again.'];
const last = {};
const pick = (pool, key) => { let i; do { i = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && i === last[key]); last[key] = i; return [pool[i]]; };
let step = 0, timer;

const STEPS = [
  ['New hero', 'start'], ['His opening', 'intro'], ['Weeks of play', 'play'], ['His death line', 'death'], ['Bonfire', 'fire'], ['New hero, after a death', 'start2'], ['His return line', 'back'],
];
const ph = document.getElementById('ph');

function go(i) { step = i; clearInterval(timer); drawSide(); SCREENS[STEPS[i][1]](); }
const next = () => go(Math.min(step + 1, STEPS.length - 1));

// Text box with tap-to-finish, tap-to-advance. lines = 1..3 strings.
function speech(lines, kind) {
  let li = 0, k = 0, done = false;
  ph.className = 'phone full';
  ph.innerHTML = `<div class="fig ${kind === 'death' ? 'death' : ''}"><div class="scene">
    ${kind === 'death' ? '<div class="died" style="position:absolute;left:0;right:0;top:64px;font-size:26px">You died</div>' : ''}
    <img class="boss" src="${BOSS}" alt="" /><img class="me" src="${HERO}" alt="" /><div class="floor"></div></div>
    <div class="dlg"><span class="speaker">???</span><p class="line"></p><span class="next">▼</span>
    ${lines.length > 1 ? `<span class="dots2">${lines.map(() => '<i></i>').join('')}</span>` : ''}</div></div>`;
  const line = ph.querySelector('.line'), arrow = ph.querySelector('.next'), dots = ph.querySelectorAll('.dots2 i');
  const type = () => {
    k = 0; done = false; arrow.classList.remove('done');
    dots.forEach((d, j) => d.classList.toggle('on', j <= li));
    const t = lines[li];
    timer = setInterval(() => { line.textContent = t.slice(0, ++k); if (k >= t.length) finish(); }, 42);
  };
  const finish = () => { clearInterval(timer); line.textContent = lines[li]; done = true; arrow.classList.add('done'); };
  ph.querySelector('.fig').addEventListener('click', () => {
    if (!done) return finish();
    if (li < lines.length - 1) { li++; type(); } else next();
  });
  type();
}

const SCREENS = {
  start() { startScreen(false); },
  start2() { startScreen(true); },
  intro() { speech(INTRO, 'intro'); },
  death() { speech(pick(DEATH, 'death'), 'death'); },
  back() { speech(pick(BACK, 'back'), 'back'); },
  play() {
    ph.className = 'phone full';
    ph.innerHTML = `<div class="play"><p>Weeks of habits later…</p><button class="cta bad" type="button"><span>Die</span></button></div>`;
    ph.querySelector('.cta').onclick = next;
  },
  fire() {
    ph.className = 'phone full';
    const sparks = Array.from({ length: 14 }, () => `<i class="spark" style="--x:${rnd(-24, 24).toFixed(0)}px;--dx:${rnd(-30, 30).toFixed(0)}px;--t:${rnd(1.6, 3).toFixed(1)}s;--d:${rnd(0, 3).toFixed(1)}s"></i>`).join('');
    ph.innerHTML = `<div class="bf"><p class="ep">Aldric</p><p class="ep2">Level 14 Warrior · Boss 9</p>
      <div class="fire-stage"><span class="stars"></span><div class="mound"></div><span class="glow"></span>
        <img class="spirit" src="${HERO}" alt="" /><span class="blade"></span>
        <span class="logs"></span><span class="fire"><i style="box-shadow:${flameFrame(FLAME[0])}"></i><i style="box-shadow:${flameFrame(FLAME[1])}"></i></span>${sparks}</div>
      <p class="kept">Your skills keep their power</p>
      <ul class="kindle">${SK.map(([n, t, r, s], i) => `<li class="${s ? '' : 'cold'}"><span class="fl" style="--d:${(i * 0.3).toFixed(1)}s">${icon('flame')}</span><span class="n">${n}</span>${rankPips(r)}${streak(s)}</li>`).join('')}</ul>
      <button class="cta" type="button"><span>Rise again</span></button></div>`;
    ph.querySelector('.cta').onclick = next;
  },
};

const FLAME = [
  ['....r....', '...ror...', '..royor..', '..ryyyr..', '.roywyor.', '.rywwwyr.', 'roywwwyor', 'ryywwwyyr', 'royyyyyor', '.rooyoor.'],
  ['...r.....', '...ro....', '..roor...', '..royyr..', '.royyyor.', '.rywwwyr.', 'roywwwyor', 'ryywwwyyr', 'roywyyyor', '.rooooor.'],
];
const FC = { r: '#b8402f', o: '#e08a3c', y: '#f2cf6a', w: '#fff3c4' };
const flameFrame = (rows) => rows.flatMap((row, y) => [...row].map((c, x) => c === '.' ? null : `${x * 6}px ${(y - rows.length) * 6}px 0 ${FC[c]}`)).filter(Boolean).join(',');

function startScreen(fallen) {
  ph.className = 'phone start-p';
  const RULES = [['sword', 'Keep', C.phys, 'A habit kept strikes the boss.'], ['swords', 'Break', C.health, 'A habit broken, the boss strikes back.'], ['levelUp', 'Rise', C.exp, 'Each boss slain makes you stronger.']];
  ph.innerHTML = `<div class="start">
    <p class="eyebrow">${fallen ? 'The fire still burns.' : 'Every habit is a weapon.'}</p>
    <h1 class="title" style="margin-top:6px;font-size:27px;letter-spacing:.16em">StreakSlayer</h1><div class="rule"></div>
    <div class="stage"><span class="stars"></span><span class="plinth"></span><img class="hero" src="${HERO}" alt="" />
      <button class="turn l" type="button">${icon('left')}</button><button class="turn r" type="button">${icon('right')}</button></div>
    <p class="pname">${icon('sword', C.phys)}Warrior</p><div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="oath"><h2>${fallen ? 'A new hero rises' : 'A new hero'}</h2>
      <span class="lbl">Name</span><input class="name" placeholder="Hero" maxlength="20" value="${fallen ? '' : 'Aldric'}" />
      ${fallen ? '' : `<ul class="rules well">${RULES.map(([ic, t, c, x]) => `<li><span class="sock">${icon(ic, c)}</span><b>${t}</b><span class="tx">${x}</span></li>`).join('')}</ul>`}
      <button class="cta" type="button"><span>${fallen ? 'Rise' : 'Begin'}</span></button></div></div>`;
  ph.querySelector('.cta').onclick = next;
}

function drawSide() {
  document.getElementById('steps').innerHTML = STEPS.map(([n], i) => `<button type="button" class="${i === step ? 'on' : ''}" data-i="${i}"><b>${i + 1}</b>${n}</button>`).join('');
  document.getElementById('lines').innerHTML = `<dt>Opening · in order</dt>${INTRO.map((l) => `<dd>${l}</dd>`).join('')}<dt>Death · one at random</dt>${DEATH.map((l) => `<dd>${l}</dd>`).join('')}<dt>Return · one at random</dt>${BACK.map((l) => `<dd>${l}</dd>`).join('')}`;
}
document.getElementById('steps').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });
go(+(location.hash.slice(1) || 0));
</script>
