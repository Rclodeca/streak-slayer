<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Hero pick after prestige</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The new-hero screen after a prestige: the name stays, only the hero is picked. First launch beside it for contrast. */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6c4; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 900px; margin: 0 auto; }
h1.mock { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 24px; }
.row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
figure { margin: 0; }
figcaption { text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-top: 8px; text-transform: uppercase; }

.phone {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --border: #414163; --code-bg: #202030;
  --accent: #dfe0f0; --phys: #e86154; --magic: #8f7cf0; --true: #f0d36a; --danger: #e86154;
  width: 375px; min-height: 740px; padding: 4vh 16px 2rem; background: var(--bg); color: var(--text);
  border: 1px solid #232337; display: flex; flex-direction: column; align-items: center; text-align: center;
}
.eyebrow { margin: 0; font-size: .9rem; }
.game-title { margin: .35rem 0 0; color: var(--text-h); font: 700 2rem/1.1 'Cinzel', serif; letter-spacing: .02em; }
.hero-pick { position: relative; width: 100%; display: flex; justify-content: center; user-select: none; }
.bonfire { position: relative; isolation: isolate; width: 100%; max-width: 340px; height: 210px; margin: .75rem 0 0; display: flex; align-items: flex-end; justify-content: center; }
.bonfire::before { content: ''; position: absolute; z-index: -1; inset: 12% 18% 0; background: radial-gradient(closest-side at 50% 62%, rgba(255,255,255,.1), rgba(255,255,255,.03) 70%, transparent); }
.bonfire::after { content: ''; position: absolute; z-index: -1; left: 32%; right: 32%; bottom: 12px; height: 10px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%); }
.pick-hero { width: 150px; height: 150px; margin-bottom: 8px; display: grid; place-items: end center; }
.pick-hero img { width: 150px; height: 150px; image-rendering: pixelated; }
.turn { position: absolute; top: 50%; width: 48px; height: 48px; margin-top: -24px; display: grid; place-items: center; border: 0; background: none; color: var(--accent); cursor: pointer; }
.turn-prev { left: 0; } .turn-next { right: 0; }
.pick-name { margin: .4rem 0 0; display: flex; align-items: center; justify-content: center; gap: .5rem; color: var(--text-h); font-size: .85rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
.pick-name svg { color: var(--phys); }
.pick-dots { display: flex; justify-content: center; gap: 10px; margin: .5rem 0 1rem; }
.pick-dots i { width: 6px; height: 6px; border: 1px solid var(--border); border-radius: 50%; }
.pick-dots i.on { background: var(--accent); border-color: var(--accent); }
.oath { width: 100%; text-align: left; }
.oath-title { margin: 0 0 1rem; color: var(--text-h); font: 600 1.1rem 'Alegreya', serif; text-align: center; }
.fell { margin: -.35rem 0 1rem; font-size: .9rem; text-align: center; }
.field { display: block; margin-bottom: 1.25rem; }
.field-label { display: block; margin-bottom: .4rem; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
.name-input { width: 100%; padding: .8rem 1rem; background: var(--code-bg); border: 1px solid var(--border); color: var(--text-h); font: inherit; font-size: 1.1rem; }
.rules { list-style: none; margin: 0 0 1.25rem; padding: 0; display: grid; gap: .7rem; }
.rules li { display: flex; gap: .7rem; align-items: flex-start; font-size: .9rem; }
.rules b { color: var(--text-h); margin-right: .3rem; }
.rules svg { flex: none; margin-top: 1px; }
.begin { display: block; width: 100%; min-height: 48px; border: 0; background: #dfe0f0; color: #14141e; font: 800 1rem 'Alegreya Sans', sans-serif; letter-spacing: .06em; cursor: pointer; }
</style>
</head>
<body>
<div class="page">
  <h1 class="mock">Hero pick after prestige</h1>
  <div class="row">
    <figure>
      <div class="phone" id="after"></div>
      <figcaption>After prestige · name kept</figcaption>
    </figure>
    <figure>
      <div class="phone" id="first"></div>
      <figcaption>First launch · unchanged</figcaption>
    </figure>
  </div>
</div>
<template id="screen">
  <p class="eyebrow"></p>
  <h1 class="game-title">StreakSlayer</h1>
  <div class="hero-pick">
    <button type="button" class="turn turn-prev" aria-label="Previous hero"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="bonfire"><div class="pick-hero"><img alt="" /></div></div>
    <button type="button" class="turn turn-next" aria-label="Next hero"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <p class="pick-name"></p>
  <div class="pick-dots"><i></i><i></i><i></i><i></i></div>
  <div class="oath">
    <h2 class="oath-title"></h2>
    <p class="fell"></p>
    <label class="field"><span class="field-label">Name</span><input class="name-input" placeholder="Hero" /></label>
    <ul class="rules">
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dfe0f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg><span><b>Keep</b>A habit kept strikes the boss.</span></li>
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e86154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4"/><path d="m7 17-3 3"/><path d="m3 19 2 2"/></svg><span><b>Break</b>Miss a habit and the boss strikes you.</span></li>
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4f4fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg><span><b>Rise</b>Each boss slain makes you stronger.</span></li>
    </ul>
    <button type="button" class="begin"></button>
  </div>
</template>
<script>
const PICKS = [
  { key: 'warrior', name: 'Warrior', color: '#e86154', icon: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>' },
  { key: 'cleric', name: 'Mage', color: '#8f7cf0', icon: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/>' },
  { key: 'ranger', name: 'Ranger', color: '#f0d36a', icon: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>' },
  { key: 'fate', name: 'Fate', color: '#dfe0f0', icon: '<rect width="12" height="12" x="2" y="10" rx="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/>' },
];
function build(id, prestiged) {
  const root = document.getElementById(id);
  root.append(document.getElementById('screen').content.cloneNode(true));
  root.querySelector('.eyebrow').textContent = prestiged ? 'The fire still burns.' : 'Every habit is a weapon.';
  root.querySelector('.oath-title').textContent = prestiged ? 'Aldric rises again' : 'A new hero';
  const fell = root.querySelector('.fell');
  if (prestiged) fell.textContent = 'Retired at level 31. Your habits remain.'; else fell.remove();
  if (prestiged) root.querySelector('.field').remove();
  root.querySelector('.begin').textContent = prestiged ? 'Rise' : 'Begin';
  let i = 0;
  const draw = () => {
    const p = PICKS[i];
    const img = root.querySelector('.pick-hero img');
    img.src = '../../public/sprites/player/' + (p.key === 'fate' ? 'warrior' : p.key) + '@3x.png';
    img.style.filter = p.key === 'fate' ? 'brightness(0) drop-shadow(0 0 10px rgba(224,120,58,.35))' : '';
    root.querySelector('.pick-name').innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + p.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p.icon + '</svg>' + p.name;
    root.querySelectorAll('.pick-dots i').forEach((d, j) => d.classList.toggle('on', j === i));
  };
  root.querySelector('.turn-prev').onclick = () => { i = (i + 3) % 4; draw(); };
  root.querySelector('.turn-next').onclick = () => { i = (i + 1) % 4; draw(); };
  draw();
}
build('after', true);
build('first', false);
</script>
</body>
</html>
