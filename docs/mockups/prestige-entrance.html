<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Prestige entrance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Prestige entrance: three ways in from the Talents tab other than a fourth plinth, and the prestige page they open,
   with rank plates bigger than the talent nodes. Pixel-cut on Midnight. The state buttons redraw everything. */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6c4; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1240px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 8px; }
.lede { text-align: center; margin: 0 auto 16px; max-width: 700px; }
button { font: inherit; }
svg { flex: none; }
.states { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 34px; }
.states button { min-height: 40px; padding: 0 14px; border: 1px solid #414163; background: #1c1c2a; color: #dfe0f0; border-radius: 4px; cursor: pointer; }
.states button.on { background: #d2bb85; color: #1a1a24; border-color: #d2bb85; font-weight: 800; }
.opt { margin: 0 0 54px; }
.opt h2 { text-align: center; margin: 0 0 4px; font: 600 13px 'Cinzel', serif; letter-spacing: .26em; color: #ece8de; text-transform: uppercase; }
.opt .note { text-align: center; margin: 0 auto 16px; max-width: 660px; font-size: 14px; color: #8f8ca8; }
.row { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; align-items: flex-start; }
.cap-under { text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-top: 8px; text-transform: uppercase; }

/* ---------- Midnight tokens + the phone ---------- */
.phone {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --frame: #232337; --panel-hi: #373857; --panel-lo: #171823;
  --card: #2d2c50; --card-hi: #4d4c7e; --card-lo: #191a28; --code-bg: #202030; --sunk-hi: #0f1018; --sunk-lo: #2c2c47;
  --moon: #dfe0f0; --moon-solid: #b0b1cb; --brass: #d2bb85; --brass-solid: #b39a66; --dim: #8384a0; --spent: #686877;
  --stone-face: #38385c; --stone-lip: #161622; --quiet: #26263d;
  --phys: #e86154; --health: #c33a2e; --exp: #d8b46a; --coin: #f0c64e; --gem: #6fd6ea; --steel: #9fb4cc; --heal: #4ac777;
  --button-fill: #cdcedf; --button-lip: #828398;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --px3: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  position: relative; width: 375px; max-width: 100%; height: 740px; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text); border-radius: 28px; outline: 1px solid #000; box-shadow: 0 0 0 6px #1a1a24;
}
.rare  { --c: #5f95e6; --d: #1f3c70; --g: rgba(95,149,230,.45); }
.epic  { --c: #b57be8; --d: #4f2a7e; --g: rgba(181,123,232,.45); }
.relic { --c: #f58a35; --d: #7a3a0e; --g: rgba(245,138,53,.5); }

.ph-top { display: flex; align-items: center; gap: 8px; height: 50px; padding: 6px 12px 0 14px; }
.ph-top h3 { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 14px 'Cinzel', serif; letter-spacing: .24em; color: var(--text-h); text-transform: uppercase; }
.ph-top h3 svg { width: 18px; height: 18px; color: var(--brass); }
.purse { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; }
.chip svg { width: 15px; height: 15px; }
.chip b { min-width: 26px; height: 24px; padding: 0 5px; display: inline-grid; place-items: center; font: 800 13px 'Alegreya Sans'; color: #1c1a14; background: linear-gradient(var(--brass), var(--brass-solid)); clip-path: var(--px2); }
.menu { width: 36px; height: 36px; display: grid; place-items: center; background: var(--frame); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo); color: var(--moon); }
.menu svg { width: 18px; height: 18px; }
.kept { margin: 0 14px 6px; font: 600 12px 'Alegreya Sans'; letter-spacing: .04em; color: var(--spent); }
.ph-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; padding-bottom: 4px; background: #0d0e16; border-top: 2px solid #232337; }
.tabs span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 10px 'Alegreya Sans'; letter-spacing: .06em; color: var(--spent); text-transform: uppercase; }
.tabs svg { width: 20px; height: 20px; }
.tabs .on { color: var(--text-h); }
.tabs .on svg { color: var(--brass); }

/* shared bits */
.cin { font-family: 'Cinzel', serif; }
.ttl { font: 700 10px/1.2 'Alegreya Sans'; letter-spacing: .18em; text-transform: uppercase; color: var(--c); }
.spec { font: 700 15px/1.2 'Alegreya', serif; color: var(--text-h); }
.lvbar { font: 800 12px 'Alegreya Sans'; color: var(--dim); font-variant-numeric: tabular-nums; }
.lockic { width: 12px; height: 12px; color: var(--spent); }
.gains { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 12px; font: 700 13px 'Alegreya Sans'; color: var(--text); }
.gains span { display: inline-flex; align-items: center; gap: 4px; }
.gains svg { width: 14px; height: 14px; }
.gains b { color: var(--text-h); }
.i-phys { color: var(--phys); } .i-health { color: var(--health); } .i-exp { color: var(--exp); } .i-gem { color: var(--gem); } .i-coin { color: var(--coin); }

/* the numeral plate: PrestigeNumeral, sized up */
.plate { position: relative; display: inline-grid; place-items: center; width: 52px; height: 52px; color: var(--c); background: #0a0c12; clip-path: var(--px3);
  box-shadow: inset 3px 3px 0 var(--c), inset -3px -3px 0 var(--d); font: 900 20px/1 'Cinzel', serif; letter-spacing: .02em; }
.plate.sealed { color: #3a3a55; box-shadow: inset 3px 3px 0 #2a2a42, inset -3px -3px 0 #14141f; background: #0c0c15; }
.plate.done { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 35%, #0a0c12), #0a0c12 75%); color: #fff; text-shadow: 0 0 8px var(--c), 0 2px 0 var(--d); }
.plate.next { animation: glow 2.2s ease-in-out infinite; }
.plate.ready { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 25%, #0a0c12), #0a0c12 75%); }

/* the big Prestige button: the next rank's colour, glowing */
.pbtn { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border: 0; cursor: pointer; overflow: hidden;
  color: #fff; background: linear-gradient(color-mix(in srgb, var(--c) 85%, #fff), var(--c) 45%, var(--d)); clip-path: var(--px3);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 var(--d); font: 900 17px 'Cinzel', serif; letter-spacing: .3em; text-shadow: 0 2px 0 var(--d); }
.pbtn svg { width: 20px; height: 20px; }
.pbtn::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sweep 2.8s ease-in-out infinite; }
.pwrap { position: relative; filter: drop-shadow(0 0 14px var(--g)); }
.prog { position: relative; height: 22px; background: #0a0b12; clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.prog i { position: absolute; left: 3px; top: 3px; bottom: 3px; background: linear-gradient(var(--c), var(--d)); }
.prog span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 12px 'Alegreya Sans'; color: var(--text-h); text-shadow: 0 1px 0 #000; }

/* embers rising: a few dots, transform and opacity only */
.embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.embers i { position: absolute; bottom: -6px; width: 3px; height: 3px; background: var(--c); box-shadow: 0 0 6px var(--c); animation: rise linear infinite; opacity: 0; }

@keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px var(--c)); } 50% { filter: drop-shadow(0 0 12px var(--c)); } }
@keyframes sweep { 0% { left: -60%; } 55%,100% { left: 130%; } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-420px); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
@keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.sealed-note { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lockmark { width: 40px; height: 40px; display: grid; place-items: center; background: var(--bg); border: 1px solid #2c2c47; border-radius: 50%; color: var(--text); }
.lockmark svg { width: 18px; height: 18px; }


/* ---------- the Talents tab: the tree as it is today, three plinths ---------- */
.t-tree { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 12px; }
.t-row { position: relative; display: grid; grid-template-columns: 1fr 96px 1fr; height: 86px; }
.t-row .seg { position: absolute; left: 50%; width: 4px; margin-left: -2px; top: 0; bottom: 0; background: var(--sunk-lo); }
.t-row.first .seg { top: 0; bottom: 50%; }
.t-row .seg.lit { background: var(--brass); }
.t-row .seg.half { background: linear-gradient(var(--sunk-lo) 50%, var(--brass) 50%); }
.t-row .br { position: absolute; top: 31px; height: 3px; width: calc((100% - 96px) / 4); background: var(--sunk-lo); }
.t-row .br.r { left: calc(50% + 26px); } .t-row .br.l { right: calc(50% + 26px); }
.t-row .br.lit { background: var(--brass); }
.cell { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 9px; }
.cell.l { grid-column: 1; } .cell.m { grid-column: 2; padding-top: 5px; } .cell.r { grid-column: 3; }
.sock { width: 44px; height: 44px; display: grid; place-items: center; color: var(--c, var(--moon)); background: var(--code-bg); clip-path: var(--px2);
  box-shadow: inset 0 0 0 2px var(--card-hi), inset 4px 4px 0 rgba(0,0,0,.45), inset -3px -3px 0 var(--sunk-lo); }
.sock svg { width: 20px; height: 20px; }
.cell.m .sock { width: 52px; height: 52px; } .cell.m .sock svg { width: 24px; height: 24px; }
.cell.has .sock { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brass) 55%, var(--card-hi)), inset 4px 4px 0 rgba(0,0,0,.45), inset -3px -3px 0 var(--sunk-lo); }
.cell.full .sock { background: radial-gradient(circle, color-mix(in srgb, var(--brass) 22%, #0a0a14), #0a0a14 80%); box-shadow: inset 0 0 0 2px var(--brass), inset 4px 4px 0 rgba(0,0,0,.4), inset -3px -3px 0 color-mix(in srgb, var(--brass) 30%, #000); }
.cell.open .sock { box-shadow: inset 0 0 0 2px var(--moon-solid), inset 4px 4px 0 rgba(0,0,0,.45), inset -3px -3px 0 var(--sunk-lo); }
.cell.locked .sock { color: var(--spent); background: #0c0c15; box-shadow: inset 2px 2px 0 #05050a, inset -2px -2px 0 #1f1f33; }
.cell .nm { font: 600 13px/1.2 'Alegreya', serif; color: var(--text-h); background: var(--bg); padding: 0 4px; white-space: nowrap; }
.cell.locked .nm { color: var(--spent); }
.pips { display: inline-flex; gap: 3px; background: var(--bg); padding: 0 2px; }
.pips i { width: 6px; height: 6px; border: 1.5px solid color-mix(in srgb, var(--brass) 70%, transparent); }
.pips i.lit { background: var(--brass); border-color: var(--brass); }
.cell.locked .pips i { border-color: #3a3a52; }
.t-foot { position: relative; padding: 0 10px 10px; }
.t-foot svg.stand { display: block; width: 100%; height: 16px; }
.t-pl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-items: end; }
.t-pl span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; clip-path: var(--px2);
  background: linear-gradient(var(--stone-face) 0 7px, var(--quiet) 7px); border-bottom: 3px solid var(--stone-lip); color: var(--spent);
  font: 700 10px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; }
.t-pl span em { display: inline-flex; align-items: center; gap: 4px; font-style: normal; }
.t-pl span svg { width: 14px; height: 14px; }
.t-pl span b { font: 800 11px 'Alegreya Sans'; letter-spacing: 0; color: rgba(210,187,133,.6); }
.t-pl span.on { min-height: 62px; color: var(--text-h); background: linear-gradient(var(--card-hi) 0 8px, var(--card) 8px); }
.t-pl span.on svg { color: var(--phys); } .t-pl span.on b { color: var(--brass); }

/* progress ring around a seal: a conic sweep in the next rank's colour */
.ring { --p: 50; position: absolute; inset: -5px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), #23233a 0);
  -webkit-mask: radial-gradient(circle, transparent calc(50% - 4px), #000 calc(50% - 3px)); mask: radial-gradient(circle, transparent calc(50% - 4px), #000 calc(50% - 3px)); }
.burst { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(var(--g) 0 8deg, transparent 8deg 30deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); animation: spin 14s linear infinite; }

/* ---------- A · Crest on the banner ---------- */
.a-band { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 0 14px 4px; min-height: 58px; }
.a-band .kept { margin: 0; }
.crest { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 12px; min-height: 52px; cursor: pointer; }
.crest .lbls { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.crest .lbls em { font: 700 10px 'Cinzel', serif; font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--c); }
.crest .lbls b { font: 800 12px 'Alegreya Sans'; color: var(--text-h); font-variant-numeric: tabular-nums; }
.crest .seal { position: relative; width: 46px; height: 46px; display: grid; place-items: center; }
.crest .seal .disc { position: relative; z-index: 1; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 55%, #0a0c12), #0a0c12 78%); box-shadow: inset 0 0 0 2px var(--c), 0 0 12px var(--g);
  font: 900 15px/1 'Cinzel', serif; text-shadow: 0 0 6px var(--c); }
.crest .seal .disc svg { width: 19px; height: 19px; color: var(--c); }
.crest .burst { width: 96px; height: 96px; margin: -48px 0 0 -48px; z-index: 0; }
.crest.ready .disc { animation: glow 2.2s ease-in-out infinite; }
.crest.sealed .lbls em, .crest.sealed .lbls b { color: var(--spent); }
.crest.sealed .disc { color: var(--spent); background: #0c0c15; box-shadow: inset 0 0 0 2px #2a2a42; text-shadow: none; }
.crest.sealed .disc svg { color: var(--spent); width: 15px; height: 15px; }

/* ---------- B · Altar slab under the plinths ---------- */
.b-altar { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; margin-top: 8px; padding: 0 14px; cursor: pointer;
  clip-path: var(--px3); background: linear-gradient(color-mix(in srgb, var(--c) 34%, var(--card)), color-mix(in srgb, var(--c) 16%, #12131d));
  box-shadow: inset 0 3px 0 color-mix(in srgb, var(--c) 60%, transparent), inset 0 -3px 0 var(--d); overflow: hidden; }
.b-altar .plate { width: 34px; height: 34px; font-size: 14px; flex: none; box-shadow: inset 2px 2px 0 var(--c), inset -2px -2px 0 var(--d); clip-path: var(--px2); }
.b-altar .nm { font: 900 14px 'Cinzel', serif; letter-spacing: .26em; color: var(--text-h); text-transform: uppercase; text-shadow: 0 2px 0 var(--d); }
.b-altar .rt { margin-left: auto; font: 800 13px 'Alegreya Sans'; color: var(--text-h); font-variant-numeric: tabular-nums; }
.b-altar .bar { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; background: rgba(0,0,0,.35); }
.b-altar .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); box-shadow: 0 0 6px var(--c); }
.b-altar.ready { background: linear-gradient(color-mix(in srgb, var(--c) 85%, #fff), var(--c) 45%, var(--d)); }
.b-altar.ready::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sweep 2.8s ease-in-out infinite; }
.b-altar.ready .rt { font: 900 12px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; }
.b-wrap.ready { filter: drop-shadow(0 0 12px var(--g)); }
.b-altar.sealed { background: linear-gradient(var(--stone-face) 0 7px, var(--quiet) 7px); box-shadow: none; }
.b-altar.sealed .nm, .b-altar.sealed .rt { color: var(--spent); text-shadow: none; }
.b-altar .lockic { width: 16px; height: 16px; }

/* ---------- C · Seal over the tree ---------- */
.c-seal { position: absolute; right: 12px; bottom: 10px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.c-seal .seal { position: relative; width: 66px; height: 66px; display: grid; place-items: center; }
.c-seal .disc { position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 50% 36%, color-mix(in srgb, var(--c) 60%, #0a0c12), #0a0c12 80%); box-shadow: inset 0 0 0 3px var(--c), inset 0 -5px 0 var(--d), 0 4px 0 #05060a, 0 0 16px var(--g);
  font: 900 22px/1 'Cinzel', serif; text-shadow: 0 0 8px var(--c), 0 2px 0 var(--d); }
.c-seal .disc svg { width: 24px; height: 24px; color: var(--c); }
.c-seal .burst { width: 140px; height: 140px; margin: -70px 0 0 -70px; z-index: 0; }
.c-seal .tag { font: 700 10px 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--c); background: var(--bg); padding: 1px 6px; }
.c-seal.ready .seal { animation: bob 2.4s ease-in-out infinite; }
.c-seal.sealed .disc { width: 44px; height: 44px; color: var(--spent); background: #0c0c15; box-shadow: inset 0 0 0 2px #2a2a42, 0 3px 0 #05060a; text-shadow: none; }
.c-seal.sealed .disc svg { color: var(--spent); width: 17px; height: 17px; }
.c-seal.sealed .tag { color: var(--spent); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- the prestige page: bigger plates than any talent node ---------- */
.pp { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--c) 18%, #0d0e18), #0d0e18 70%); }
.pp-stars { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(1px 1px at 12% 14%, #fff8 50%, transparent), radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent), radial-gradient(1px 1px at 52% 22%, #fff5 50%, transparent), radial-gradient(1px 1px at 30% 6%, #fff7 50%, transparent), radial-gradient(1px 1px at 90% 30%, #fff4 50%, transparent), radial-gradient(1px 1px at 6% 40%, #fff5 50%, transparent); }
.pp-head { position: relative; display: flex; align-items: center; height: 50px; padding: 6px 12px 0 6px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 2px; color: var(--moon); font: 700 13px 'Alegreya Sans'; }
.back svg { width: 22px; height: 22px; }
.pp-head h3 { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; margin: 0; font: 600 14px 'Cinzel', serif; letter-spacing: .24em; color: var(--text-h); text-transform: uppercase; }
.pp-head h3 svg { width: 18px; height: 18px; color: var(--c); }
.pp-head .purse { margin-left: auto; }
.pp-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 14px 10px; }
.big-trunk { display: flex; flex-direction: column; gap: 16px; padding: 6px 0 12px; }
.big-node { position: relative; display: grid; grid-template-columns: 1fr 92px 1fr; align-items: center; }
.big-node .seg { position: absolute; left: 50%; top: 50%; width: 6px; margin-left: -3px; height: calc(100% + 16px); background: var(--sunk-lo); z-index: 0; }
.big-node .seg.lit { background: var(--c); box-shadow: 0 0 10px var(--g); }
.big-node .plate { width: 76px; height: 76px; font-size: 30px; justify-self: center; z-index: 1; box-shadow: inset 4px 4px 0 var(--c), inset -4px -4px 0 var(--d); clip-path: var(--px3); }
.big-node .plate.sealed { box-shadow: inset 4px 4px 0 #2a2a42, inset -4px -4px 0 #14141f; }
.big-node.top .plate { width: 90px; height: 90px; font-size: 36px; }
.big-node .lft { justify-self: end; padding-right: 12px; text-align: right; }
.big-node .rgt { padding-left: 12px; display: flex; flex-direction: column; gap: 2px; }
.big-node .spec { display: flex; align-items: center; gap: 6px; font-size: 16px; }
.big-node .spec svg { width: 17px; height: 17px; color: var(--c); }
.big-node .ttl { font-size: 11px; }
.big-node .lvbar { font-size: 13px; }
.big-node.sealed .spec, .big-node.sealed .ttl { color: var(--spent); }
.big-node.sealed .spec svg { color: var(--spent); }
.big-node .burst { width: 170px; height: 170px; margin: -85px 0 0 -85px; z-index: 0; }
.pp-sealed .big-trunk { opacity: .28; filter: grayscale(1); }
.pp-veil { position: absolute; inset: 0; display: grid; place-items: center; }

/* today vs the page: node sizes side by side */
.sizes { --code-bg: #202030; --card-hi: #4d4c7e; --sunk-lo: #2c2c47; --brass: #d2bb85; --phys: #e86154; --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)); display: flex; align-items: flex-end; gap: 22px; padding: 14px 18px 10px; background: #11121b; border-radius: 12px; outline: 1px solid #232337; }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.sizes figcaption { font: 600 10px 'Cinzel', serif; letter-spacing: .16em; color: #8f8b80; text-transform: uppercase; text-align: center; }
.a-each { margin: 4px 0 8px; padding: 8px 10px; background: var(--code-bg); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.a-each .lbl { display: block; text-align: center; margin-bottom: 4px; font: 700 10px 'Cinzel', serif; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.a-act { padding: 0 2px 8px; }
</style>
</head>
<body>
<div class="page">
  <h1>Prestige entrance</h1>
  <p class="lede">Prestige leaves the plinth row: the three shoots go back to three plinths, and prestige gets its own way in, opening its own page with plates bigger than any talent node. Pick a state to redraw them all.</p>
  <div class="states" id="states"></div>
  <div id="opts"></div>
</div>

<script>
const IC = {
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
  swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  pulse: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
  gem: '<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>',
  coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
  castle: '<path d="M10 5V3"/><path d="M14 5V3"/><path d="M15 21v-3a3 3 0 0 0-6 0v3"/><path d="M18 3v8"/><path d="M18 5H6"/><path d="M22 11H2"/><path d="M22 9v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9"/><path d="M6 3v8"/>',
  sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
  shirt: '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
  anvil: '<path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>',
  menu: '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
  check: '<path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/>',
  scroll: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const RANKS = [
  { n: 'I', title: 'Veteran', tier: 'rare', bar: 30, spec: 'Free dungeon', icon: 'castle' },
  { n: 'II', title: 'Veteran', tier: 'rare', bar: 40, spec: 'Deeper roots', icon: 'sprout', line: 'Talents +1 max rank' },
  { n: 'III', title: 'Ascendant', tier: 'epic', bar: 50, spec: 'Free dungeon', icon: 'castle' },
  { n: 'IV', title: 'Ascendant', tier: 'epic', bar: 60, spec: 'Deeper roots II', icon: 'sprout', line: 'Talents +1 max rank' },
  { n: 'V', title: 'Mythic', tier: 'relic', bar: 70, spec: 'Mythic skin', icon: 'shirt' },
];
const STATES = [
  { id: 'sealed', label: 'Sealed · L22', p: 0, lvl: 22, gold: 340, gems: 12 },
  { id: 'ready', label: 'Ready · L31', p: 0, lvl: 31, gold: 1210, gems: 18 },
  { id: 'climb', label: 'Climbing · II, L44', p: 2, lvl: 44, gold: 980, gems: 64 },
  { id: 'done', label: 'Mythic · V', p: 5, lvl: 58, gold: 2400, gems: 140 },
];
let S = STATES[1];

const status = (i) => (i < S.p ? 'done' : i === S.p ? (S.lvl >= RANKS[i].bar ? 'next ready' : 'next') : 'sealed');
const isSealed = () => S.p === 0 && S.lvl < RANKS[0].bar;
const nextRank = () => RANKS[S.p];
const ready = () => S.p < 5 && S.lvl >= RANKS[S.p].bar;

const embers = (n = 9) => `<div class="embers">${Array.from({ length: n }, (_, i) => `<i style="left:${8 + ((i * 37) % 86)}%;animation-duration:${4 + (i % 4) * 1.3}s;animation-delay:${(i * 0.7) % 4}s"></i>`).join('')}</div>`;
const gains = () => `<div class="gains"><span>${svg('swords', 'i-phys')}<b>+20%</b> damage</span><span>${svg('heart', 'i-health')}<b>+10%</b> HP</span><span>${svg('sparkles', 'i-exp')}<b>+5%</b> EXP</span><span>${svg('gem', 'i-gem')}<b>50</b></span></div>`;
const plate = (r, st, extra = '') => `<span class="plate ${r.tier} ${st} ${extra}">${st === 'sealed' ? r.n : r.n}</span>`;
const action = () => {
  if (S.p >= 5) return '';
  const r = nextRank();
  if (ready()) return `<div class="pwrap ${r.tier}"><button class="pbtn ${r.tier}">${svg('crown')}Prestige</button></div>`;
  const prevBar = S.p === 0 ? 1 : 1;
  const pct = Math.max(4, Math.min(100, ((S.lvl - prevBar) / (r.bar - prevBar)) * 100));
  return `<div class="prog ${r.tier}"><i style="width:calc(${pct}% - 6px)"></i><span>Level ${S.lvl} / ${r.bar}</span></div>`;
};

IC.chevL = '<path d="m15 18-6-6 6-6"/>';
IC.flame = '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>';
IC.zap = '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>';
IC.target = '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>';
IC.star = '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>';

const tier = () => (S.p >= 5 ? 'relic' : nextRank().tier);
const pct = () => (S.p >= 5 ? 100 : Math.max(4, Math.min(100, ((S.lvl - 1) / (nextRank().bar - 1)) * 100)));
const rightLabel = () => (isSealed() ? `Lv ${RANKS[0].bar}` : S.p >= 5 ? 'Mythic' : ready() ? 'Ready' : `Lv ${S.lvl} / ${nextRank().bar}`);
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];

/* the Damage shoot, scrolled to its foot: main nodes up the middle, offshoots to the sides */
const ROWS = [
  { m: ['Executioner', 'target', 'locked', 0, 3], r: ['Cleave', 'swords', 'locked', 0, 3] },
  { m: ['Fury', 'flame', 'open', 0, 5], l: ['Rend', 'swords', 'open', 0, 3] },
  { m: ['Keen edge', 'zap', 'has', 3, 5], r: ['Bleed', 'flame', 'has', 1, 3] },
  { m: ['Strength', 'swords', 'full', 5, 5], l: ['Precision', 'target', 'full', 3, 3], r: ['Ferocity', 'zap', 'has', 2, 3] },
];
const cell = ([nm, ic, st, rank, max], place) =>
  `<div class="cell ${place} ${st}"><span class="sock" style="--c:var(--phys)">${svg(st === 'locked' ? 'lock' : ic)}</span><span class="nm">${nm}</span><span class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < rank ? 'lit' : ''}"></i>`).join('')}</span></div>`;
function tree(extra = '') {
  const rows = ROWS.map((row, i) => {
    const ranked = (c) => c && c[3] > 0;
    const segCls = i === ROWS.length - 1 ? 'lit' : ranked(ROWS[i + 1]?.m) && ranked(row.m) ? 'lit' : ranked(row.m) ? 'half' : '';
    return `<div class="t-row ${i === ROWS.length - 1 ? 'first' : ''}"><span class="seg ${segCls}"></span>
      ${row.l ? `<span class="br l ${ranked(row.m) ? 'lit' : ''}"></span>${cell(row.l, 'l')}` : ''}
      ${cell(row.m, 'm')}
      ${row.r ? `<span class="br r ${ranked(row.m) ? 'lit' : ''}"></span>${cell(row.r, 'r')}` : ''}</div>`;
  }).join('');
  return `<div class="t-tree">${rows}${extra}</div>`;
}
function plinths(after = '') {
  return `<div class="t-foot">
    <svg class="stand" viewBox="0 0 351 16" preserveAspectRatio="none"><path d="M175 0 V7 H58 V16" fill="none" stroke="#d2bb85" stroke-width="4" vector-effect="non-scaling-stroke"/></svg>
    <div class="t-pl"><span class="on"><em>${svg('swords')}Damage</em><b>14 spent</b></span><span><em>${svg('shield')}Tank</em><b>6 spent</b></span><span><em>${svg('pulse')}Support</em><b>3 spent</b></span></div>
    ${after}</div>`;
}
const seal = (size) => {
  if (isSealed()) return `<span class="disc">${svg('lock')}</span>`;
  return `${ready() ? '<span class="burst"></span>' : ''}${S.p < 5 && !ready() ? `<span class="ring" style="--p:${pct()}"></span>` : ''}<span class="disc">${S.p === 0 ? svg('crown') : ROMAN[S.p]}</span>`;
};
function talentsPhone(body, band = '<p class="kept">Permanent upgrades.</p>') {
  return `<div class="phone ${tier()}">
    <div class="ph-top"><h3>${svg('anvil')}Talents</h3>
      <div class="purse"><span class="chip">${svg('coins', 'i-coin')}<b>${S.gold.toLocaleString()}</b></span><span class="chip">${svg('gem', 'i-gem')}<b>${S.gems}</b></span></div>
      <span class="menu">${svg('menu')}</span></div>
    ${band}
    <div class="ph-body">${body}</div>
    <div class="tabs"><span>${svg('check')}Skills</span><span>${svg('scroll')}Quests</span><span>${svg('store')}Shop</span><span class="on">${svg('anvil')}Talents</span><span>${svg('user')}Hero</span></div>
  </div>`;
}

/* A · a crest hung on the banner's right, under the purse */
function optA() {
  const st = isSealed() ? 'sealed' : ready() ? 'ready' : '';
  const band = `<div class="a-band"><p class="kept">Permanent upgrades.</p>
    <div class="crest ${tier()} ${st}"><span class="lbls"><em>Prestige</em><b>${rightLabel()}</b></span><span class="seal">${seal()}</span></div></div>`;
  return [talentsPhone(tree() + plinths(), band)];
}
/* B · an altar slab under the plinths, the width of all three */
function optB() {
  const st = isSealed() ? 'sealed' : ready() ? 'ready' : '';
  const altar = `<div class="b-wrap ${tier()} ${st}"><div class="b-altar ${tier()} ${st}">
    ${isSealed() ? svg('lock', 'lockic') : `<span class="plate ${tier()} ${S.p ? 'done' : 'ready'}">${S.p ? ROMAN[S.p] : svg('crown')}</span>`}
    <span class="nm">Prestige</span><span class="rt">${rightLabel()}</span>
    ${!isSealed() && !ready() && S.p < 5 ? `<span class="bar"><i style="width:${pct()}%"></i></span>` : ''}</div></div>`;
  return [talentsPhone(tree() + plinths(altar))];
}
/* C · a round seal standing over the tree's corner, above the plinths */
function optC() {
  const st = isSealed() ? 'sealed' : ready() ? 'ready' : '';
  const sealEl = `<div class="c-seal ${tier()} ${st}">${ready() ? embers(6) : ''}<span class="seal">${seal()}</span><span class="tag">${isSealed() ? 'Lv 30' : ready() ? 'Ready' : S.p >= 5 ? 'Mythic' : `${S.lvl} / ${nextRank().bar}`}</span></div>`;
  return [talentsPhone(tree(sealEl) + plinths())];
}

/* the prestige page every option opens: its own night, a back to Talents, the ladder at full size */
function pageBody() {
  const sealed = isSealed();
  const nodes = RANKS.map((r, i) => {
    const st = status(i);
    const base = st.split(' ')[0];
    return `<div class="big-node ${r.tier} ${base} ${i === 4 ? 'top' : ''}">
      ${i > 0 ? `<span class="seg ${i < S.p ? 'lit' : ''}"></span>` : ''}
      ${st.includes('ready') ? '<span class="burst"></span>' : ''}
      <div class="lft">${base === 'done' ? `<span class="ttl">${r.title}</span>` : `<span class="lvbar">Lv ${r.bar}</span>`}</div>
      ${plate(r, st)}
      <div class="rgt"><span class="spec">${svg(r.icon)}${r.spec}</span>${r.line ? `<span class="lvbar">${r.line}</span>` : ''}</div>
    </div>`;
  }).reverse().join('');
  return `<div class="pp ${tier()} ${sealed ? 'pp-sealed' : ''}"><div class="pp-stars"></div>
    <div class="pp-head"><span class="back">${svg('chevL')}Talents</span><h3>${svg('crown')}Prestige</h3>
      <div class="purse"><span class="chip">${svg('gem', 'i-gem')}<b>${S.gems}</b></span></div></div>
    <div class="pp-body">${ready() ? embers(10) : ''}
      <div class="big-trunk">${nodes}</div>
      ${sealed ? `<div class="pp-veil">${sealedNote()}</div>` : S.p >= 5 ? '' : `<div class="a-each"><span class="lbl">Next rank</span>${gains()}</div><div class="a-act">${action()}</div>`}
    </div></div>`;
}
function pagePhone() {
  return `<div class="phone ${tier()}" style="display:flex">${pageBody()}
    <div class="tabs"><span>${svg('check')}Skills</span><span>${svg('scroll')}Quests</span><span>${svg('store')}Shop</span><span class="on">${svg('anvil')}Talents</span><span>${svg('user')}Hero</span></div></div>`;
}
function sizes() {
  const r = RANKS[2];
  return `<div class="sizes">
    <figure><div class="cell m has" style="padding:0"><span class="sock" style="--c:var(--phys)">${svg('zap')}</span></div><figcaption>Talent node<br>52</figcaption></figure>
    <figure><span class="plate ${r.tier} next">${r.n}</span><figcaption>Rank plate now<br>52</figcaption></figure>
    <figure><div class="big-node ${r.tier}" style="display:block"><span class="plate ${r.tier} next">${r.n}</span></div><figcaption>Rank plate<br>76</figcaption></figure>
    <figure><div class="big-node top relic" style="display:block"><span class="plate relic done">V</span></div><figcaption>Mythic plate<br>90</figcaption></figure>
  </div>`;
}

const OPTS = [
  { name: 'A · Crest on the banner', note: 'A round seal hangs at the right of the Talents banner: the current rank in the next rank’s colour, a ring filling toward its bar. At the bar it glows and its rays turn. Out of thumb reach, but always in sight.', render: optA },
  { name: 'B · Altar under the plinths', note: 'A slab the width of all three plinths, under them, in the next rank’s colour, with a thin line filling toward the bar. At the bar it becomes the bright Prestige button. Right where the thumb is.', render: optB },
  { name: 'C · Seal over the tree', note: 'A big wax seal stands in the tree’s bottom right corner, over the offshoots, with its ring and a small tag. At the bar it bobs and throws embers. Hard to miss, but it covers a little of the tree.', render: optC },
  { name: 'The prestige page', note: 'Every option opens this page over the Talents tab: its own night in the next rank’s colour, a back to Talents, and the five rank plates at 76 (Mythic 90), against 52 for the talent nodes.', render: () => [pagePhone(), sizes()] },
];
function draw() {
  document.getElementById('states').innerHTML = STATES.map((s) => `<button class="${s === S ? 'on' : ''}" data-s="${s.id}">${s.label}</button>`).join('');
  document.getElementById('opts').innerHTML = OPTS.map((o) => `<section class="opt"><h2>${o.name}</h2><p class="note">${o.note}</p>
    <div class="row">${o.render().map((p, i) => `<figure style="margin:0">${p}${o.caps ? `<figcaption class="cap-under">${o.caps[i]}</figcaption>` : ''}</figure>`).join('')}</div></section>`).join('');
}
document.getElementById('states').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  S = STATES.find((s) => s.id === b.dataset.s);
  draw();
});
draw();
</script>
</body>
</html>
