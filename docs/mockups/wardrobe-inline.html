<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Wardrobe on the Hero tab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The wardrobe out of its modal and onto the Hero tab: owned looks only, tap to wear,
   the pinned home base (hero + room) updates at once. One button to the Shop's Looks.
   Pixel-cut, Midnight (the current Dark). Each phone is live: scroll it and tap. */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1340px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 820px; }
.row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.opt { width: 390px; }
.opt h2 { font: 600 13px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 4px; text-transform: uppercase; text-align: center; }
.opt > p { margin: 0 0 12px; font-size: 14.5px; text-align: center; min-height: 80px; }

.phone {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --moon: #dfe0f0; --moon-solid: #b0b1cb; --brass: #d2bb85;
  --card: #2d2c50; --card-hi: #4d4c7e; --card-lo: #191a28; --card-lip: #0e0e19; --gem: #6fd6ea;
  --button-fill: #cdcedf; --button-text: #20202e; --spent: #686877;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  position: relative; width: 390px; height: 780px; overflow: hidden; background: var(--bg); color: var(--text);
  outline: 1px solid #000; border-radius: 4px; display: flex; flex-direction: column;
}
.phone svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The pinned home base */
.head { position: relative; flex: none; height: 232px; overflow: hidden; background: #07080c; border-bottom: 3px solid var(--card-lip); box-shadow: 0 10px 18px -8px rgba(0,0,0,.7); z-index: 2; }
.head .room { position: absolute; left: -21px; bottom: 0; width: 432px; max-width: none; image-rendering: pixelated; transition: opacity .18s; }
.head .hero { position: absolute; left: 131px; bottom: 30px; width: 128px; height: 128px; image-rendering: pixelated; transition: opacity .18s; }
.head .swap { opacity: 0; }
.head .menu { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; background: rgba(7,8,12,.88); clip-path: var(--px2); box-shadow: inset 2px 2px 0 #333c52, inset -2px -2px 0 #0c0f15; display: flex; align-items: center; justify-content: center; color: #dbe2ee; }
.plate { position: absolute; z-index: 2; background: rgba(7,8,12,.88); clip-path: var(--px2); padding: 5px 10px; box-shadow: inset 2px 2px 0 #333c52, inset -2px -2px 0 #0c0f15; color: #f0f3f7; }
.nameplate { left: 12px; top: 12px; font: 600 13px/1.15 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; }
.stat { bottom: 10px; display: flex; align-items: center; gap: 6px; line-height: 1; }
.stat svg { width: 14px; height: 14px; }
.stat small { font: 700 10px 'Alegreya Sans'; letter-spacing: .08em; text-transform: uppercase; color: #a9adb6; }
.stat b { font: 700 17px 'Alegreya', serif; }
.stat.level { left: 12px; } .stat.level svg { color: #d9a93c; }
.stat.streak { right: 12px; } .stat.streak svg { color: #e0894a; }

/* The page under it */
.body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: #3f405a transparent; }
.body > * { flex-shrink: 0; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; background: #0e0e19; border-top: 2px solid #232337; }
.tabs span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 10.5px 'Alegreya Sans'; letter-spacing: .04em; color: #8a8aa6; }
.tabs span.on { color: var(--moon); }

/* Slate banners (the Hero tab's) */
.banner { display: flex; align-items: center; height: 38px; flex: none; }
.banner .medal { width: 38px; height: 38px; display: grid; place-items: center; background: var(--card); color: var(--brass); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); position: relative; z-index: 1; }
.banner .cloth { flex: 1; display: flex; align-items: center; justify-content: space-between; height: 28px; margin-left: -4px; padding: 0 22px 0 14px; background: #202a40; box-shadow: inset 0 2px 0 #333c52; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); font: 600 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: #f0f3f7; }
.banner .aside { font: 700 13px 'Alegreya Sans'; letter-spacing: .06em; color: var(--brass); }

/* Context: the gear bay and stats, only so the page has its real length */
.gear { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gear span { aspect-ratio: 1; display: grid; place-items: center; background: #0e0e19; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #050509, inset -2px -2px 0 #2a2a44; }
.gear img { width: 64px; height: 64px; image-rendering: pixelated; }
.stats { background: #1a1a2b; clip-path: var(--px2); padding: 6px 12px; }
.stats div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14.5px; border-bottom: 1px solid #2a2a44; }
.stats div:last-child { border: 0; }
.stats b { color: var(--text-h); font-family: 'Alegreya', serif; }

.label { font: 700 11px 'Alegreya Sans'; letter-spacing: .16em; text-transform: uppercase; color: #9a9ab8; margin: 2px 0 -6px; display: flex; align-items: center; gap: 6px; }
.label svg { width: 14px; height: 14px; color: #7f80a3; }

/* A look you can wear: a lifted card; the worn one is ringed in silver (silver = touch) */
.look { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 9px; min-width: 0; background: var(--card); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); cursor: pointer; border: 0; color: var(--text-h); font: inherit; text-align: center; }
.look:active { transform: translateY(1px); }
.look.worn { box-shadow: inset 0 0 0 2px var(--moon), inset 4px 4px 0 var(--card-hi), inset -4px -4px 0 var(--card-lo); }
.look .name { font: 700 13px/1.15 'Alegreya', serif; overflow-wrap: anywhere; }
.look .state { font: 700 10px 'Alegreya Sans'; letter-spacing: .12em; text-transform: uppercase; color: #8f90b0; height: 12px; }
.look.worn .state { color: var(--moon); }
.art { display: grid; place-items: end center; overflow: hidden; background: #0b0b14; clip-path: var(--px2); }
.art img { image-rendering: pixelated; max-width: none; }
.art.hero { width: 76px; height: 72px; }
.art.hero img { width: 64px; height: 64px; }
/* A scene at 1 CSS px per art pixel, cropped centred (never scaled) */
.art.scene { width: 100%; height: 116px; place-items: end center; }
.art.scene img { width: 216px; }

.more { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 0; cursor: pointer; background: var(--button-fill); color: var(--button-text); clip-path: var(--px2); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.25); font: 800 14px 'Alegreya Sans'; letter-spacing: .06em; }
.more .gem { color: #13879c; }
.more.ghost { background: transparent; color: var(--moon); box-shadow: inset 0 0 0 2px #4d4c7e; }
.more.ghost .gem { color: var(--gem); }

.toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: #07080c; color: var(--moon); padding: 8px 14px; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #333c52; font: 700 13px 'Alegreya Sans'; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 5; }
.toast.show { opacity: 1; }

/* A: grid section */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

/* B: Gear | Looks switch */
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #0e0e19; clip-path: var(--px2); flex: none; }
.switch button { min-height: 44px; border: 0; background: transparent; color: #9a9ab8; font: 700 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; clip-path: var(--px2); }
.switch button.on { background: var(--card); color: var(--text-h); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); }
.switch button.on svg { color: var(--brass); }
.lrow { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; flex-direction: row; text-align: left; }
.lrow .art.scene { width: 150px; height: 116px; flex: none; }
.lrow .txt { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.lrow .name { font-size: 15px; }
.lrow .tick { width: 30px; height: 30px; display: grid; place-items: center; flex: none; color: transparent; }
.lrow.worn .tick { color: var(--moon); }

/* C: rails */
.rail { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail .look { flex: none; scroll-snap-align: start; }
.rail .look.h { width: 96px; }
.rail .look.s { width: 236px; }
.rail .art.scene { width: 220px; }
</style>
</head>
<body>
<div class="page">
  <h1>Wardrobe on the Hero tab</h1>
  <p class="lede">No modal. Your looks sit on the Hero tab; tap one and the pinned home base above changes at once. Only looks you own (the class you're playing for the hero). Buying is one button to the Shop's Looks. Each phone is live: scroll down and tap.</p>
  <div class="row" id="opts"></div>
</div>
<script>
const S = '../../public/sprites/';
const I = (p) => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
  sword: I('<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>'),
  scroll: I('<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>'),
  store: I('<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/>'),
  anvil: I('<path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>'),
  user: I('<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>'),
  shirt: I('<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>'),
  house: I('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  swords: I('<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>'),
  chart: I('<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'),
  gem: I('<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>'),
  check: I('<path d="M20 6 9 17l-5-5"/>'),
  up: I('<path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>'),
  flame: I('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
  menu: I('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  right: I('<path d="m9 18 6-6-6-6"/>'),
};

// Owned looks only (a Warrior run). Default first, then skins in catalog order.
const LOOKS = {
  hero: [
    { id: 'starter', name: 'Starter', art: 'player/warrior' },
    { id: 'crimson', name: 'Crimson Guard', art: 'player/skins/warrior-crimson' },
    { id: 'steel', name: 'Steel Vanguard', art: 'player/skins/warrior-steel' },
  ],
  home: [
    { id: 'armory', name: 'Armory', art: 'home/armory' },
    { id: 'barred', name: 'Barred Hall', art: 'stage/arena7b' },
    { id: 'moonlit', name: 'Moonlit Hall', art: 'stage/arena6b' },
  ],
  arena: [
    { id: 'stone', name: 'Stone Hall', art: 'stage/arena6b' },
    { id: 'mossy', name: 'Mossy Hall', art: 'stage/arena3' },
  ],
};
const SLOT = { hero: ['Hero', ICON.user], home: ['Home', ICON.house], arena: ['Arena', ICON.swords] };

const head = () => `
  <div class="head">
    <img class="room" data-room src="${S}home/armory.png" alt="" />
    <img class="hero" data-hero src="${S}player/warrior.png" alt="" />
    <span class="menu">${ICON.menu}</span>
    <div class="plate nameplate">Kael</div>
    <span class="plate stat level">${ICON.up}<small>Level</small><b>12</b></span>
    <span class="plate stat streak">${ICON.flame}<small>Best streak</small><b>22</b></span>
  </div>`;
const tabs = () => `<nav class="tabs">${[['Skills', ICON.sword], ['Quests', ICON.scroll], ['Shop', ICON.store], ['Talents', ICON.anvil], ['Hero', ICON.user]]
  .map(([n, i]) => `<span class="${n === 'Hero' ? 'on' : ''}">${i}${n}</span>`).join('')}</nav>`;
const banner = (title, icon, aside = '') => `<div class="banner"><span class="medal">${icon}</span><span class="cloth">${title}<span class="aside">${aside}</span></span></div>`;
const gear = () => `${banner('Equipment', ICON.swords, '4 / 4')}
  <div class="gear">${['chaos-blade', 'chainmail-hauberk', 'dawnguard-helm', 'duelists-signet'].map((n) => `<span><img src="${S}items/${n}.png" alt="" /></span>`).join('')}</div>
  ${banner('Stats', ICON.chart)}
  <div class="stats"><div>Attack<b>184</b></div><div>Max HP<b>1,240</b></div><div>Crit<b>12%</b></div><div>Lifesteal<b>4%</b></div></div>`;

const art = (slot, l) => `<span class="art ${slot === 'hero' ? 'hero' : 'scene'}"><img src="${S}${l.art}.png" alt="" /></span>`;
const card = (slot, l, cls = '') => `<button type="button" class="look ${cls}" data-slot="${slot}" data-id="${l.id}">${art(slot, l)}<span class="name">${l.name}</span><span class="state"></span></button>`;
const row = (slot, l) => `<button type="button" class="look lrow" data-slot="${slot}" data-id="${l.id}">${art(slot, l)}<span class="txt"><span class="name">${l.name}</span><span class="state"></span></span><span class="tick">${ICON.check}</span></button>`;
const label = (slot) => `<div class="label">${SLOT[slot][1]}${SLOT[slot][0]}</div>`;
const more = (ghost) => `<button type="button" class="more ${ghost ? 'ghost' : ''}" data-more><span class="gem">${ICON.gem}</span>More looks in the Shop${ICON.right}</button>`;

const OPTIONS = [
  {
    key: 'A', name: 'A · Wardrobe section',
    note: 'A Wardrobe banner under Stats. Hero looks three across, rooms and arenas two across, cropped not shrunk. The worn one is ringed in silver. The Shop button closes the page.',
    body: () => `${gear()}
      ${banner('Wardrobe', ICON.shirt, '7 looks')}
      ${label('hero')}<div class="grid3">${LOOKS.hero.map((l) => card('hero', l)).join('')}</div>
      ${label('home')}<div class="grid2">${LOOKS.home.map((l) => card('home', l)).join('')}</div>
      ${label('arena')}<div class="grid2">${LOOKS.arena.map((l) => card('arena', l)).join('')}</div>
      ${more(false)}`,
  },
  {
    key: 'B', name: 'B · Gear | Looks switch',
    note: 'A switch at the top of the Hero tab, like the Shop\'s. Looks swaps the page for one list: a row per look with its art, name and a check. Short page, no scrolling past your gear.',
    body: () => `<div class="switch"><button type="button" data-side="gear">${ICON.swords}Gear</button><button type="button" class="on" data-side="looks">${ICON.shirt}Looks</button></div>
      <div data-pane="gear" hidden style="display:none">${gear()}</div>
      <div data-pane="looks" style="display:contents">
        ${label('hero')}<div class="grid3">${LOOKS.hero.map((l) => card('hero', l)).join('')}</div>
        ${label('home')}${LOOKS.home.map((l) => row('home', l)).join('')}
        ${label('arena')}${LOOKS.arena.map((l) => row('arena', l)).join('')}
        ${more(true)}
      </div>`,
  },
  {
    key: 'C', name: 'C · Rails',
    note: 'The same Wardrobe banner, but each slot is one row you swipe sideways. Compact however many looks you own; three rows and the Shop button fit on one screen.',
    body: () => `${gear()}
      ${banner('Wardrobe', ICON.shirt, '7 looks')}
      ${label('hero')}<div class="rail">${LOOKS.hero.map((l) => card('hero', l, 'h')).join('')}</div>
      ${label('home')}<div class="rail">${LOOKS.home.map((l) => card('home', l, 's')).join('')}</div>
      ${label('arena')}<div class="rail">${LOOKS.arena.map((l) => card('arena', l, 's')).join('')}</div>
      ${more(false)}`,
  },
];

const root = document.getElementById('opts');
for (const o of OPTIONS) {
  const el = document.createElement('div');
  el.className = 'opt';
  el.innerHTML = `<h2>${o.name}</h2><p>${o.note}</p><div class="phone">${head()}<div class="body">${o.body()}</div>${tabs()}<div class="toast"></div></div>`;
  root.appendChild(el);
  wire(el);
}

function wire(el) {
  const worn = { hero: 'starter', home: 'armory', arena: 'stone' };
  const toast = el.querySelector('.toast');
  let toastTimer;
  const say = (text) => { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1400); };
  const paint = () => el.querySelectorAll('.look').forEach((b) => {
    const on = worn[b.dataset.slot] === b.dataset.id;
    b.classList.toggle('worn', on);
    b.querySelector('.state').textContent = on ? 'Worn' : 'Wear';
  });
  const swap = (img, src) => { img.classList.add('swap'); setTimeout(() => { img.src = src; img.classList.remove('swap'); }, 120); };
  el.addEventListener('click', (e) => {
    const look = e.target.closest('.look');
    if (look) {
      const { slot, id } = look.dataset;
      if (worn[slot] === id) return;
      worn[slot] = id;
      const l = LOOKS[slot].find((x) => x.id === id);
      if (slot === 'hero') swap(el.querySelector('[data-hero]'), `${S}${l.art}.png`);
      if (slot === 'home') swap(el.querySelector('[data-room]'), `${S}${l.art}.png`);
      if (slot === 'arena') say(`${l.name} is your arena`);
      paint();
      return;
    }
    if (e.target.closest('[data-more]')) return say('→ Shop · Looks');
    const side = e.target.closest('[data-side]');
    if (side) {
      el.querySelectorAll('[data-side]').forEach((b) => b.classList.toggle('on', b === side));
      el.querySelectorAll('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== side.dataset.side; p.style.display = p.hidden ? 'none' : 'contents'; });
    }
  });
  paint();
}
</script>
</body>
</html>
