<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut, Give in button</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The Give in button, built like the skill keys (same size, lip and bevel).
   Each phone shows two skills above two Resist rows so the match is easy to judge. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 700px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; }
.col > p { margin: 0 0 12px; min-height: 66px; font-size: 15px; }
button { font: inherit; }

.phone {
  --bg: #07080c; --ink: #e8ebf0; --text: #a9adb6; --touch: #dbe2ee; --brass: #d2bb85; --bad: #d4574a; --spent: #6a6f7a;
  --phys: #e5705c; --magic: #a98be0;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --r-card: #161a24; --r-hi: #232a3a; --r-lo: #0a0c12;
  --s-card: #0e1117; --s-hi: #161a24; --s-lo: #07090d; --s-face: #2a2f3b; --s-base: #1a1d26;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  width: 390px; padding: 8px 12px 22px; background: var(--bg); border: 1px solid #000; border-radius: 34px; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.phone svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.shead { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 2px; }
.shead h3 { margin: 0; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--ink); text-transform: uppercase; }
.shead.bad { color: var(--bad); margin-top: 10px; }
.shead svg { width: 16px; height: 16px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }

.row { --c: var(--phys); position: relative; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 8px 6px 12px;
  clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--lip); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
.row.resist { background: var(--r-card); box-shadow: inset 2px 2px 0 var(--r-hi), inset -2px -2px 0 var(--r-lo); }
.row[data-t='magic'] { --c: var(--magic); }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nt { font: 500 16.5px 'Alegreya', Georgia, serif; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp { display: flex; gap: 4px; padding-left: 2px; }
.pp:empty { display: none; }
.pp i { width: 4px; height: 4px; background: var(--brass); }
.meta { display: flex; align-items: center; gap: 6px; }
.streak { min-width: 26px; display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; color: #8d8475; }
.plate { display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 7px; clip-path: var(--px2); background: #0a0c12;
  box-shadow: inset 2px 2px 0 #040508, inset -2px -2px 0 #1a1f2b; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--c); }
.plate svg { width: 12px; height: 12px; }

/* ---- The skill key (as built): type-coloured raised face on a 3px lip ---- */
.key { --lip: 3px; --face: color-mix(in srgb, var(--c) 88%, #000); --base: color-mix(in srgb, var(--c) 36%, #000); --ink: #fff; --ink-sh: 0 1px 0 rgba(0,0,0,.35);
  --bevel: inset 0 2px 0 rgba(255,255,255,.28), inset 2px 0 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25), inset -2px 0 0 rgba(0,0,0,.15);
  position: relative; flex: none; width: 76px; height: calc(34px + var(--lip)); padding: 0 6px var(--lip); display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  background: none; border: 0; cursor: pointer; font: 700 14.5px/1 'Alegreya Sans', sans-serif; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); text-shadow: var(--ink-sh); -webkit-tap-highlight-color: transparent; }
.key::before, .key::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.key::before { top: var(--lip); bottom: 0; background: var(--base); }
.key::after { top: 0; bottom: var(--lip); background: var(--face); box-shadow: var(--bevel); transition: top .07s, bottom .07s; }
.key > * { position: relative; z-index: 1; transition: transform .07s; }
.key svg { width: 13px; height: 13px; }
.key b { font-weight: inherit; }
.key:active::after, .struck .key::after { top: var(--lip); bottom: 0; }
.key:active > *, .struck .key > * { transform: translateY(var(--lip)); }
.struck { background: var(--s-card); box-shadow: inset 2px 2px 0 var(--s-hi), inset -2px -2px 0 var(--s-lo); }
.struck .nt { color: var(--spent); }
.struck .pp { opacity: .45; }
.struck .key { --face: var(--s-face); --base: var(--s-base); --ink: #5b606b; --ink-sh: none; --bevel: none; }
.struck .plate { background: #0c0e13; color: #3e434e; }
.struck .plate b { text-decoration: line-through; text-decoration-thickness: 1.5px; }

/* ---- Give in keys ---- */
.key.gi svg { width: 16px; height: 16px; }

/* 0 · Current: a ghost outline, no lip, wider than the skill key */
.v0 .key.gi { --ink: #e9a79f; --ink-sh: none; width: 92px; padding-bottom: 0; height: 34px; }
.v0 .key.gi::before { display: none; }
.v0 .key.gi::after { top: 0; bottom: 0; background: transparent; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bad) 50%, transparent); }
.v0 .key.gi:active::after { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.v0 .struck .key.gi::after { background: #0a0c12; box-shadow: inset 2px 2px 0 #040508, inset -2px -2px 0 #1a1f2b; }
.v0 .key.gi > * { transform: none !important; }

/* A · Red key: the skill key in the Resist red, with the label */
.vA .key.gi { --c: var(--bad); }
.vA .key.gi { font-size: 13.5px; gap: 3px; }
.vA .key.gi svg { width: 15px; height: 15px; }

/* B · Dark key: skill-key build, dark face, red lip and red words */
.vB .key.gi { --face: #1f2536; --base: color-mix(in srgb, var(--bad) 60%, #000); --ink: #eaa49c; --ink-sh: none;
  --bevel: inset 0 2px 0 rgba(255,255,255,.1), inset 2px 0 0 rgba(255,255,255,.04), inset 0 -2px 0 rgba(0,0,0,.3), inset -2px 0 0 rgba(0,0,0,.2); font-size: 13.5px; gap: 3px; }
.vB .key.gi svg { width: 15px; height: 15px; }

/* C · Icon key: the red key, the heart alone; the words live in the label for screen readers */
.vC .key.gi { --c: var(--bad); }
.vC .key.gi svg { width: 20px; height: 20px; }

/* D · Outlined key: dark face and a red edge, on a red lip */
.vD .key.gi { --face: #151925; --base: color-mix(in srgb, var(--bad) 60%, #000); --ink: #ef9a90; --ink-sh: none;
  --bevel: inset 0 0 0 2px color-mix(in srgb, var(--bad) 70%, #000); font-size: 13.5px; gap: 3px; }
.vD .key.gi svg { width: 15px; height: 15px; }
.vD .struck .key.gi { --bevel: none; }
</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · Give in button</h1>
  <p class="lede">Every key here is built like the skill keys: same 76px width, 3px lip and pixel bevel, and it presses down onto the lip. Two skills sit above two Resist rows in each phone to judge the match. Tap any key to try it. Numbers are made up.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const P = {
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  sword: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  magic: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  streak: '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
  heartMinus: '<path d="m14.479 19.374-.971.939a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5a5.2 5.2 0 0 1-.219 1.49"/><path d="M15 15h6"/>',
  swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/>',
};
const ic = (n) => `<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const T = { phys: 'sword', magic: 'magic' };
const streak = (s) => (s >= 3 ? ic('streak') + s : '');

const SKILLS = [
  { n: 'Morning run', t: 'phys', d: 240, r: 2, s: 12 },
  { n: 'Read a chapter', t: 'magic', d: 180, r: 1, s: 4, struck: true },
];
const BAD = [
  { n: 'Doomscroll', t: 'phys', d: 110, r: 3, s: 9 },
  { n: 'Late snacking', t: 'magic', d: 80, r: 1, s: 5, struck: true },
];
const pips = (r) => '<i></i>'.repeat(r);
const skillRow = (h) => `<li class="row${h.struck ? ' struck' : ''}" data-t="${h.t}" data-s="${h.s}">
  <span class="nm"><span class="nt">${h.n}</span><span class="pp">${pips(h.r)}</span></span>
  <span class="meta"><span class="streak">${h.struck ? '' : streak(h.s)}</span></span>
  <button class="key" type="button" aria-label="Complete ${h.n}">${ic(T[h.t])}<b>${h.d}</b></button></li>`;
const badRow = (h, v) => `<li class="row resist${h.struck ? ' struck' : ''}" data-t="${h.t}" data-s="${h.s}">
  <span class="nm"><span class="nt">${h.n}</span><span class="pp">${pips(h.r)}</span></span>
  <span class="meta"><span class="plate">${ic(T[h.t])}<b>${h.d}</b></span><span class="streak">${h.struck ? '' : streak(h.s)}</span></span>
  <button class="key gi" type="button" aria-label="Give in to ${h.n}" aria-pressed="${!!h.struck}">${ic('heartMinus')}${v === 'C' ? '' : '<span>Give in</span>'}</button></li>`;

const OPTIONS = [
  { v: '0', n: 'Current', d: 'For reference: a thin red outline, no lip, 92px wide. It is the only key that does not look pressed from the same mould as the skills.' },
  { v: 'A', n: 'Red key', d: 'The skill key in Resist red: solid face, white words, same bevel and lip. Loudest of the four; it sits in the list like a skill that costs you.' },
  { v: 'B', n: 'Dark key', d: 'Same build, but the face stays dark and only the lip and words are red. Quieter than a skill, still clearly a key.' },
  { v: 'C', n: 'Icon key', d: 'The red key with the broken heart alone, no words. Cleanest, but you read it as a symbol first. Needs the Resist header to explain it.' },
  { v: 'D', n: 'Outlined key', d: 'Keeps the ghost look of the current one, but on a real key: dark face, red edge, red lip. Presses down like the skills.' },
];
document.getElementById('grid').innerHTML = OPTIONS.map((x, i) => `<div class="col">
  <div class="tag">${x.v === '0' ? 'NOW' : x.v}</div><h2>${x.n.toUpperCase()}</h2><p>${x.d}</p>
  <div class="phone v${x.v}">
    <div class="shead"><h3>Skills</h3></div>
    <ul>${SKILLS.map(skillRow).join('')}</ul>
    <div class="shead bad">${ic('shield')}<h3>Resist</h3></div>
    <ul>${BAD.map((h) => badRow(h, x.v)).join('')}</ul>
  </div></div>`).join('');

document.addEventListener('click', (e) => {
  const b = e.target.closest('.key');
  if (!b) return;
  const r = b.closest('.row');
  const on = r.classList.toggle('struck');
  b.setAttribute('aria-pressed', String(on));
  r.querySelector('.streak').innerHTML = on ? '' : streak(+r.dataset.s);
});
</script>
</body>
</html>
