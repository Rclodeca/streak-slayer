<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Talent Learn key</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The talent node popup's Learn key, made the Shop's buy key (ShopBuyButton:
   stone-button, 13px icon, bold serif price; gold in card ink, gems in cyan,
   too dear in red, disabled sunk). Today's key and the Shop's own keys are shown
   beside it to compare. Pixel-cut, Midnight (moonlit.scss values). */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1240px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 820px; }
.row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.opt { width: 360px; max-width: 100%; }
.opt h2 { font: 600 13px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 4px; text-transform: uppercase; text-align: center; }
.opt > p { margin: 0 0 12px; font-size: 14.5px; text-align: center; min-height: 60px; }
.opt.now h2, .opt.ref h2 { color: #8a8aa6; }

.th {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --card-ink: #f4f4fa; --moon: #dfe0f0; --brass: #d2bb85; --on-brass: #222330;
  --card: #2d2c50; --card-hi: #4d4c7e; --card-lo: #191a28; --icon-gem: #6fd6ea; --icon-coin: #f0c64e; --heal: #4ac777; --stat: #d8cdb5;
  --field: #12131c; --sunk-hi: #0f1018; --sunk-lo: #2c2c47; --well: rgba(0,0,0,.22); --spent: #686877;
  --button-fill: #cdcedf; --button-text: #20202e; --button-lip: #828398; --stone-face: #38385c; --stone-lip: #161622;
  --short: #b65a50;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
}
.th svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The popup */
.modal { background: #232337; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #373857, inset -2px -2px 0 #171823; padding: 0 16px 18px; color: var(--text); }
.mh { display: flex; align-items: center; justify-content: space-between; margin: 0 -10px 14px -2px; padding: 10px 0 8px; border-bottom: 2px solid #0e0e19; }
.mh h3 { margin: 0; font: 600 15px 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: #f0f3f7; }
.mh .x { width: 44px; height: 44px; display: grid; place-items: center; color: var(--moon); }
.nhead { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.sock { width: 60px; height: 60px; flex: none; display: grid; place-items: center; color: #e86154; background: #1c1c33; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #0b0b16, inset -2px -2px 0 var(--card-hi); }
.sock svg { width: 28px; height: 28px; }
.nm { font: 600 19px/1.2 'Alegreya', serif; color: var(--text-h); }
.pips { display: inline-flex; gap: 3px; margin-top: 4px; }
.pip { width: 6px; height: 6px; border: 1.5px solid var(--brass); }
.pip.lit { background: var(--brass); }
.rt { display: flex; flex-direction: column; }
.desc { margin: 0 0 14px; font-size: 15px; color: var(--stat); }
.plates { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.plate { padding: 8px 10px; background: var(--field); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.plate small { display: block; margin-bottom: 2px; font: 600 9.5px 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--spent); }
.plate span { font: 700 16px 'Alegreya Sans'; color: var(--text-h); }
.plate.next span { color: var(--heal); }
.plate.next.done span { color: var(--spent); }

.states { display: grid; gap: 8px; margin-top: 10px; padding: 12px; background: #232337; clip-path: var(--px2); }
.states small { font: 700 10.5px 'Alegreya Sans'; letter-spacing: .16em; text-transform: uppercase; color: #8a8aa6; }

/* Today: the silver key with brass plates */
.silver { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; clip-path: var(--px2); font: 700 16px 'Alegreya Sans'; background: var(--button-fill); color: var(--button-text); border-bottom: 3px solid var(--button-lip); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18); }
.silver.off { background: var(--well); color: var(--spent); border-bottom-color: transparent; box-shadow: inset 2px 2px 0 var(--sunk-hi); }
.chips { display: inline-flex; align-items: center; gap: 10px; }
.chips > span { display: inline-flex; align-items: center; gap: 4px; }
.chips svg { width: 15px; height: 15px; }
.chips .g svg { color: var(--icon-coin); } .chips .m svg { color: var(--icon-gem); }
.plate-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; clip-path: var(--px2); background: var(--brass); color: var(--on-brass); font: 800 13px 'Alegreya Sans'; line-height: 1; }

/* The Shop's buy key, exactly (.shop-buy + stone-button) */
.shop-buy { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 76px; min-height: 44px; padding: 0 10px; white-space: nowrap;
  font: 700 16px 'Alegreya Sans'; letter-spacing: .01em; color: var(--moon); background: var(--stone-face); border: 0; border-bottom: 3px solid var(--stone-lip);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.1); clip-path: var(--px2); cursor: pointer; transition: transform .07s; user-select: none; }
.shop-buy:hover:not(.off) { background: color-mix(in srgb, var(--stone-face) 88%, #fff); }
.shop-buy:active:not(.off) { transform: translateY(3px); border-bottom-color: transparent; }
.shop-buy .verb { letter-spacing: .14em; }
.shop-buy .price { display: inline-flex; align-items: center; gap: 4px; font: 700 15px/1 'Alegreya', serif; color: var(--card-ink); }
.shop-buy .price svg { width: 13px; height: 13px; }
.shop-buy .price.g svg { color: var(--icon-coin); }
.shop-buy .price.m svg { color: var(--icon-gem); }
.shop-buy .price.m { color: var(--icon-gem); }
.shop-buy.short .price { color: var(--short); }
.shop-buy.gems:not(.off) { background: color-mix(in srgb, var(--stone-face) 74%, #1a4a66); }
.shop-buy.off { cursor: default; background: var(--well); border-bottom-color: transparent; box-shadow: inset 2px 2px 0 var(--sunk-hi); }
.shop-buy.spent { color: var(--spent); }
.prices { display: inline-flex; align-items: center; gap: 10px; }
.learn { display: flex; width: 100%; min-height: 48px; }

/* Shop reference rows */
.ware { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; background: var(--card); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); }
.ware .wsock { width: 42px; height: 42px; flex: none; display: grid; place-items: center; color: #c33a2e; background: #1c1c33; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #0b0b16, inset -2px -2px 0 var(--card-hi); }
.ware .wn { flex: 1; font: 700 16px 'Alegreya', serif; color: var(--card-ink); }
.ref .modal { padding-top: 14px; }
.ref .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.ref .acts .shop-buy { width: 100%; }
.ref .cancel { color: var(--moon); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; background: #2d2c50; color: #f4f4fa; font: 700 14px 'Alegreya Sans'; clip-path: polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px)); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="page th">
  <h1>TALENT · LEARN KEY</h1>
  <p class="lede">The Learn key made the Shop's buy key: dark stone, a small coin or gem, and the price in bold serif. Gold prices are in white, gem prices in cyan, and too dear turns them red, all as in the Shop. Tap Learn to buy a rank.</p>
  <div class="row" id="row"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const I = (p) => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICON = {
  x: I('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  sword: I('<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>'),
  flask: I('<path d="M9 3h6"/><path d="M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/>'),
  gem: I('<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>'),
  coin: I('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>'),
};
const loc = (n) => n.toLocaleString('en-US');
const price = (gold, gems) => `<span class="prices">${gold ? `<span class="price g">${ICON.coin}${loc(gold)}</span>` : ''}${gems ? `<span class="price m">${ICON.gem}${gems}</span>` : ''}</span>`;
const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n));
const chips = (gold, gems) => `<span class="chips">${gold ? `<span class="g">${ICON.coin}<span class="plate-count">${fmt(gold)}</span></span>` : ''}${gems ? `<span class="m">${ICON.gem}<span class="plate-count">${gems}</span></span>` : ''}</span>`;

const COST = { gold: 1250, gems: 4 };
const EARLY = { gold: 300, gems: 0 };

const KEY = {
  now: (s, c = COST) => s === 'full' ? `<div class="silver off">Full</div>`
    : `<div class="silver${s === 'short' ? ' off' : ''}">${s === 'short' ? 'Not enough' : 'Learn'} ${chips(c.gold, c.gems)}</div>`,
  fix: (s, c = COST) => s === 'full' ? `<div class="shop-buy learn off spent">Full</div>`
    : `<div class="shop-buy learn${s === 'short' ? ' short off' : ''}" ${s === 'ready' ? 'data-buy' : ''}><span class="verb">Learn</span>${price(c.gold, c.gems)}</div>`,
};

function popup(id, rank) {
  const max = 3, full = rank >= max;
  return `<div class="modal">
    <div class="mh"><h3>Talent</h3><span class="x">${ICON.x}</span></div>
    <div class="nhead"><span class="sock">${ICON.sword}</span><div class="rt"><span class="nm">Precision</span><span class="pips">${[1,2,3].map((n) => `<i class="pip${n <= rank ? ' lit' : ''}"></i>`).join('')}</span></div></div>
    <p class="desc">+3% physical damage per rank.</p>
    <div class="plates">
      <div class="plate"><small>Now · ${rank}/${max}</small><span>+${rank * 3}%</span></div>
      <div class="plate next${full ? ' done' : ''}"><small>Next · ${Math.min(rank + 1, max)}/${max}</small><span>${full ? '—' : '+' + (rank + 1) * 3 + '%'}</span></div>
    </div>
    ${KEY[id](full ? 'full' : 'ready')}
  </div>`;
}

const shopRef = `<div class="modal">
  <div class="ware"><span class="wsock">${ICON.flask}</span><span class="wn">Health Potion</span><span class="shop-buy"><span class="price g">${ICON.coin}${loc(480)}</span></span></div>
  <div class="ware" style="margin-top:6px"><span class="wsock">${ICON.flask}</span><span class="wn">Greater Potion</span><span class="shop-buy short off"><span class="price g">${ICON.coin}${loc(2400)}</span></span></div>
  <div class="acts"><span class="shop-buy cancel">Cancel</span><span class="shop-buy gems"><span class="verb">Buy</span><span class="price m">${ICON.gem}120</span></span></div>
</div>`;

const row = document.getElementById('row');
let rank = 1;
function render() {
  row.innerHTML = `
  <div class="opt now"><h2>Today</h2><p>Brass plates and coloured icons on the pale silver key.</p>${popup('now', 1)}
    <div class="states"><small>Short of the price</small>${KEY.now('short')}<small>Full</small>${KEY.now('full')}</div></div>
  <div class="opt fix" data-opt="fix"><h2>Shop key</h2><p>The Shop's buy key with a Learn verb, like the skin popup's Buy. Gold and gems side by side when a rank costs both.</p>${popup('fix', rank)}
    <div class="states"><small>Early rank (gold only)</small>${KEY.fix('ready', EARLY)}<small>Short of the price</small>${KEY.fix('short')}<small>Full</small>${KEY.fix('full')}</div></div>
  <div class="opt ref"><h2>In the Shop</h2><p>For comparison: a gold ware, one too dear, and the skin popup's gem Buy.</p>${shopRef}</div>`;
}
render();
const toast = document.getElementById('toast');
row.addEventListener('click', (e) => {
  if (!e.target.closest('.modal [data-buy]')) return;
  rank = Math.min(rank + 1, 3);
  setTimeout(() => { render(); toast.textContent = rank >= 3 ? 'Full' : `Learned rank ${rank}`; toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 900); }, 90);
});
</script>
</body>
</html>
