<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Hero tab prestige 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Prestige round 2: the mark lives on the name plate, "Title Name [P#]". 5 prestiges.
   Titles Veteran / Ascendant / Mythic in red-orange / blue / purple. Pixel-cut Moonlit. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1300px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 780px; }
section.opt { margin: 0 0 48px; }
section.opt h2 { font: 600 13px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; text-align: center; }
section.opt > p { margin: 0 auto 14px; max-width: 780px; text-align: center; font-size: 15px; }
.row { display: flex; gap: 18px 22px; flex-wrap: wrap; justify-content: center; }
figure { margin: 0; }
figcaption { text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-top: 6px; text-transform: uppercase; }

.head {
  --ink: #f0f3f7; --text: #a9adb6; --exp: #d9a93c; --streak: #e0894a; --hi: #333c52; --lo: #0c0f15;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  position: relative; width: 390px; height: 232px; overflow: hidden; background: #07080c; outline: 1px solid #000;
}
.head .room { position: absolute; left: -21px; top: 0; width: 432px; height: 232px; max-width: none; image-rendering: pixelated; }
.head .hero { position: absolute; left: 131px; bottom: 30px; width: 128px; height: 128px; image-rendering: pixelated; }
.head .menu { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; background: rgba(7,8,12,.88); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); display: flex; align-items: center; justify-content: center; color: #dbe2ee; }
.head .menu svg { width: 18px; height: 18px; }

.plate { position: absolute; z-index: 2; background: rgba(7,8,12,.88); clip-path: var(--px2); padding: 5px 10px; box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); color: var(--ink); }
.stat { bottom: 10px; display: flex; align-items: center; gap: 6px; line-height: 1; }
.stat svg { width: 14px; height: 14px; flex: none; }
.stat small { font: 700 10px 'Alegreya Sans'; letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
.stat b { font: 700 17px 'Alegreya', serif; }
.stat.level { left: 12px; }
.stat.streak { right: 12px; }
.ic-exp { color: var(--exp); }
.ic-streak { color: var(--streak); }

/* tier colours: c = text/badge, d = badge dark edge, l = badge light edge */
.t-vet  { --c: #e8643a; --l: #ffa27a; --d: #7a2a12; }
.t-asc  { --c: #4f8fe8; --l: #9cc4ff; --d: #1d3d72; }
.t-myth { --c: #a66cf0; --l: #d4b2ff; --d: #4a2580; }
.t-p2   { --c: #e0a23a; --l: #ffd58a; --d: #74501a; }
.t-p4   { --c: #6b76f0; --l: #b0b8ff; --d: #2c3080; }

/* the name plate: title + name + P badge */
.nameplate { left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.nameplate .who { font: 600 13px/1.15 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.nameplate .ttl { color: var(--c); }
/* stacked: title on its own line above the name */
.nameplate.stack { padding: 5px 8px 5px 10px; }
.nameplate.stack .who .ttl { display: block; font: 700 10px/1.2 'Alegreya Sans'; letter-spacing: .16em; margin-bottom: 1px; }

/* the plated P: a coloured metal tab with bevel */
.pbadge { flex: none; display: flex; align-items: center; justify-content: center; gap: 1px; height: 22px; min-width: 30px; padding: 0 6px; color: #fff;
  background: var(--c); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--l), inset -2px -2px 0 var(--d);
  font: 700 13px/1 'Cinzel', serif; text-shadow: 1px 1px 0 var(--d); }
.stack .pbadge { height: 30px; min-width: 34px; font-size: 16px; }
</style>
</head>
<body>
<div class="page">
  <h1>Prestige on the name plate</h1>
  <p class="lede">The mark lives on the name: <b>Title Name [P#]</b>. Five prestiges. A new hero (P0) shows only the name. The Level plate is back to plain.</p>
  <div id="opts"></div>
</div>
<script>
const ROOM = '../../public/sprites/home/armory.png';
const HERO = '../../public/sprites/player/warrior.png';
const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg>';
const FLAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
const MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';

// Three titles across five prestiges: the title is the tier, the P badge the exact rank.
const THREE = [null, ['Veteran', 't-vet'], ['Veteran', 't-vet'], ['Ascendant', 't-asc'], ['Ascendant', 't-asc'], ['Mythic', 't-myth']];
// Five titles, one per prestige, with two fill-ins between the user's three.
const FIVE = [null, ['Veteran', 't-vet'], ['Champion', 't-p2'], ['Ascendant', 't-asc'], ['Exalted', 't-p4'], ['Mythic', 't-myth']];

const stat = (s) =>
  `<span class="plate stat level"><span class="ic-exp">${UP}</span><small>Level</small><b>${s.lvl}</b></span>` +
  `<span class="plate stat streak"><span class="ic-streak">${FLAME}</span><small>Best streak</small><b>${s.streak}</b></span>`;

const plate = (titles, p, stacked) => {
  const t = titles[p];
  if (!t) return '<div class="plate nameplate"><span class="who">Kael</span></div>';
  const [title, cls] = t;
  return `<div class="plate nameplate ${stacked ? 'stack' : ''} ${cls}"><span class="who"><span class="ttl">${title}</span>${stacked ? '' : ' '}Kael</span><span class="pbadge">P${p}</span></div>`;
};

const STATES = [0, 1, 2, 3, 4, 5].map((p) => ({ p, lvl: p ? 12 : 12, streak: [9, 22, 47, 71, 96, 140][p] }));

const OPTIONS = [
  { name: 'A · One line, 3 titles', text: 'Title, name and badge on one line. Veteran covers P1–2, Ascendant P3–4, Mythic P5; the badge tells P1 from P2. Short and bold, but a long hero name gets crowded.',
    titles: THREE, stacked: false },
  { name: 'B · Stacked, 3 titles (recommended)', text: 'Title in small caps above the name, a bigger P badge to the right of both. Same titles as A. The name keeps its size, long names fit, and the badge reads as the "big plated P".',
    titles: THREE, stacked: true },
  { name: 'C · Stacked, 5 titles', text: 'One title per prestige, with two fill-ins (Champion in amber at P2, Exalted in indigo at P4). Every step looks new, but the colours get close together.',
    titles: FIVE, stacked: true },
];

document.getElementById('opts').innerHTML = OPTIONS.map((o) => `
  <section class="opt">
    <h2>${o.name}</h2>
    <p>${o.text}</p>
    <div class="row">${STATES.map((s) => `
      <figure>
        <div class="head">
          <img class="room" src="${ROOM}" alt="" />
          <img class="hero" src="${HERO}" alt="" />
          <span class="menu">${MENU}</span>
          ${plate(o.titles, s.p, o.stacked)}
          ${stat(s)}
        </div>
        <figcaption>${s.p ? `Prestige ${s.p}` : 'New hero · P0'}</figcaption>
      </figure>`).join('')}
    </div>
  </section>`).join('');
</script>
</body>
</html>
