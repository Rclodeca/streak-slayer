<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut, sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Pixel-cut main screen. The question here: how the sections separate. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; }
.col p { margin: 0 0 12px; min-height: 64px; font-size: 15px; }

/* ================= Pixel-cut, Moonlit ================= */
.phone {
  --bg: #07080c; --frame: #141720; --ink: #e8ebf0; --text: #a9adb6; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --phys: #e5705c; --magic: #a98be0; --heal: #7fc17a; --true: #f1e9d6;
  --spent: #6a6f7a; --done: #3c4352; --done-line: #566074; --streak-i: #8d8475;
  /* open card */
  --card: #171b25; --hi: #283041; --lo: #0d1017; --card-lip: #05060a; --resist-card: #141720;
  /* struck card (Now) */
  --s-card: #12151d; --s-hi: #1c2230; --s-lo: #0a0c12; --s-face: #232836; --s-base: #1a1d26; --s-name: var(--spent);
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  width: 390px; padding-bottom: 28px; background: var(--bg); border: 1px solid #000; border-radius: 34px; overflow: hidden;
  box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
button { font: inherit; }
.cap { font: 600 11px 'Cinzel', serif; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); }

.top { background: radial-gradient(70% 55% at 72% 50%, #1c2230, transparent 70%), var(--bg); }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 0; }
.menu { width: 40px; height: 40px; clip-path: var(--px2); background: rgba(219,226,238,.08); border: 1px solid rgba(219,226,238,.35); display: grid; place-items: center; color: var(--touch); }
.menu svg { width: 18px; height: 18px; }
.stage { position: relative; height: 300px; }
.boss { position: absolute; right: 8px; top: 6px; width: 172px; image-rendering: pixelated;
  filter: drop-shadow(2px 0 0 #2a1a10) drop-shadow(-2px 0 0 #2a1a10) drop-shadow(0 2px 0 #2a1a10) drop-shadow(0 -2px 0 #2a1a10) drop-shadow(0 0 12px rgba(224,120,58,.4)); }
.hero { position: absolute; left: 8px; top: 128px; width: 140px; image-rendering: pixelated; transform: scaleX(-1); filter: drop-shadow(0 0 18px rgba(0,0,0,.9)) brightness(.9); }
.platform { position: absolute; left: 6px; top: 262px; width: 150px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,165,200,.16), transparent); }
.unit { position: absolute; }
.unit.b { left: 16px; top: 22px; width: 188px; }
.unit.h { left: 172px; top: 196px; width: 202px; }
.uname { display: flex; align-items: center; gap: 6px; font: 600 12.5px 'Cinzel', serif; letter-spacing: .2em; color: var(--ink); margin-bottom: 5px; text-transform: uppercase; }
.uname small { font-size: 11px; color: var(--brass); letter-spacing: .1em; }
.uname .cue { display: inline-block; width: 6px; height: 6px; margin-left: 3px; border-top: 1.5px solid var(--text); border-right: 1.5px solid var(--text); transform: rotate(45deg); }
.bar { position: relative; height: 15px; background: rgba(0,0,0,.5); border: 1px solid rgba(0,0,0,.6); overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#c4402a, #8c2616); }
.bar i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--exp); }
.bar span { position: absolute; right: 5px; top: 0; font: 700 10.5px/13px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.7); }
.stats { display: flex; gap: 8px; margin-top: 6px; font: 700 11px 'Alegreya Sans', sans-serif; color: #868a93; white-space: nowrap; }
.stats span { display: inline-flex; align-items: center; gap: 2px; }
.stats svg { width: 12px; height: 12px; }

.sec { margin: 18px 12px 0; }
.shead { display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 2px; }
.shead h2 { margin: 0; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--ink); text-transform: uppercase; }
.add { font: 700 12.5px 'Alegreya Sans', sans-serif; color: var(--touch); background: rgba(219,226,238,.08); border: 1px solid rgba(219,226,238,.35); clip-path: var(--px2); padding: 8px 13px; min-height: 38px; }
.group { font: 600 10px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 12px 2px 7px; text-transform: uppercase; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }

/* Card */
.row { --face: color-mix(in srgb, var(--c) 82%, #000); --base: color-mix(in srgb, var(--c) 36%, #000);
  --btn-sh: inset 0 2px 0 rgba(255,255,255,.28), inset 2px 0 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25), inset -2px 0 0 rgba(0,0,0,.15);
  --btn-c: #fff; --btn-ts: 0 1px 0 rgba(0,0,0,.35);
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 12px;
  clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--card-lip); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
.row[data-t='true'] { --btn-c: #1e1c18; --btn-ts: none; }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nt { font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp { display: flex; gap: 4px; padding-left: 2px; }
.pp:empty { display: none; }
.pp i { width: 4px; height: 4px; background: var(--brass); }
.pp i:nth-child(5) { margin-left: 4px; }
.meta { display: flex; align-items: center; gap: 7px; }
.streak { min-width: 26px; display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; }
.tagw { font: 700 12px 'Alegreya Sans', sans-serif; color: #5f6470; }
.next { font: 700 12px 'Alegreya Sans', sans-serif; color: var(--touch); opacity: .7; }

.press { --lip: 3px; position: relative; flex: none; min-width: 58px; height: calc(34px + var(--lip)); padding: 0 10px var(--lip);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; cursor: pointer;
  font: 700 14.5px 'Alegreya Sans', sans-serif; color: var(--btn-c); text-shadow: var(--btn-ts); -webkit-tap-highlight-color: transparent; }
.press::before, .press::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.press::before { top: var(--lip); bottom: 0; background: var(--base); }
.press::after { top: 0; bottom: var(--lip); background: var(--face); box-shadow: var(--btn-sh); transition: top .07s, bottom .07s; }
.press svg, .press b { position: relative; z-index: 1; font-weight: inherit; transition: transform .07s; }
.press svg { width: 13px; height: 13px; }
.press .ic-done { display: none; }
.press:active::after, .on .press::after { top: var(--lip); bottom: 0; }
.press:active > *, .on .press > * { transform: translateY(var(--lip)); }

/* Struck (Now) */
.phone:not(.lift) .row { --s-num: color-mix(in srgb, var(--c) 45%, var(--spent)); }
.phone .row.on { --face: var(--s-face); --base: var(--s-base); --btn-sh: none; --btn-c: var(--s-num); --btn-ts: none;
  background: var(--s-card); box-shadow: inset 2px 2px 0 var(--s-hi), inset -2px -2px 0 var(--s-lo); }
.row.on .nt, .row.on .qn { color: var(--s-name); }
.row.on .streak, .row.on .pp, .row.on .reward { opacity: .45; }

/* Resting: flat, can't be pressed */
.rest { margin-top: 8px; }
.rest summary { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 2px; list-style: none; cursor: pointer;
  font: 600 10px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); text-transform: uppercase; }
.rest summary::-webkit-details-marker { display: none; }
.rest summary span { color: var(--touch); }
.rest summary::after { content: ''; width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translateY(-2px); }
.rest[open] summary::after { transform: rotate(225deg) translateY(-1px); }
.phone .row.resting { --face: #12151d; --base: transparent; --btn-sh: inset 0 0 0 2px rgba(255,255,255,.04); --btn-c: color-mix(in srgb, var(--c) 45%, var(--spent)); --btn-ts: none;
  background: var(--resist-card); box-shadow: inset 2px 2px 0 #1c2230, inset -2px -2px 0 #0a0c12; }
.row.resting .nt { color: var(--text); font-weight: 500; }
.resting .press { pointer-events: none; }
.resting .press::after { top: var(--lip); bottom: 0; }
.resting .press > * { transform: translateY(var(--lip)); }

/* Resist */
.phone .resist .row:not(.on) { --face: #1d2230; --base: color-mix(in srgb, var(--bad) 55%, #000); --btn-c: color-mix(in srgb, var(--bad) 72%, #fff); --btn-ts: none;
  --btn-sh: inset 0 2px 0 rgba(255,255,255,.08); background: var(--resist-card); }
.resist .nt { color: var(--text); font-weight: 500; }

/* Quests */
.quest { padding-left: 4px; gap: 6px; }
.quest .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px 0; }
.quest .qn { font: 600 16px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest .qm { display: flex; align-items: center; gap: 6px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--text); }
.qpips { display: inline-flex; gap: 3px; }
.qpips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--brass); }
.qpips i.lit { background: var(--brass); }
.qm em { font-style: normal; }
.quest.soon .qm em { color: var(--exp); }
.reward { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding-right: 6px; font: 700 11px 'Alegreya Sans', sans-serif; color: var(--exp); }
.reward svg { width: 18px; height: 18px; }
.quest.side .reward { color: #c8a96e; }
.qchk { flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.qchk input { position: absolute; opacity: 0; pointer-events: none; }
.qchk i { width: 20px; height: 20px; display: grid; place-items: center; clip-path: var(--px2); background: rgba(0,0,0,.4); border: 2px solid var(--touch); }
.qchk svg { width: 14px; height: 14px; opacity: 0; color: var(--touch); }
.quest.on .qchk i { background: var(--done); border-color: var(--done-line); }
.quest.on .qchk svg { opacity: 1; }

/* Log */
.log { margin: 22px 12px 0; padding: 12px 14px 6px; background: var(--frame); clip-path: var(--px); box-shadow: inset 2px 2px 0 #232937, inset -2px -2px 0 #0b0d12; }
.log h2 { margin: 0 0 6px; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--ink); text-transform: uppercase; }
.log ul { gap: 0; }
.log li { display: block; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.04); font-size: 14px; color: var(--text); }
.log li:first-child { border-top: 0; }
.log li > svg:first-child { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; }
.log .d { color: var(--phys); font-weight: 700; } .log .x { color: var(--exp); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; padding: 1px 6px; background: rgba(255,255,255,.05); font-size: 12px; font-weight: 700; color: var(--ink); }
.chip svg { width: 11px; height: 11px; }


/* ================= Daily vs weekly ================= */
.phone { --dimc: #6a6f7a; --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --ink: #f0f3f7; --resist-card: #161a24; --s-num: #5b606b;
  --s-card: #0e1117; --s-hi: #161a24; --s-lo: #07090d; --s-face: #1b1f28; --s-base: #111319; --s-name: #5b606b; padding-top: 6px; }
.phone .sec:not(.resist) .row:not(.on):not(.resting) { --face: color-mix(in srgb, var(--c) 88%, #000); }
.sec { --sp: var(--touch); position: relative; margin: 26px 12px 0 18px; padding-left: 14px; }
.sec.resist { --sp: var(--bad); }
.sec::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 6px; width: 3px; background: var(--sp); opacity: .5; }
.shead { position: relative; height: 44px; min-height: 0; margin-bottom: 4px; }
.shead::before { content: ''; position: absolute; left: -17px; top: 50%; width: 9px; height: 9px; margin-top: -5px; background: var(--sp); box-shadow: 0 0 0 3px var(--bg); }
.group { position: relative; display: flex; align-items: center; gap: 8px; margin: 16px 2px 8px; }
.group::before { content: ''; position: absolute; left: -14px; width: 8px; height: 2px; background: var(--sp); opacity: .7; }
.group:first-of-type { margin-top: 0; }
.sec > .group:first-of-type { margin-top: 0; }
.phone .row.resting { --face: var(--s-face); --base: var(--s-base); --btn-sh: none; --btn-c: var(--s-num); --btn-ts: none;
  background: var(--s-card); box-shadow: inset 2px 2px 0 var(--s-hi), inset -2px -2px 0 var(--s-lo); }
.row.resting .nt { color: var(--s-name); font-weight: 600; }
.row.resting .pp { opacity: .45; }
.row.resting .next { color: var(--s-name); opacity: 1; }
.row.resting .press { pointer-events: none; }
.row.resting .press::after { top: var(--lip); bottom: 0; }
.row.resting .press > * { transform: translateY(var(--lip)); }
.row.resting .cad { opacity: .5; }
.phone .resist .row:not(.on):not(.resting) { --face: #1d2230; --base: color-mix(in srgb, var(--bad) 55%, #000); --btn-c: color-mix(in srgb, var(--bad) 72%, #fff); --btn-ts: none; --btn-sh: inset 0 2px 0 rgba(255,255,255,.08); background: var(--resist-card); }
.resist .row:not(.resting) .nt { color: var(--text); font-weight: 500; }
.slot { position: relative; }
.row { width: 100%; }

/* A · Glyph: a calendar page marks every card; "1" for a day, a week of dots for a week */
.cad-i { width: 15px; height: 15px; flex: none; }
.cad-i svg { width: 15px; height: 15px; display: block; }
.o-glyph .cad-i { color: #7c8496; }
.o-glyph .on .cad-i { opacity: .5; }
.o-glyph .meta { gap: 6px; }
.o-glyph .streak { min-width: 28px; }

/* B · Week strip: a day is seven separate cells (due days lit); a week is one joined bar */
.cadwrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.cad { display: flex; gap: 2px; }
.cad i { width: 5px; height: 7px; background: #2a3142; }
.cad i.lit { background: #9aa4b8; }
.cad i.now { box-shadow: 0 0 0 1px var(--bg), 0 0 0 2px #dbe2ee; }
.cad.wk { gap: 0; }
.cad.wk i { width: 5px; background: var(--touch); opacity: .85; }
.on .cad i.lit { background: #4a5164; }
.on .cad.wk i { background: #4a5164; opacity: 1; }
.o-strip .streak { min-width: 26px; justify-content: flex-end; }
.o-strip .meta { gap: 8px; }
.cadlbl { font: 700 9px 'Cinzel', serif; letter-spacing: .12em; color: #6a6f7a; }

/* C · Stack: a weekly card is a pile of seven; two ghost cards peek out beneath it */
.slot.wk { margin-bottom: 12px; }
.slot.wk::before, .slot.wk::after { content: ''; position: absolute; left: 5px; right: 5px; bottom: -5px; height: 100%; clip-path: var(--px); background: #232a3c; z-index: 0; box-shadow: inset 2px 2px 0 #343e56, inset -2px -2px 0 #11141c; }
.slot.wk::after { left: 10px; right: 10px; bottom: -10px; background: #181d2b; box-shadow: inset 2px 2px 0 #262e42, inset -2px -2px 0 #0b0d13; }
.slot.wk .row { z-index: 1; }
.resist .slot.wk::before { background: #2a2230; }
.resist .slot.wk::after { background: #1d1722; }
.o-stack .group { display: none; }

/* D · Tabs: Daily / Weekly pages under each title */
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 10px; cursor: pointer;
  clip-path: var(--px2); background: #141823; border: 0; color: var(--text); font: 600 10.5px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase;
  box-shadow: inset 2px 2px 0 #0a0c11, inset -2px -2px 0 #232a3a; }
.tab b { font: 700 12px 'Alegreya Sans', sans-serif; letter-spacing: 0; color: var(--text); }
.tab.sel { background: #262d3f; color: var(--ink); box-shadow: inset 2px 2px 0 #3a4458, inset -2px -2px 0 #11141c; }
.tab.sel b { color: var(--touch); }
.tab .dot { width: 6px; height: 6px; background: var(--touch); }
.tab .dot.off { display: none; }
.sec.resist .tab.sel { box-shadow: inset 2px 2px 0 #4a3036, inset -2px -2px 0 #1a0f12; background: #2a1f26; }
.page-wk, .page-dy { display: none; }
.sec[data-tab='dy'] .page-dy, .sec[data-tab='wk'] .page-wk { display: block; }
.o-tabs .group { display: none; }

/* Reference: as built */
.ref .tagw { font: 700 12px 'Alegreya Sans', sans-serif; color: #5f6470; }

</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · daily vs weekly</h1>
  <p class="lede">Four ways to tell a daily from a weekly, each used the same way in Skills and Resist (today they differ: headings in Skills, a "Week" word in Resist). Tap a button to strike; in D, tap the tabs.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// Lucide shapes the app uses (src/components/ui/statIcons.ts).
const SHIELD = '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>';
const LU = {
  physical: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  magic: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  true: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  healing: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  crit: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  armor: SHIELD,
  magicResist: SHIELD + '<path d="M12 22V2"/>',
  streak: '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
  exp: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>',
  gift: '<rect x="3" y="7" width="18" height="4" rx="1"/><path d="M12 7v14"/><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/>',
  quest: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  menu: '<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const COLOR = { physical: 'var(--phys)', magic: 'var(--magic)', true: 'var(--true)', healing: 'var(--heal)', crit: '#d6a24f', armor: '#a8a092', magicResist: '#8d9bd1', streak: 'var(--streak-i)', exp: '#d8b46a', quest: '#a8a092' };
const icon = (name, color = COLOR[name] || 'currentColor', cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:${color}">${LU[name]}</svg>`;
const TYPE_ICON = { heal: 'healing', phys: 'physical', magic: 'magic', true: 'true' };


LU.cal1 = '<path d="M11 14h1v4"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M8 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/>';
LU.cal7 = '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>';
// days: due weekdays Mon..Sun (index 0..6). Today is Monday.
const ALL = [1, 1, 1, 1, 1, 1, 1];
const skillsDaily = [
  { n: 'Stretch',       t: 'heal',  d: '141', s: 12, r: 2, on: true, days: ALL },
  { n: 'Morning run',   t: 'phys',  d: '1.1K', s: 23, r: 8, on: true, days: ALL },
  { n: 'Pushups',       t: 'phys',  d: '196', s: 4,  r: 1, days: ALL },
  { n: 'Read 20 pages', t: 'magic', d: '288', s: 9,  r: 3, on: true, days: [1, 1, 1, 1, 1, 0, 0] },
  { n: 'Swim',          t: 'phys',  d: '230', s: 5,  r: 1, next: 'Thu', rest: true, days: [0, 0, 1, 0, 1, 0, 1] },
];
const skillsWeekly = [
  { n: 'Call family',   t: 'heal',  d: '180', s: 0,  r: 0, wk: true },
  { n: 'Long hike',     t: 'phys',  d: '1.4K', s: 6, r: 5, on: true, wk: true },
];
const resistDaily = [
  { n: 'Doomscroll',    t: 'phys',  d: '110', s: 9, r: 1, days: ALL },
  { n: 'Late snacking', t: 'magic', d: '80',  s: 3, r: 0, on: true, days: ALL },
];
const resistWeekly = [
  { n: 'Takeout',       t: 'magic', d: '150', s: 3, r: 0, wk: true },
  { n: 'Alcohol',       t: 'phys',  d: '120', s: 2, r: 0, on: true, wk: true },
];

const strip = (h) => h.wk
  ? `<span class="cad wk">${'<i></i>'.repeat(7)}</span>`
  : `<span class="cad">${h.days.map((d, i) => `<i class="${d ? 'lit' : ''}${i === 0 ? ' now' : ''}"></i>`).join('')}</span>`;

function row(h, mode, ref) {
  const cls = `row${h.on ? ' on' : ''}${h.rest ? ' resting' : ''}`;
  const glyph = `<span class="cad-i">${icon(h.wk ? 'cal7' : 'cal1', 'currentColor')}</span>`;
  const meta = (ref && h.refTag ? '<span class="tagw">Week</span>' : '')
    + (h.next ? `<span class="next">${h.next}</span>` : '')
    + (mode === 'glyph' ? glyph : '')
    + (mode === 'strip' ? '' : '')
    + `<span class="streak">${h.s >= 3 ? icon('streak') + h.s : ''}</span>`;
  const metaBlock = mode === 'strip'
    ? `<span class="meta"><span class="cadwrap">${strip(h)}<span class="meta" style="gap:6px">${h.next ? `<span class="next">${h.next}</span>` : ''}<span class="streak">${h.s >= 3 ? icon('streak') + h.s : ''}</span></span></span></span>`
    : `<span class="meta">${meta}</span>`;
  return `<li class="slot${mode === 'stack' && h.wk ? ' wk' : ''}"><div class="${cls}" data-t="${h.t}" style="--c: var(--${h.t})">
    <span class="nm"><span class="nt">${h.n}</span><span class="pp">${'<i></i>'.repeat(h.r)}</span></span>
    ${metaBlock}
    <button class="press" type="button">${icon(TYPE_ICON[h.t], 'currentColor', 'ic-type')}${icon('check', 'currentColor', 'ic-done')}<b>${h.d}</b></button>
  </div></li>`;
}

const cnt = (list) => `<b>${list.filter((x) => x.on).length}</b>/${list.length}`;
const list = (items, mode, ref) => `<ul>${items.map((h) => row(h, mode, ref)).join('')}</ul>`;
const grp = (title) => `<div class="group"><span>${title}</span></div>`;
const head = (title, add) => `<div class="shead"><span class="ht"><h2>${title}</h2></span><span class="hr">${add ? `<button class="add" type="button">+ ${add}</button>` : ''}</span></div>`;

function section(kind, mode) {
  const resist = kind === 'resist';
  const dy = resist ? resistDaily : skillsDaily;
  let wk = resist ? resistWeekly : skillsWeekly;
  const title = resist ? 'Resist' : 'Skills';
  const add = resist ? '' : 'New habit';
  const cls = resist ? 'sec resist' : 'sec';
  if (mode === 'ref') {
    if (resist) {
      const flat = [...resistDaily, ...resistWeekly.map((h) => ({ ...h, refTag: true }))];
      return `<section class="${cls} ref">${head(title, add)}${list(flat, 'ref', true)}</section>`;
    }
    return `<section class="${cls} ref">${head(title, add)}${grp('Daily')}${list(dy, 'ref')}${grp('Weekly')}${list(wk, 'ref')}</section>`;
  }
  if (mode === 'tabs') {
    const pend = (l) => l.some((h) => !h.on && !h.rest);
    return `<section class="${cls}" data-tab="dy">${head(title, add)}
      <div class="tabs">
        <button class="tab sel" type="button" data-p="dy">Daily <b>${cnt(dy)}</b><i class="dot${pend(dy) ? '' : ' off'}"></i></button>
        <button class="tab" type="button" data-p="wk">Weekly <b>${cnt(wk)}</b><i class="dot${pend(wk) ? '' : ' off'}"></i></button>
      </div>
      <div class="page-dy">${list(dy, mode)}</div><div class="page-wk">${list(wk, mode)}</div></section>`;
  }
  // one flat list: due dailies, weeklies, resting dailies
  const all = [...dy.filter((h) => !h.rest), ...wk, ...dy.filter((h) => h.rest)];
  return `<section class="${cls}">${head(title, add)}${list(all, mode)}</section>`;
}

const screen = (mode, cls) => `<div class="phone ${cls}">${section('skills', mode)}${section('resist', mode)}</div>`;

const OPTIONS = [
  { mode: 'ref',   cls: 'ref',      tag: 'REFERENCE', n: 'Now',   d: 'Skills split under Daily and Weekly headings. Resist is one list with a grey "Week" word on weekly ones. Two different methods.' },
  { mode: 'glyph', cls: 'o-glyph',  tag: 'A', n: 'Glyph',  d: 'One list, no headings. A tiny calendar on every card: a page showing "1" for a daily, a week of dots for a weekly. Weeklies sort below dailies.' },
  { mode: 'strip', cls: 'o-strip',  tag: 'B', n: 'Week strip', d: 'Seven cells on every card. A daily is seven separate cells, lit on its due days (today ringed); a weekly is one joined bar. Doubles as the set-days display.' },
  { mode: 'stack', cls: 'o-stack',  tag: 'C', n: 'Stack',  d: 'One list. A weekly card is a pile: two ghost cards peek out beneath it. No text, no icon, and a weekly reads heavier because it hits harder.' },
  { mode: 'tabs',  cls: 'o-tabs',   tag: 'D', n: 'Tabs',   d: 'A Daily / Weekly switch under each title, with a count and a lit pixel when something is still open. One list on screen at a time, so the screen is shorter.' },
];

document.getElementById('grid').innerHTML = OPTIONS.map((o) => `<div class="col">
  <div class="tag">${o.tag}</div><h2>${o.n.toUpperCase()}</h2><p>${o.d}</p>
  ${screen(o.mode, o.cls)}
</div>`).join('');

document.addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (t) {
    const sec = t.closest('.sec');
    sec.dataset.tab = t.dataset.p;
    sec.querySelectorAll('.tab').forEach((x) => x.classList.toggle('sel', x === t));
    return;
  }
  const b = e.target.closest('.press');
  if (b) b.closest('.row').classList.toggle('on');
});
</script>
</body>
</html>
