<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The boss popup in Pixel-cut, built on option A (Socket) of pixel-gear.html.
   The character popup in A is on the left for reference. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; }
.col > p { margin: 0 0 12px; min-height: 64px; font-size: 15px; }

.phone {
  --bg: #07080c; --frame: #141720; --well: #0d1017; --ink: #f0f3f7; --text: #a9adb6; --dim: #6a6f7a; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --good: #7fc17a; --boss: #c4402a;
  --phys: #e5705c; --magic: #a98be0; --heal: #7fc17a; --true: #f1e9d6; --crit: #d6a24f; --steel: #a8a092; --arcane: #8d9bd1; --blood: #d0475a; --violet: #a98be0; --health: #e0604f;
  --common: #8d8475; --uncommon: #86b08b; --rare: #7f9fd1; --epic: #ae8bd6; --relic: #ec8338;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  position: relative; width: 390px; padding: 54px 10px 28px; background: radial-gradient(70% 30% at 50% 6%, #1c2230, transparent 70%), var(--bg);
  border: 1px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.phone::before { content: ''; position: absolute; inset: 0; background: rgba(3,4,6,.6); pointer-events: none; }
.phone > * { position: relative; }
svg.i { width: 14px; height: 14px; flex: none; }

.modal { clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); padding: 0 12px 14px; }
.mhead { display: flex; align-items: center; min-height: 52px; }
.mhead h3 { margin: 0; flex: 1; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
.close { width: 40px; height: 40px; margin-right: -4px; display: grid; place-items: center; clip-path: var(--px2); background: rgba(219,226,238,.06); border: 1px solid rgba(219,226,238,.25); color: var(--touch); }
.close svg { width: 16px; height: 16px; }
.lbl { margin: 16px 2px 8px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }

/* Sockets (option A): a dark hole, bevel flipped, lit in --r along its lower edge */
.sock { --r: var(--common); clip-path: var(--px); background: radial-gradient(circle, color-mix(in srgb, var(--r) 20%, #07090d), #05060a 72%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--r) 60%, #000), inset 4px 4px 0 #020305, inset -4px -4px 0 color-mix(in srgb, var(--r) 30%, #0b0d12); }
.well { clip-path: var(--px); background: var(--well); box-shadow: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b; }
.card { clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--lip); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }

/* Figure + bars */
.herow { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 4px; }
.herow img { image-rendering: pixelated; flex: none; filter: drop-shadow(0 0 14px rgba(0,0,0,.9)); }
.herow .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lvl { font: 600 12px 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); }
.btag { font: 600 12.5px 'Alegreya Sans', sans-serif; color: var(--text); }
.bname { font: 600 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.bar { position: relative; height: 15px; background: rgba(0,0,0,.5); border: 1px solid rgba(0,0,0,.6); overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#c4402a, #8c2616); }
.bar span { position: absolute; right: 5px; top: 0; font: 700 10.5px/13px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.7); z-index: 1; }
.bar .mk { position: absolute; top: 0; bottom: 0; width: 2px; background: #f1e9d6; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.bar .mk.spent { opacity: 0; }
.xbar { height: 4px; background: rgba(0,0,0,.5); }
.xbar b { display: block; height: 100%; background: var(--exp); }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
.tl { display: flex; align-items: center; gap: 5px; font: 600 12.5px 'Alegreya Sans', sans-serif; color: var(--text); }
.tv { font: 700 18px 'Alegreya Sans', sans-serif; color: var(--ink); }
.tv em { font-style: normal; font-size: 12.5px; color: var(--good); margin-left: 4px; }
.tn { font-size: 12px; color: var(--dim); }
.note { margin: 10px 2px 0; font-size: 13px; color: var(--dim); }

/* Gear rows (reference column) */
.gear { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.gr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px 8px 8px; }
.slot { position: relative; flex: none; width: 76px; height: 76px; }
.slot .art { position: absolute; inset: 0; overflow: hidden; }
.slot img { --rim: color-mix(in srgb, var(--r) 55%, #000); position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; transform: translate(-50%, -50%); image-rendering: pixelated;
  filter: drop-shadow(2px 0 0 var(--rim)) drop-shadow(-2px 0 0 var(--rim)) drop-shadow(0 2px 0 var(--rim)) drop-shadow(0 -2px 0 var(--rim)) drop-shadow(0 0 6px color-mix(in srgb, var(--r) 45%, transparent)); }
.gt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 3px; }
.gn { font: 600 16px 'Alegreya', Georgia, serif; color: var(--ink); line-height: 1.2; }
.rar { font: 600 12.5px 'Alegreya Sans', sans-serif; color: var(--r); text-transform: capitalize; }
.bons { display: flex; flex-wrap: wrap; gap: 2px 10px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.bons span { display: inline-flex; align-items: center; gap: 3px; }
.bons small { font-weight: 500; font-size: 13px; color: var(--text); }
.gfx { font-size: 13.5px; color: var(--text); }

/* Boss skill rows: a small socket holding the skill's icon */
.sk { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; }
.sk .sock { --r: var(--bad); flex: none; width: 44px; height: 44px; display: grid; place-items: center; }
.sk .sock svg { width: 20px; height: 20px; }
.sk .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sk .n { font: 600 15.5px 'Alegreya', Georgia, serif; color: var(--ink); }
.sk .e { font-size: 13.5px; color: var(--text); }
.sk .d { flex: none; font: 700 15px 'Alegreya Sans', sans-serif; color: #e7a198; padding-right: 2px; }
.sk.wait { color: var(--dim); }
.sk.wait .sock { --r: #2a3140; }
.sk.wait .n { color: var(--text); }

/* ---------- 1 · Mirror: the character popup's layout, boss in a well ---------- */
.o1 .herow img { width: 128px; height: 128px; }

/* ---------- 2 · Socketed: the boss in a big red-lit socket, name + HP below,
   stats split Attack / Defense, active skills as their own cards ---------- */
.o2 .stagew { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 14px 14px; }
.o2 .bigsock { --r: var(--boss); width: 176px; height: 176px; display: grid; place-items: center;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--r) 65%, #000), inset 6px 6px 0 #020305, inset -6px -6px 0 color-mix(in srgb, var(--r) 32%, #0b0d12); }
.o2 .bigsock img { width: 128px; height: 128px; image-rendering: pixelated; filter: drop-shadow(0 0 12px rgba(224,120,58,.35)); }
.o2 .who { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.o2 .stagew .bar { width: 100%; }
.o2 .tiles.three { grid-template-columns: repeat(3, 1fr); }
.o2 .three .tile { padding: 7px 8px; }
.o2 .three .tl { font-size: 11.5px; }
.o2 .three .tv { font-size: 16px; }

/* ---------- 3 · Ledger: boss beside its numbers in one well, skills below ---------- */
.o3 .top { display: flex; gap: 10px; }
.o3 .figsock { --r: var(--boss); flex: none; width: 128px; height: 148px; display: grid; place-items: end center; padding-bottom: 6px; }
.o3 .figsock img { width: 128px; height: 128px; image-rendering: pixelated; }
.o3 .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.o3 .side .bar { margin-bottom: 4px; }
.o3 .ledger { padding: 2px 10px; }
.o3 .lr { display: flex; align-items: baseline; gap: 6px; padding: 5px 0; font: 600 13px 'Alegreya Sans', sans-serif; }
.o3 .lr + .lr { border-top: 1px solid rgba(255,255,255,.04); }
.o3 .lr .tl { flex: 1; font-size: 13px; }
.o3 .lr .tv { font-size: 14.5px; }
.o3 .lr small { flex-basis: 100%; font-size: 11.5px; color: var(--dim); padding-left: 19px; margin-top: -3px; }
.o3 .lr:has(small) { flex-wrap: wrap; }
</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · boss</h1>
  <p class="lede">The boss popup in the Socket look. The character popup is first, for reference. Steel Bulwark, boss #14, with Reflect running and Doom on its way.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const SHIELD = '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>';
const LU = {
  health: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>',
  physical: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>',
  magic: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  true: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  healing: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  crit: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  armor: SHIELD,
  magicResist: SHIELD + '<path d="M12 22V2"/>',
  lifesteal: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  reflect: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
  doom: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
  unknown: '<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const COLOR = { health: 'var(--health)', physical: 'var(--phys)', magic: 'var(--magic)', true: 'var(--true)', healing: 'var(--heal)', crit: 'var(--crit)', armor: 'var(--steel)', magicResist: 'var(--arcane)', lifesteal: 'var(--blood)', reflect: 'var(--steel)', doom: 'var(--violet)', unknown: 'currentColor', x: 'currentColor' };
const icon = (n, c = COLOR[n]) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:${c}">${LU[n]}</svg>`;
const SPR = '../../public/sprites/';
const close = `<span class="close">${icon('x')}</span>`;

const BOSS = 'Steel Bulwark', IMG = `${SPR}bosses/armored3x.png`;
const hp = `<div class="bar"><b style="width:58%"></b><i class="mk" style="left:75%;opacity:0"></i><i class="mk" style="left:50%"></i><i class="mk" style="left:25%"></i><span>41K / 70K</span></div>`;
const attack = [['physical', 'Physical attack', '620'], ['magic', 'Magic attack', '180'], ['crit', 'Crit chance', '12%']];
const defense = [['armor', 'Armor', '900', '31.0% less damage'], ['magicResist', 'Magic resist', '240', '10.7% less damage']];
const skills = [
  ['reflect', 'Reflect', 'Reflects 5% of your damage', '2d'],
  ['doom', 'Doom', 'Half your HP', '3d'],
];
const note = '<p class="note">Attack is what a missed medium daily deals. Easy ~0.67x, hard ~1.33x; a crit or missed weekly doubles it. Armor and magic resist show the reduction your attacks face after your pen items.</p>';
const tile = ([ic, l, v, n]) => `<div class="tile well"><span class="tl">${icon(ic)}${l}</span><span class="tv">${v}</span>${n ? `<span class="tn">${n}</span>` : ''}</div>`;
const skillRow = ([ic, n, e, d], cls = 'card') => `<div class="sk ${cls}"><span class="sock">${icon(ic)}</span><span class="t"><span class="n">${n}</span><span class="e">${e}</span></span><span class="d">${d}</span></div>`;
const waiting = (cls = 'well') => `<div class="sk wait ${cls}"><span class="sock">${icon('unknown', '#4a5160')}</span><span class="t"><span class="n">Unknown</span><span class="e">Wakes at 25% HP</span></span></div>`;

function charRef() {
  const it = [
    ['Godslayer Greatblade', 'godslayer-greatblade', 'epic', [['physical', '+84%', 'physical'], ['health', '+40%', 'max health']], '+30% damage to bosses above 75% HP.'],
    ['First Blood', 'first-blood', 'relic', [['physical', '+25%', 'physical'], ['lifesteal', '+2%', 'lifesteal']], 'First hit on each boss always crits.'],
  ];
  return `<div class="phone"><div class="modal">
    <div class="mhead"><h3>Aldric</h3>${close}</div>
    <div class="herow well"><img src="${SPR}player/warrior.png" style="width:112px;height:112px" alt="">
      <div class="info"><span class="lvl">Level 23</span><div class="bar"><b style="width:72%"></b><span>3.0K / 4.2K</span></div><div class="xbar"><b style="width:38%"></b></div></div></div>
    <div class="lbl">Equipment</div>
    <ul class="gear">${it.map(([n, ic, r, b, fx]) => `<li class="gr card" style="--r:var(--${r})"><span class="slot sock" style="--r:var(--${r})"><span class="art"><img src="${SPR}items/${ic}.png" alt=""></span></span>
      <div class="gt"><span class="gn">${n}</span><span class="rar">${r}</span><span class="bons">${b.map(([s, v, l]) => `<span>${icon(s)}${v} <small>${l}</small></span>`).join('')}</span><span class="gfx">${fx}</span></div></li>`).join('')}</ul>
    <div class="lbl">Stats</div>
    <div class="tiles">${[['health', 'Max health', '4.2K'], ['physical', 'Physical', '1.1K']].map(tile).join('')}</div>
  </div></div>`;
}

// 1 · Mirror: same bones as the character popup; skills stay stat tiles, as today.
function o1() {
  return `<div class="phone"><div class="modal">
    <div class="mhead"><h3>Boss</h3>${close}</div>
    <div class="herow well"><img src="${IMG}" alt=""><div class="info"><span class="btag">Boss #14</span><span class="bname">${BOSS}</span>${hp}</div></div>
    <div class="lbl">Stats</div>
    <div class="tiles">${[...attack, ...defense].map(tile).join('')}${skills.map(([ic, l, n, d]) => tile([ic, l, d, n])).join('')}</div>
    ${note}
  </div></div>`;
}

// 2 · Socketed: the boss sits in a big socket lit red; skills get their own cards.
function o2() {
  return `<div class="phone"><div class="modal">
    <div class="mhead"><h3>Boss #14</h3>${close}</div>
    <div class="stagew well"><span class="bigsock sock"><img src="${IMG}" alt=""></span>
      <div class="who"><span class="bname">${BOSS}</span></div>${hp}</div>
    <div class="lbl">Skills</div>
    <div class="gear">${skills.map((s) => skillRow(s)).join('')}</div>
    <div class="lbl">Attack</div>
    <div class="tiles three">${attack.map(tile).join('')}</div>
    <div class="lbl">Defense</div>
    <div class="tiles">${defense.map(tile).join('')}</div>
    ${note}
  </div></div>`;
}

// 3 · Ledger: the boss in a tall socket beside its numbers; skills below as cards.
function o3() {
  return `<div class="phone"><div class="modal">
    <div class="mhead"><h3>Boss</h3>${close}</div>
    <div class="top"><span class="figsock sock"><img src="${IMG}" alt=""></span>
      <div class="side"><span class="btag">Boss #14</span><span class="bname">${BOSS}</span>${hp}
        <div class="ledger well">${[...attack, ...defense].map(([ic, l, v, n]) => `<div class="lr"><span class="tl">${icon(ic)}${l}</span><span class="tv">${v}</span>${n ? `<small>${n}</small>` : ''}</div>`).join('')}</div></div></div>
    <div class="lbl">Skills</div>
    <div class="gear">${skills.map((s) => skillRow(s)).join('')}</div>
    ${note}
  </div></div>`;
}

const options = [
  ['ref', 'Reference · Character (A)', 'The picked Socket look, cut short: the hero well, gear in sockets on lifted cards, stats in wells.', charRef],
  ['o1', '1 · Mirror', 'The character popup’s bones: boss in the well beside its name and HP. Running skills stay tiles among the stats, as today.', o1],
  ['o2', '2 · Socketed', 'The boss in a big socket lit red, name and HP under it. Skills get their own cards with the icon in a small socket; stats split into Attack and Defense.', o2],
  ['o3', '3 · Ledger', 'The boss in a tall socket beside its numbers as one ledger. Skills below as cards, the same as option 2.', o3],
];
document.getElementById('grid').innerHTML = options.map(([cls, h, p, fn]) =>
  `<div class="col ${cls}"><div class="tag">${cls === 'ref' ? 'Picked' : 'Option'}</div><h2>${h}</h2><p>${p}</p>${fn()}</div>`).join('');
</script>
</body>
</html>
