<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut, desktop drop-down</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The desktop drop-down: the phone's Focus strip (76px, halved sprites, both HP
   bars) dropped in once the banner has scrolled away, with the two bars side by
   side instead of stacked. Pixel-cut, Moonlit. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; text-transform: uppercase; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 760px; }
.opt { max-width: 1280px; margin: 0 auto 44px; }
.opt .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; text-transform: uppercase; }
.opt h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.opt p { margin: 0 0 12px; font-size: 15px; max-width: 760px; }

.desk {
  --bg: #07080c; --ink: #f0f3f7; --text: #a9adb6; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --phys: #e5705c; --magic: #a98be0; --heal: #7fc17a; --true: #f1e9d6;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --card-lip: #05060a;
  --well: #0a0c12; --well-hi: #1a1f2b; --well-lo: #040508;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  position: relative; height: 430px; overflow: hidden; background: var(--bg); border: 1px solid #000; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}

/* ---- the strip ---- */
.strip { position: absolute; z-index: 5; left: 0; right: 0; top: 0; height: 76px; background: #0c0f17; border-bottom: 3px solid var(--card-lip); box-shadow: 0 10px 18px -8px rgba(0,0,0,.7); overflow: hidden; }
.strip::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: conic-gradient(#141926 25%, #0f131d 0 50%, #141926 0 75%, #0f131d 0) 0 0 / 4px 4px, #0f131d; opacity: .55; }
.strip-in { position: relative; height: 100%; max-width: 1216px; margin: 0 auto; padding: 0 18px; display: flex; align-items: center; gap: 14px; }
.sprite { flex: none; display: block; image-rendering: pixelated; }
.sprite.hero { width: 56px; transform: scaleX(-1); align-self: flex-end; margin-bottom: 8px; }
.sprite.boss { width: 64px; align-self: flex-start; margin-top: 6px; }
.side { flex: 1; min-width: 0; text-shadow: 0 0 8px #000, 0 1px 2px #000; }
.uname { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; font: 600 12px/1.2 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uname small, .bnum { font: 700 12px 'Alegreya Sans', sans-serif; color: var(--brass); letter-spacing: .04em; }
.side.r .uname { justify-content: flex-end; }
.bar { position: relative; height: 16px; clip-path: var(--px2); background: var(--well); box-shadow: inset 2px 2px 0 var(--well-lo), inset -2px -2px 0 var(--well-hi); }
.bar b { position: absolute; left: 2px; top: 2px; bottom: 2px; background: #b83a26; box-shadow: inset 0 2px 0 #e06447, inset 0 -2px 0 #7c2214; }
.bar i { position: absolute; left: 2px; bottom: 2px; height: 2px; background: var(--exp); z-index: 1; }
.bar span { position: absolute; right: 5px; top: 0; bottom: 0; z-index: 2; display: flex; align-items: center; font: 700 12px/1 'Alegreya Sans', sans-serif; letter-spacing: .03em; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); text-shadow: 0 0 3px #000, 0 0 2px #000; }
.bar .mk { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--brass); z-index: 1; padding: 0; }
.bar .mk.fired { background: #4a4f5c; }
/* the boss's bar drains toward its sprite */
.side.r .bar b { left: auto; right: 2px; }
.side.r .bar span { right: auto; left: 5px; }

/* ---- page under it ---- */
.under { position: absolute; inset: 0; padding: 96px 0 0; overflow: hidden; }
.cols { max-width: 1216px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.shead { display: flex; align-items: center; height: 36px; padding: 0 2px; }
.shead h3 { margin: 0; font: 600 12.5px 'Cinzel', serif; letter-spacing: .22em; color: var(--ink); text-transform: uppercase; }
.rowlist { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; list-style: none; }
.row { --face: color-mix(in srgb, var(--c) 88%, #000); --base: color-mix(in srgb, var(--c) 36%, #000);
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 12px;
  clip-path: var(--px); background: var(--card); border-bottom: 3px solid var(--card-lip); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
.nm { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.nt { font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); }
.pp { display: flex; gap: 4px; padding-left: 2px; }
.pp i { width: 4px; height: 4px; background: var(--brass); }
.pp i:nth-child(5) { margin-left: 4px; }
.streak { display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; }
.press { --lip: 3px; position: relative; flex: none; min-width: 58px; height: calc(34px + var(--lip)); padding: 0 10px var(--lip);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: none; border: 0;
  font: 700 14.5px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.press::before, .press::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px2); }
.press::before { top: var(--lip); bottom: 0; background: var(--base); }
.press::after { top: 0; bottom: var(--lip); background: var(--face); box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 2px 0 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25); }
.press svg, .press b { position: relative; z-index: 1; }
.press svg { width: 13px; height: 13px; }
.row.q { --c: var(--exp); }
</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · desktop drop-down</h1>
  <p class="lede">The old Ashen bar is gone. Once the banner has scrolled away, the phone's Focus strip drops in across the top, held to the app's column: the same halved sprites and the same two HP bars, now side by side. Shown over the Skills list, scrolled a little way down.</p>
  <div id="opts"></div>
</div>
<script>
const LU = {
  physical: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  magic: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  true: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  healing: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  crit: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  streak: '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:currentColor">${LU[name]}</svg>`;
const BOSS = '../../public/sprites/bosses/balanced.png';
const HERO = '../../public/sprites/player/warrior.png';

const heroSide = `<div class="side l"><div class="uname"><span>Ryn</span><small>14</small></div>
  <div class="bar"><b style="width:62%"></b><i style="width:38%"></i><span>3.56K / 5.74K</span></div></div>`;
const bossSide = `<div class="side r"><div class="uname"><span class="bnum">#9</span><span>Arcane Adept</span></div>
  <div class="bar"><b style="width:41%"></b><span class="mk fired" style="right:66%"></span><span class="mk" style="right:33%"></span><span>266 / 648</span></div></div>`;
const heroImg = `<img class="sprite hero" src="${HERO}" alt="" />`;
const bossImg = `<img class="sprite boss" src="${BOSS}" alt="" />`;

const ROW = (c, name, pips, streak, kind, val, cls = '') => `<li class="row ${cls}" style="--c:${c}">
  <span class="nm"><span class="nt">${name}</span>${pips ? `<span class="pp">${'<i></i>'.repeat(pips)}</span>` : ''}</span>
  ${streak ? `<span class="streak">${icon('streak')}${streak}</span>` : ''}
  <button class="press" type="button">${icon(kind)}<b>${val}</b></button></li>`;
const UNDER = `<div class="under"><div class="cols">
  <section><div class="shead"><h3>Skills</h3></div><ul class="rowlist">
    ${ROW('var(--phys)', 'Morning run', 8, 23, 'physical', '1.1K')}
    ${ROW('var(--magic)', 'Read 20 pages', 6, 11, 'magic', '640')}
    ${ROW('var(--heal)', 'Stretch', 4, 31, 'healing', '526')}
    ${ROW('var(--true)', 'Journal', 3, 5, 'true', '611')}
  </ul></section>
  <section><div class="shead"><h3>Quests</h3></div><ul class="rowlist">
    ${ROW('var(--exp)', 'Book the dentist', 0, 0, 'crit', '300', 'q')}
    ${ROW('var(--exp)', 'Clear the garage', 0, 0, 'crit', '900', 'q')}
    ${ROW('var(--exp)', 'Renew passport', 0, 0, 'crit', '600', 'q')}
  </ul></section></div></div>`;

const OPTIONS = [
  { tag: 'Option A · Recommended', h: 'Sprites at the ends', p: 'Hero at the far left, boss at the far right, as on the stage; the two bars meet in the middle, each with its name above. The hero\'s EXP is the gold seam under its bar; the boss\'s bar drains toward its sprite, its skill notches mirrored.',
    strip: `${heroImg}${heroSide}${bossSide}${bossImg}` },
  { tag: 'Option B', h: 'Face-off', p: 'The two sprites stand in the middle facing each other, the bars running out to each side. The fight reads as one scene, but the bars sit further apart.',
    strip: `${heroSide}${heroImg}${bossImg}${bossSide}` },
];
document.getElementById('opts').innerHTML = OPTIONS.map((o) => `<div class="opt">
  <div class="tag">${o.tag}</div><h2>${o.h}</h2><p>${o.p}</p>
  <div class="desk">${UNDER}<div class="strip"><div class="strip-in">${o.strip}</div></div></div></div>`).join('');
</script>
</body>
</html>
