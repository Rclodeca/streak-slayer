<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Prestige tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Prestige tree in the Talents tab, four options, Pixel-cut on Midnight. One linear ladder, I to V.
   The state buttons at the top redraw every option: sealed (never prestiged, under level 30), ready (level 31),
   climbing (rank II, level 44 of 50) and done (Mythic V). */
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b12; color: #b8b6c4; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; max-width: 1240px; margin: 0 auto; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 8px; }
.lede { text-align: center; margin: 0 auto 16px; max-width: 700px; }
button { font: inherit; }
svg { flex: none; }
.states { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 34px; }
.states button { min-height: 40px; padding: 0 14px; border: 1px solid #414163; background: #1c1c2a; color: #dfe0f0; border-radius: 4px; cursor: pointer; }
.states button.on { background: #d2bb85; color: #1a1a24; border-color: #d2bb85; font-weight: 800; }
.opt { margin: 0 0 54px; }
.opt h2 { text-align: center; margin: 0 0 4px; font: 600 13px 'Cinzel', serif; letter-spacing: .26em; color: #ece8de; text-transform: uppercase; }
.opt .note { text-align: center; margin: 0 auto 16px; max-width: 660px; font-size: 14px; color: #8f8ca8; }
.row { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; align-items: flex-start; }
.cap-under { text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-top: 8px; text-transform: uppercase; }

/* ---------- Midnight tokens + the phone ---------- */
.phone {
  --bg: #11121b; --text: #d3d4e4; --text-h: #f4f4fa; --frame: #232337; --panel-hi: #373857; --panel-lo: #171823;
  --card: #2d2c50; --card-hi: #4d4c7e; --card-lo: #191a28; --code-bg: #202030; --sunk-hi: #0f1018; --sunk-lo: #2c2c47;
  --moon: #dfe0f0; --moon-solid: #b0b1cb; --brass: #d2bb85; --brass-solid: #b39a66; --dim: #8384a0; --spent: #686877;
  --stone-face: #38385c; --stone-lip: #161622; --quiet: #26263d;
  --phys: #e86154; --health: #c33a2e; --exp: #d8b46a; --coin: #f0c64e; --gem: #6fd6ea; --steel: #9fb4cc; --heal: #4ac777;
  --button-fill: #cdcedf; --button-lip: #828398;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --px3: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  position: relative; width: 375px; max-width: 100%; height: 740px; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text); border-radius: 28px; outline: 1px solid #000; box-shadow: 0 0 0 6px #1a1a24;
}
.rare  { --c: #5f95e6; --d: #1f3c70; --g: rgba(95,149,230,.45); }
.epic  { --c: #b57be8; --d: #4f2a7e; --g: rgba(181,123,232,.45); }
.relic { --c: #f58a35; --d: #7a3a0e; --g: rgba(245,138,53,.5); }

.ph-top { display: flex; align-items: center; gap: 8px; height: 50px; padding: 6px 12px 0 14px; }
.ph-top h3 { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 14px 'Cinzel', serif; letter-spacing: .24em; color: var(--text-h); text-transform: uppercase; }
.ph-top h3 svg { width: 18px; height: 18px; color: var(--brass); }
.purse { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; }
.chip svg { width: 15px; height: 15px; }
.chip b { min-width: 26px; height: 24px; padding: 0 5px; display: inline-grid; place-items: center; font: 800 13px 'Alegreya Sans'; color: #1c1a14; background: linear-gradient(var(--brass), var(--brass-solid)); clip-path: var(--px2); }
.menu { width: 36px; height: 36px; display: grid; place-items: center; background: var(--frame); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo); color: var(--moon); }
.menu svg { width: 18px; height: 18px; }
.kept { margin: 0 14px 6px; font: 600 12px 'Alegreya Sans'; letter-spacing: .04em; color: var(--spent); }
.ph-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; padding-bottom: 4px; background: #0d0e16; border-top: 2px solid #232337; }
.tabs span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 10px 'Alegreya Sans'; letter-spacing: .06em; color: var(--spent); text-transform: uppercase; }
.tabs svg { width: 20px; height: 20px; }
.tabs .on { color: var(--text-h); }
.tabs .on svg { color: var(--brass); }

/* shared bits */
.cin { font-family: 'Cinzel', serif; }
.ttl { font: 700 10px/1.2 'Alegreya Sans'; letter-spacing: .18em; text-transform: uppercase; color: var(--c); }
.spec { font: 700 15px/1.2 'Alegreya', serif; color: var(--text-h); }
.lvbar { font: 800 12px 'Alegreya Sans'; color: var(--dim); font-variant-numeric: tabular-nums; }
.lockic { width: 12px; height: 12px; color: var(--spent); }
.gains { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 12px; font: 700 13px 'Alegreya Sans'; color: var(--text); }
.gains span { display: inline-flex; align-items: center; gap: 4px; }
.gains svg { width: 14px; height: 14px; }
.gains b { color: var(--text-h); }
.i-phys { color: var(--phys); } .i-health { color: var(--health); } .i-exp { color: var(--exp); } .i-gem { color: var(--gem); } .i-coin { color: var(--coin); }

/* the numeral plate: PrestigeNumeral, sized up */
.plate { position: relative; display: inline-grid; place-items: center; width: 52px; height: 52px; color: var(--c); background: #0a0c12; clip-path: var(--px3);
  box-shadow: inset 3px 3px 0 var(--c), inset -3px -3px 0 var(--d); font: 900 20px/1 'Cinzel', serif; letter-spacing: .02em; }
.plate.sealed { color: #3a3a55; box-shadow: inset 3px 3px 0 #2a2a42, inset -3px -3px 0 #14141f; background: #0c0c15; }
.plate.done { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 35%, #0a0c12), #0a0c12 75%); color: #fff; text-shadow: 0 0 8px var(--c), 0 2px 0 var(--d); }
.plate.next { animation: glow 2.2s ease-in-out infinite; }
.plate.ready { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 25%, #0a0c12), #0a0c12 75%); }

/* the big Prestige button: the next rank's colour, glowing */
.pbtn { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border: 0; cursor: pointer; overflow: hidden;
  color: #fff; background: linear-gradient(color-mix(in srgb, var(--c) 85%, #fff), var(--c) 45%, var(--d)); clip-path: var(--px3);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 var(--d); font: 900 17px 'Cinzel', serif; letter-spacing: .3em; text-shadow: 0 2px 0 var(--d); }
.pbtn svg { width: 20px; height: 20px; }
.pbtn::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sweep 2.8s ease-in-out infinite; }
.pwrap { position: relative; filter: drop-shadow(0 0 14px var(--g)); }
.prog { position: relative; height: 22px; background: #0a0b12; clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.prog i { position: absolute; left: 3px; top: 3px; bottom: 3px; background: linear-gradient(var(--c), var(--d)); }
.prog span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 12px 'Alegreya Sans'; color: var(--text-h); text-shadow: 0 1px 0 #000; }

/* embers rising: a few dots, transform and opacity only */
.embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.embers i { position: absolute; bottom: -6px; width: 3px; height: 3px; background: var(--c); box-shadow: 0 0 6px var(--c); animation: rise linear infinite; opacity: 0; }

@keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px var(--c)); } 50% { filter: drop-shadow(0 0 12px var(--c)); } }
@keyframes sweep { 0% { left: -60%; } 55%,100% { left: 130%; } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-420px); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
@keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.sealed-note { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lockmark { width: 40px; height: 40px; display: grid; place-items: center; background: var(--bg); border: 1px solid #2c2c47; border-radius: 50%; color: var(--text); }
.lockmark svg { width: 18px; height: 18px; }

/* ---------- A · Crown plinth ---------- */
.a-tree { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 12px 6px; }
.a-trunk { position: relative; display: flex; flex-direction: column-reverse; gap: 22px; padding: 10px 0 8px; }
.a-trunk::before { content: ''; position: absolute; left: 50%; top: 36px; bottom: 30px; width: 4px; margin-left: -2px; background: var(--sunk-lo); }
.a-trunk .lit-line { position: absolute; left: 50%; width: 4px; margin-left: -2px; bottom: 30px; background: linear-gradient(0deg, #5f95e6, #5f95e6 35%, #b57be8 55%, #b57be8 75%, #f58a35); box-shadow: 0 0 10px rgba(181,123,232,.6); }
.a-node { position: relative; display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; }
.a-node .plate { justify-self: center; z-index: 1; }
.a-node .lft { justify-self: end; padding-right: 12px; text-align: right; }
.a-node .rgt { padding-left: 12px; }
.a-node .rgt .spec { display: flex; align-items: center; gap: 5px; }
.a-node .rgt .spec svg { width: 15px; height: 15px; color: var(--c); }
.a-node.sealed .spec, .a-node.sealed .ttl { color: var(--spent); }
.a-node.sealed .spec svg { color: var(--spent); }
.a-node .rays { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; z-index: 0; border-radius: 50%;
  background: repeating-conic-gradient(var(--g) 0 8deg, transparent 8deg 30deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); animation: spin 14s linear infinite; }
.a-node.top .plate { width: 62px; height: 62px; font-size: 24px; }
.a-each { margin: 4px 0 8px; padding: 8px 10px; background: var(--code-bg); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.a-each .lbl { display: block; text-align: center; margin-bottom: 4px; font: 700 10px 'Cinzel', serif; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.a-act { padding: 0 2px 8px; }
.a-foot { padding: 0 10px 10px; }
.a-foot svg.stand { display: block; width: 100%; height: 16px; }
.a-pl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.a-pl span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; clip-path: var(--px2);
  background: linear-gradient(var(--stone-face) 0 7px, var(--quiet) 7px); border-bottom: 3px solid var(--stone-lip); color: var(--spent);
  font: 700 9px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; }
.a-pl span em { display: inline-flex; align-items: center; gap: 4px; font-style: normal; }
.a-pl span svg { width: 13px; height: 13px; }
.a-pl span b { font: 800 11px 'Alegreya Sans'; letter-spacing: 0; color: rgba(210,187,133,.6); }
.a-pl .crown { color: var(--text-h); background: linear-gradient(color-mix(in srgb, var(--c) 55%, var(--card-hi)) 0 8px, color-mix(in srgb, var(--c) 28%, var(--card)) 8px); min-height: 60px; margin-top: -8px; box-shadow: 0 0 14px var(--g); }
.a-pl .crown svg { color: var(--c); }
.a-pl .crown b { color: var(--c); }
.a-pl .crown.sealed { background: linear-gradient(var(--stone-face) 0 7px, var(--quiet) 7px); color: var(--spent); box-shadow: none; }
.a-pl .crown.sealed svg, .a-pl .crown.sealed b { color: var(--spent); }
.a-sealed .a-trunk { opacity: .28; filter: grayscale(1); }
.a-veil { position: absolute; inset: 0; display: grid; place-items: center; }

/* ---------- B · The spire ---------- */
.sw { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 12px 8px; padding: 3px; background: #0a0b12; clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--sunk-hi), inset -2px -2px 0 var(--sunk-lo); }
.sw span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; font: 700 12px 'Cinzel', serif; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.sw span svg { width: 14px; height: 14px; }
.sw .on { color: var(--text-h); background: var(--card); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--card-hi), inset -2px -2px 0 var(--card-lo); }
.sw .on.pr svg { color: var(--c); }
.sw .lockic { width: 12px; height: 12px; }
.b-sky { position: relative; flex: 1; overflow: hidden; margin: 0 12px; clip-path: var(--px3);
  background: radial-gradient(ellipse 70% 40% at 50% 0%, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%), linear-gradient(#06070d, #0d0f1d 60%, #141629); }
.b-stars { position: absolute; inset: 0; }
.b-stars i { position: absolute; width: 2px; height: 2px; background: #dfe0f0; animation: twinkle 3s ease-in-out infinite; }
.b-moon { position: absolute; right: 26px; top: 22px; width: 26px; height: 26px; background: #e9e6d6; clip-path: var(--px3); box-shadow: inset -7px -3px 0 #b9b6a6; }
.b-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: repeating-linear-gradient(90deg, #191a2a 0 14px, #1d1e31 14px 28px); border-top: 3px solid #2c2d47; }
.b-spire { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; }
.b-tier { position: relative; display: grid; place-items: center; margin-top: -2px; clip-path: var(--px2);
  background: linear-gradient(90deg, #22233a, #33345a 45%, #2a2b48 55%, #1a1b2c); box-shadow: inset 0 3px 0 #45466e, inset 0 -3px 0 #121320; }
.b-tier b { font: 900 18px/1 'Cinzel', serif; color: #3b3c5e; text-shadow: 0 1px 0 #0d0d16; }
.b-tier.done { background: linear-gradient(90deg, color-mix(in srgb, var(--d) 70%, #1a1b2c), color-mix(in srgb, var(--c) 40%, #33345a) 45%, color-mix(in srgb, var(--c) 30%, #2a2b48) 55%, color-mix(in srgb, var(--d) 60%, #1a1b2c)); box-shadow: inset 0 3px 0 color-mix(in srgb, var(--c) 60%, #fff), inset 0 -3px 0 var(--d), 0 0 18px var(--g); }
.b-tier.done b { color: #fff; text-shadow: 0 0 8px var(--c), 0 2px 0 var(--d); }
.b-tier.next b { color: var(--c); animation: glow 2.2s ease-in-out infinite; }
.b-tier.next { box-shadow: inset 0 3px 0 #45466e, inset 0 -3px 0 #121320, inset 0 0 0 2px var(--c); }
.b-tag { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; text-align: left; }
.b-tag .spec { font-size: 13px; }
.b-tier.sealed .b-tag .spec { color: var(--spent); }
.b-tier.sealed .b-tag .ttl { color: #4a4a66; }
.b-lv { position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
.b-peak { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 30px solid #2a2b48; margin-bottom: -2px; }
.b-flame { position: relative; width: 22px; height: 28px; margin-bottom: 2px; }
.b-flame::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, #fff3c4 0 18%, #f58a35 40%, transparent 72%); filter: blur(.5px); animation: twinkle 1.4s ease-in-out infinite; }
.b-flame.out::before { background: radial-gradient(ellipse at 50% 70%, #3a3a55 0 20%, transparent 60%); animation: none; }
.b-beam { position: absolute; left: 50%; bottom: 44px; width: 70px; margin-left: -35px; top: 0; background: linear-gradient(0deg, var(--g), transparent 85%); -webkit-mask: linear-gradient(90deg, transparent, #000 35%, #000 65%, transparent); mask: linear-gradient(90deg, transparent, #000 35%, #000 65%, transparent); }
.b-hero { position: absolute; left: 50%; bottom: 30px; width: 64px; height: 64px; margin-left: -32px; image-rendering: pixelated; z-index: 2; }
.b-hero.off { opacity: 0; }
.b-panel { margin: 8px 12px 10px; padding: 10px 12px 12px; background: var(--frame); clip-path: var(--px3); box-shadow: inset 3px 3px 0 var(--panel-hi), inset -3px -3px 0 var(--panel-lo); }
.b-next { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.b-next .plate { width: 42px; height: 42px; font-size: 16px; }
.b-next div { flex: 1; min-width: 0; }
.b-next .lvbar { margin-left: auto; }
.b-panel .gains { margin-bottom: 10px; }
.b-dark .b-spire { opacity: .35; }
.b-dark .b-sky { background: linear-gradient(#06070d, #0b0c16 60%, #10111e); }
.b-veil { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; }
.b-mythic { text-align: center; padding: 6px 0 2px; }
.b-mythic .ttl { font-size: 12px; }
.b-mythic .spec { font-size: 17px; margin-top: 2px; }

/* ---------- C · Sigil strip + sheet ---------- */
.c-strip { position: relative; display: flex; align-items: center; gap: 8px; margin: 0 12px 8px; padding: 8px 10px; background: var(--frame); clip-path: var(--px3); box-shadow: inset 3px 3px 0 var(--panel-hi), inset -3px -3px 0 var(--panel-lo); min-height: 58px; }
.c-strip .lbl { font: 700 10px/1.25 'Cinzel', serif; letter-spacing: .18em; color: var(--text-h); text-transform: uppercase; width: 72px; }
.c-strip .lbl small { display: block; font: 800 11px 'Alegreya Sans'; letter-spacing: .02em; text-transform: none; color: var(--dim); margin-top: 2px; }
.c-sig { position: relative; flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
.c-sig::before { content: ''; position: absolute; left: 14px; right: 14px; top: 50%; height: 2px; margin-top: -1px; background: var(--sunk-lo); }
.c-sig .fill { position: absolute; left: 14px; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, #5f95e6, #b57be8 60%, #f58a35); box-shadow: 0 0 6px rgba(181,123,232,.7); }
.c-dia { position: relative; z-index: 1; width: 30px; height: 30px; display: grid; place-items: center; }
.c-dia::before { content: ''; position: absolute; inset: 4px; transform: rotate(45deg); background: #0c0c15; box-shadow: inset 2px 2px 0 #2a2a42, inset -2px -2px 0 #14141f; }
.c-dia b { position: relative; font: 900 10px 'Cinzel', serif; color: #3a3a55; }
.c-dia.done::before { background: radial-gradient(circle, color-mix(in srgb, var(--c) 45%, #0a0c12), #0a0c12 80%); box-shadow: inset 2px 2px 0 var(--c), inset -2px -2px 0 var(--d), 0 0 10px var(--c); }
.c-dia.done b { color: #fff; text-shadow: 0 0 5px var(--c); }
.c-dia.next::before { box-shadow: inset 2px 2px 0 var(--c), inset -2px -2px 0 var(--d); }
.c-dia.next b { color: var(--c); }
.c-dia.next { animation: glow 2.2s ease-in-out infinite; }
.c-dia.next.ready::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: repeating-conic-gradient(var(--g) 0 10deg, transparent 10deg 36deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); animation: spin 10s linear infinite; z-index: -1; }
.c-strip.ready { box-shadow: inset 3px 3px 0 color-mix(in srgb, var(--c) 60%, var(--panel-hi)), inset -3px -3px 0 var(--d), 0 0 0 0 transparent; }
.c-strip.ready .lbl small { color: var(--c); }
.c-strip.sealed .c-sig { opacity: .45; }
.c-dot { position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; background: #e5484d; clip-path: var(--px2); }
.c-tree { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; overflow: hidden; }
.c-tree::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 30px; width: 4px; margin-left: -2px; background: linear-gradient(transparent, var(--sunk-lo) 20%, var(--sunk-lo) 60%, var(--brass) 60%); }
.c-tree::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 60px; background: linear-gradient(var(--bg), transparent); }
.c-n { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 10px 0; }
.c-n .sk { width: 44px; height: 44px; display: grid; place-items: center; background: var(--code-bg); clip-path: var(--px2); box-shadow: inset 0 0 0 2px var(--card-hi), inset 4px 4px 0 rgba(0,0,0,.45); }
.c-n.has .sk { box-shadow: inset 0 0 0 2px var(--brass), inset 4px 4px 0 rgba(0,0,0,.45); }
.c-n .sk svg { width: 22px; height: 22px; color: var(--phys); }
.c-n .nm { font: 600 13px 'Alegreya', serif; color: var(--text-h); background: var(--bg); padding: 0 4px; }
.c-n .pp { display: flex; gap: 3px; }
.c-n .pp i { width: 7px; height: 7px; border: 1.5px solid rgba(210,187,133,.7); }
.c-n .pp i.l { background: var(--brass); border-color: var(--brass); }
.c-foot { padding: 0 10px 10px; }
.c-pl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.c-pl span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; clip-path: var(--px2); background: linear-gradient(var(--stone-face) 0 7px, var(--quiet) 7px); border-bottom: 3px solid var(--stone-lip); color: var(--spent); font: 700 9px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; }
.c-pl span.on { color: var(--text-h); background: linear-gradient(color-mix(in srgb, var(--phys) 45%, var(--card-hi)) 0 8px, color-mix(in srgb, var(--phys) 22%, var(--card)) 8px); }
.c-pl span b { font: 800 11px 'Alegreya Sans'; letter-spacing: 0; color: var(--brass); }
.c-shade { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.6); }
.c-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--frame); clip-path: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% 100%, 0 100%); box-shadow: inset 3px 3px 0 var(--panel-hi), inset -3px 0 0 var(--panel-lo); padding: 0 14px 16px; }
.c-hero { position: relative; height: 150px; margin: 0 -14px 10px; overflow: hidden; background: #0e0e19 url('../../public/sprites/stage/arena6b.png') center 70% / 432px auto no-repeat; image-rendering: pixelated; border-bottom: 3px solid #0e0e19; }
.c-hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 50% 70% at 50% 85%, var(--g), transparent 70%), linear-gradient(rgba(10,10,20,.55), rgba(10,10,20,.2)); }
.c-hero img { position: absolute; z-index: 2; left: 50%; bottom: 6px; width: 64px; height: 64px; margin-left: -32px; image-rendering: pixelated; }
.c-hero .big { position: absolute; z-index: 2; left: 14px; top: 12px; }
.c-hero .big .plate { width: 60px; height: 60px; font-size: 24px; }
.c-hero .who { position: absolute; z-index: 2; right: 14px; top: 16px; text-align: right; }
.c-hero .who .ttl { font-size: 12px; }
.c-hero .who .spec { font: 900 20px 'Cinzel', serif; letter-spacing: .08em; color: #fff; text-shadow: 0 0 10px var(--c), 0 2px 0 #000; }
.c-hero .embers { z-index: 1; }
.c-list { margin: 0 0 10px; padding: 0; list-style: none; }
.c-list li { display: flex; align-items: center; gap: 10px; padding: 7px 4px; font-size: 15px; }
.c-list li + li { border-top: 1px solid rgba(150,141,126,.16); }
.c-list li svg { width: 16px; height: 16px; }
.c-list li b { color: var(--text-h); }
.c-list li.sp { color: var(--text-h); font: 700 15px 'Alegreya', serif; }
.c-list li.sp svg { color: var(--c); }
.c-ladder { display: flex; justify-content: center; gap: 6px; margin: 2px 0 12px; }
.c-ladder .plate { width: 34px; height: 34px; font-size: 13px; box-shadow: inset 2px 2px 0 var(--c), inset -2px -2px 0 var(--d); clip-path: var(--px2); }
.c-ladder .plate.sealed { box-shadow: inset 2px 2px 0 #2a2a42, inset -2px -2px 0 #14141f; }

/* ---------- D · Rank cards ---------- */
.d-list { position: relative; flex: 1; display: flex; flex-direction: column-reverse; gap: 14px; padding: 6px 12px 12px; overflow: hidden; }
.d-list::before { content: ''; position: absolute; left: 41px; top: 0; bottom: 30px; width: 6px; background: repeating-linear-gradient(#2c2c47 0 6px, #1b1b2c 6px 10px); }
.d-card { position: relative; display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px 9px 8px; clip-path: var(--px3);
  background: #15151f; box-shadow: inset 3px 3px 0 #22223a, inset -3px -3px 0 #0b0b12; }
.d-card .plate { width: 50px; height: 50px; justify-self: center; }
.d-card .lvbar { align-self: center; }
.d-card.sealed .spec { color: var(--spent); }
.d-card.sealed .ttl { color: #4a4a66; }
.d-card.done { background: linear-gradient(100deg, color-mix(in srgb, var(--d) 70%, #15151f), #1b1b2c 70%); box-shadow: inset 3px 3px 0 color-mix(in srgb, var(--c) 70%, #fff), inset -3px -3px 0 var(--d); }
.d-card.done::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.14) 45%, transparent 60%) 0 0 / 250% 100%; animation: shine 4.5s linear infinite; pointer-events: none; }
.d-card.done .chk { color: var(--c); font: 700 10px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; }
.d-card.next { grid-template-columns: 58px 1fr; padding: 12px 12px 12px 8px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, var(--card)), var(--card) 60%); box-shadow: inset 3px 3px 0 var(--c), inset -3px -3px 0 var(--d), 0 0 20px var(--g); }
.d-card.next .plate { align-self: start; }
.d-card.next .body { display: flex; flex-direction: column; gap: 8px; }
.d-card.next .gains { justify-content: flex-start; font-size: 12px; gap: 3px 10px; }
.d-card.next .embers { z-index: 0; }
.d-card .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.d-card.mythic-top { background: linear-gradient(160deg, color-mix(in srgb, #f58a35 35%, #2a1a10), #1b1b2c 75%); }
.d-card.mythic-top .chk { margin-right: 46px; }
.d-skin { position: absolute; right: 8px; bottom: 4px; width: 48px; height: 48px; image-rendering: pixelated; opacity: .25; filter: grayscale(1) brightness(.6); }
.d-card.done .d-skin { opacity: 1; filter: drop-shadow(0 0 6px #f58a35); }
</style>

<body>
<div class="page">
  <h1>Prestige tree</h1>
  <p class="lede">Four ways to put the five prestige ranks in the Talents tab. Each rank: +20% damage, +10% HP, +5% EXP, 50 gems and its special. Pick a state to redraw them all.</p>
  <div class="states" id="states"></div>
  <div id="opts"></div>
</div>

<script>
const IC = {
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
  swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  pulse: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
  gem: '<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>',
  coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
  castle: '<path d="M10 5V3"/><path d="M14 5V3"/><path d="M15 21v-3a3 3 0 0 0-6 0v3"/><path d="M18 3v8"/><path d="M18 5H6"/><path d="M22 11H2"/><path d="M22 9v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9"/><path d="M6 3v8"/>',
  sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
  shirt: '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
  anvil: '<path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>',
  menu: '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
  check: '<path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/>',
  scroll: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const RANKS = [
  { n: 'I', title: 'Veteran', tier: 'rare', bar: 30, spec: 'Free dungeon', icon: 'castle' },
  { n: 'II', title: 'Veteran', tier: 'rare', bar: 40, spec: 'Deeper roots', icon: 'sprout', line: 'Talents +1 max rank' },
  { n: 'III', title: 'Ascendant', tier: 'epic', bar: 50, spec: 'Free dungeon', icon: 'castle' },
  { n: 'IV', title: 'Ascendant', tier: 'epic', bar: 60, spec: 'Deeper roots II', icon: 'sprout', line: 'Talents +1 max rank' },
  { n: 'V', title: 'Mythic', tier: 'relic', bar: 70, spec: 'Mythic skin', icon: 'shirt' },
];
const STATES = [
  { id: 'sealed', label: 'Sealed · L22', p: 0, lvl: 22, gold: 340, gems: 12 },
  { id: 'ready', label: 'Ready · L31', p: 0, lvl: 31, gold: 1210, gems: 18 },
  { id: 'climb', label: 'Climbing · II, L44', p: 2, lvl: 44, gold: 980, gems: 64 },
  { id: 'done', label: 'Mythic · V', p: 5, lvl: 58, gold: 2400, gems: 140 },
];
let S = STATES[1];

const status = (i) => (i < S.p ? 'done' : i === S.p ? (S.lvl >= RANKS[i].bar ? 'next ready' : 'next') : 'sealed');
const isSealed = () => S.p === 0 && S.lvl < RANKS[0].bar;
const nextRank = () => RANKS[S.p];
const ready = () => S.p < 5 && S.lvl >= RANKS[S.p].bar;

const embers = (n = 9) => `<div class="embers">${Array.from({ length: n }, (_, i) => `<i style="left:${8 + ((i * 37) % 86)}%;animation-duration:${4 + (i % 4) * 1.3}s;animation-delay:${(i * 0.7) % 4}s"></i>`).join('')}</div>`;
const gains = () => `<div class="gains"><span>${svg('swords', 'i-phys')}<b>+20%</b> damage</span><span>${svg('heart', 'i-health')}<b>+10%</b> HP</span><span>${svg('sparkles', 'i-exp')}<b>+5%</b> EXP</span><span>${svg('gem', 'i-gem')}<b>50</b></span></div>`;
const plate = (r, st, extra = '') => `<span class="plate ${r.tier} ${st} ${extra}">${st === 'sealed' ? r.n : r.n}</span>`;
const action = () => {
  if (S.p >= 5) return '';
  const r = nextRank();
  if (ready()) return `<div class="pwrap ${r.tier}"><button class="pbtn ${r.tier}">${svg('crown')}Prestige</button></div>`;
  const prevBar = S.p === 0 ? 1 : 1;
  const pct = Math.max(4, Math.min(100, ((S.lvl - prevBar) / (r.bar - prevBar)) * 100));
  return `<div class="prog ${r.tier}"><i style="width:calc(${pct}% - 6px)"></i><span>Level ${S.lvl} / ${r.bar}</span></div>`;
};

function phone(inner, { switcher = '', strip = '' } = {}) {
  return `<div class="phone">
    <div class="ph-top"><h3>${svg('anvil')}Talents</h3>
      <div class="purse"><span class="chip">${svg('coins', 'i-coin')}<b>${S.gold.toLocaleString()}</b></span><span class="chip">${svg('gem', 'i-gem')}<b>${S.gems}</b></span></div>
      <span class="menu">${svg('menu')}</span></div>
    <p class="kept">Permanent upgrades.</p>
    ${switcher}${strip}
    <div class="ph-body">${inner}</div>
    <div class="tabs"><span>${svg('check')}Skills</span><span>${svg('scroll')}Quests</span><span>${svg('store')}Shop</span><span class="on">${svg('anvil')}Talents</span><span>${svg('user')}Hero</span></div>
  </div>`;
}
const sealedNote = () => `<div class="sealed-note"><span class="lockmark">${svg('lock')}</span><span>Reach level ${RANKS[0].bar}</span></div>`;

/* A · Crown plinth: a fourth plinth; picked, the trunk is the ladder */
function optA() {
  const sealed = isSealed();
  const litTo = S.p === 0 ? 0 : S.p; // nodes done
  const nodes = RANKS.map((r, i) => {
    const st = status(i);
    return `<div class="a-node ${r.tier} ${st.split(' ')[0]} ${i === 4 ? 'top' : ''}">
      ${st.includes('ready') ? '<span class="rays"></span>' : ''}
      <div class="lft">${st === 'done' ? `<span class="ttl">${r.title}</span>` : `<span class="lvbar">Lv ${r.bar}</span>`}</div>
      ${plate(r, st.split(' ')[0] === 'next' ? (st.includes('ready') ? 'next ready' : 'next') : st)}
      <div class="rgt"><span class="spec">${svg(r.icon)}${r.spec}</span>${r.line ? `<span class="lvbar">${r.line}</span>` : ''}</div>
    </div>`;
  }).join('');
  // lit trunk height: from the bottom node centre up to the last done node
  const lit = litTo > 1 ? `<span class="lit-line" style="height:${(litTo - 1) * 74}px"></span>` : '';
  const crownTier = S.p >= 5 ? 'relic' : nextRank().tier;
  const body = `<div class="a-tree ${sealed ? 'a-sealed' : ''} ${crownTier}">
      ${ready() ? embers(10) : ''}
      <div class="a-trunk">${lit}${nodes}</div>
      ${sealed ? `<div class="a-veil">${sealedNote()}</div>` : S.p >= 5 ? '' : `<div class="a-each"><span class="lbl">Next rank</span>${gains()}</div><div class="a-act">${action()}</div>`}
    </div>
    <div class="a-foot">
      <svg class="stand" viewBox="0 0 351 16" preserveAspectRatio="none"><path d="M175 0 V7 H307 V16" fill="none" stroke="${sealed ? '#2c2c47' : '#d2bb85'}" stroke-width="4" vector-effect="non-scaling-stroke"/></svg>
      <div class="a-pl">
        <span><em>${svg('swords')}Damage</em><b>14 spent</b></span>
        <span><em>${svg('shield')}Tank</em><b>6 spent</b></span>
        <span><em>${svg('pulse')}Support</em><b>3 spent</b></span>
        <span class="crown ${crownTier} ${sealed ? 'sealed' : ''}"><em>${svg(sealed ? 'lock' : 'crown')}Prestige</em><b>${sealed ? 'Lv 30' : S.p >= 5 ? 'V' : ready() ? 'Ready' : `${S.p} / 5`}</b></span>
      </div>
    </div>`;
  return phone(body);
}

/* B · The spire: a Talents | Prestige switch; a night scene with a five-tier spire */
function switcher(sealed) {
  const t = S.p >= 5 ? 'relic' : nextRank().tier;
  return `<div class="sw"><span>${svg('anvil')}Talents</span><span class="on pr ${t}">${svg(sealed ? 'lock' : 'crown')}Prestige</span></div>`;
}
function optB() {
  const sealed = isSealed();
  const stars = Array.from({ length: 34 }, (_, i) => `<i style="left:${(Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * 100}%;top:${(Math.sin(i * 78.233) * 12345.678 % 1 + 1) % 1 * 64}%;animation-delay:${(i % 7) * .4}s;${i % 5 === 0 ? 'width:3px;height:3px' : ''}"></i>`).join('');
  const tiers = RANKS.map((r, i) => {
    const st = status(i).split(' ')[0];
    const w = 112 - i * 14, h = 50 - i * 2;
    return `<div class="b-tier ${r.tier} ${st}" style="width:${w}px;height:${h}px"><b>${r.n}</b>
      <div class="b-lv"><span class="lvbar">${st === 'done' ? '' : 'Lv ' + r.bar}</span></div>
      <div class="b-tag"><span class="ttl">${r.title}</span><div class="spec">${r.spec}</div></div></div>`;
  }).join('');
  const t = S.p >= 5 ? 'relic' : nextRank().tier;
  const hero = S.p >= 5 ? '../../public/sprites/player/skins/warrior-crimson.png' : '../../public/sprites/player/warrior.png';
  const panel = sealed ? '' : S.p >= 5
    ? `<div class="b-panel relic"><div class="b-mythic"><span class="ttl">Mythic</span><div class="spec">The spire is lit.</div></div>${gains().replace('class="gains"', 'class="gains" style="margin-top:8px"').replace(/\+20%/, '+100%').replace(/\+10%/, '+50%').replace(/\+5%/, '+25%').replace('<b>50</b>', '<b>250</b>')}</div>`
    : `<div class="b-panel ${t}"><div class="b-next">${plate(nextRank(), ready() ? 'next ready' : 'next')}<div><span class="ttl">${nextRank().title} ${nextRank().n}</span><div class="spec">${nextRank().spec}</div></div><span class="lvbar">Lv ${nextRank().bar}</span></div>${gains()}${action()}</div>`;
  const body = `<div class="b-sky ${t} ${sealed ? 'b-dark' : ''}" style="${sealed ? '' : ''}">
      <div class="b-stars">${stars}</div><div class="b-moon"></div>
      ${ready() || S.p >= 5 ? `<div class="b-beam"></div>${embers(12)}` : ''}
      <div class="b-ground"></div>
      <div class="b-spire"><div style="display:flex;flex-direction:column-reverse;align-items:center">${tiers}<div class="b-peak"></div><div class="b-flame ${S.p >= 5 ? '' : 'out'}"></div></div></div>
      <img class="b-hero" src="${hero}" alt="" />
      ${sealed ? `<div class="b-veil">${sealedNote()}</div>` : ''}
    </div>${panel}`;
  return phone(`<div class="${sealed ? 'b-dark' : ''}" style="display:flex;flex-direction:column;flex:1;min-height:0">${body}</div>`, { switcher: switcher(sealed) });
}

/* C · Sigil strip over the tree; tapping it opens a sheet */
function strip() {
  const sealed = isSealed();
  const t = S.p >= 5 ? 'relic' : nextRank().tier;
  const dias = RANKS.map((r, i) => `<span class="c-dia ${r.tier} ${status(i)}"><b>${r.n}</b></span>`).join('');
  const fillW = S.p <= 1 ? 0 : (S.p - 1) * 25;
  const small = sealed ? `${svg('lock', 'lockic')} Lv 30` : S.p >= 5 ? 'Mythic' : ready() ? 'Ready' : `Lv ${S.lvl} / ${nextRank().bar}`;
  return `<div class="c-strip ${t} ${sealed ? 'sealed' : ''} ${ready() ? 'ready' : ''}">${ready() ? '<span class="c-dot"></span>' : ''}
    <span class="lbl">Prestige<small>${small}</small></span>
    <div class="c-sig">${fillW ? `<span class="fill" style="width:calc(${fillW}% - ${fillW ? 7 : 0}px)"></span>` : ''}${dias}</div></div>`;
}
function optC() {
  const tree = `<div class="c-tree">
      <div class="c-n"><span class="sk">${svg('swords')}</span><span class="nm">Might II</span><span class="pp"><i></i><i></i><i></i></span></div>
      <div class="c-n has"><span class="sk">${svg('crown')}</span><span class="nm">Arcana</span><span class="pp"><i class="l"></i><i></i><i></i></span></div>
      <div class="c-n has"><span class="sk">${svg('swords')}</span><span class="nm">Might</span><span class="pp"><i class="l"></i><i class="l"></i><i class="l"></i></span></div>
    </div>
    <div class="c-foot"><div class="c-pl"><span class="on">Damage<b>14 spent</b></span><span>Tank<b>6 spent</b></span><span>Support<b>3 spent</b></span></div></div>`;
  return phone(tree, { strip: strip() });
}
function optCSheet() {
  if (isSealed()) {
    const r = RANKS[0];
    return phone(`<div class="c-tree"></div><div class="c-shade"></div><div class="c-sheet ${r.tier}">
      <div class="c-hero" style="filter:grayscale(.8) brightness(.6)"><div class="big">${plate(r, 'sealed')}</div><div class="who"><span class="ttl" style="color:var(--spent)">Veteran I</span></div></div>
      <div style="text-align:center;padding:6px 0 10px">${sealedNote()}</div>
      <div class="c-ladder">${RANKS.map((x) => plate(x, 'sealed')).join('')}</div></div>`, { strip: strip() });
  }
  const done = S.p >= 5;
  const r = done ? RANKS[4] : nextRank();
  const hero = done ? '../../public/sprites/player/skins/warrior-crimson.png' : '../../public/sprites/player/warrior.png';
  const list = done
    ? `<li>${svg('swords', 'i-phys')}<span><b>+100%</b> damage</span></li><li>${svg('heart', 'i-health')}<span><b>+50%</b> HP</span></li><li>${svg('sparkles', 'i-exp')}<span><b>+25%</b> EXP</span></li><li class="sp">${svg('shirt')}Mythic skin</li>`
    : `<li class="sp">${svg(r.icon)}${r.spec}${r.line ? `<span class="lvbar" style="margin-left:auto">${r.line}</span>` : ''}</li><li>${svg('swords', 'i-phys')}<span><b>+20%</b> damage</span></li><li>${svg('heart', 'i-health')}<span><b>+10%</b> max HP</span></li><li>${svg('sparkles', 'i-exp')}<span><b>+5%</b> EXP</span></li><li>${svg('gem', 'i-gem')}<span><b>50</b> gems</span></li>`;
  return phone(`<div class="c-tree"></div><div class="c-shade"></div><div class="c-sheet ${r.tier}">
    <div class="c-hero ${r.tier}">${ready() || done ? embers(10) : ''}<div class="big">${plate(r, done ? 'done' : ready() ? 'next ready' : 'next')}</div>
      <div class="who"><span class="ttl">${done ? 'Prestige V' : 'Prestige ' + r.n}</span><div class="spec">${r.title}</div></div><img src="${hero}" alt="" /></div>
    <div class="c-ladder">${RANKS.map((x, i) => plate(x, i < S.p ? 'done' : i === S.p ? 'next' : 'sealed')).join('')}</div>
    <ul class="c-list ${r.tier}">${list}</ul>
    ${done ? '' : action()}</div>`, { strip: strip() });
}

/* D · Rank cards: the switch, then five cards climbing up a chain; the next one opens wide */
function optD() {
  const sealed = isSealed();
  const cards = RANKS.map((r, i) => {
    const st = status(i);
    const s0 = st.split(' ')[0];
    const skin = i === 4 ? `<img class="d-skin" src="../../public/sprites/player/skins/warrior-crimson.png" alt="" />` : '';
    if (s0 === 'next' && !sealed) {
      return `<div class="d-card next ${r.tier}">${ready() ? embers(8) : ''}${plate(r, st)}
        <div class="body"><div class="hd"><div><span class="ttl">${r.title} ${r.n}</span><div class="spec">${r.spec}</div></div><span class="lvbar">Lv ${r.bar}</span></div>
        ${r.line ? `<span class="lvbar" style="margin-top:-6px">${r.line}</span>` : ''}${gains()}${action()}</div>${skin}</div>`;
    }
    const sx = sealed ? 'sealed' : s0;
    return `<div class="d-card ${r.tier} ${sx} ${i === 4 && s0 === 'done' ? 'mythic-top' : ''}">${plate(r, sx)}
      <div><span class="ttl">${r.title}</span><div class="spec">${r.spec}</div></div>
      ${sx === 'done' ? `<span class="chk">Earned</span>` : `<span class="lvbar">${svg('lock', 'lockic')} Lv ${r.bar}</span>`}${skin}</div>`;
  }).join('');
  const t = S.p >= 5 ? 'relic' : nextRank().tier;
  const body = `<div class="d-list ${t}">${cards}</div>${sealed ? `<div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center"><div class="sealed-note" style="flex-direction:row;padding:8px 14px;background:var(--frame);clip-path:var(--px2)"><span class="lockmark" style="width:30px;height:30px">${svg('lock')}</span>Reach level 30</div></div>` : ''}`;
  return phone(body, { switcher: switcher(sealed) });
}

const OPTS = [
  { id: 'A', name: 'A · Crown plinth', note: 'A fourth plinth beside Damage, Tank and Support, in the next rank’s colour. Picked, the trunk becomes the ladder: five numeral plates straight up, the bar to the left, the special to the right. The trunk lights blue, then purple, then orange as ranks are earned. The Prestige button sits where the tree meets the plinths.', render: () => [optA()] },
  { id: 'B', name: 'B · The spire', note: 'A Talents | Prestige switch at the top, like the Shop’s. Prestige is its own night scene: a five-tier stone spire that lights tier by tier, the hero at its foot, and a beam and embers when the next rank is ready. The flame at the top only lights at Mythic. The panel below holds the next rank and the button.', render: () => [optB()] },
  { id: 'C', name: 'C · Sigil strip + sheet', note: 'The tree stays the whole tab. A pinned strip under the banner shows the five ranks as diamonds on a line, with a red dot when one is ready. Tapping it opens a sheet with the hero on the arena, the big numeral, the gains and the button. Lightest change to the tab.', render: () => [optC(), optCSheet()], caps: ['Tab', 'Strip tapped'] },
  { id: 'D', name: 'D · Rank cards', note: 'The same switch as B. Five cards climb up a chain from I at the bottom. Earned cards glow in their tier with a slow shine (like enchanted gear); the next one opens wide with its gains and the button or the level bar; later ones are sealed. The Mythic card carries the skin.', render: () => [optD()] },
];

function draw() {
  document.getElementById('states').innerHTML = STATES.map((s) => `<button class="${s === S ? 'on' : ''}" data-s="${s.id}">${s.label}</button>`).join('');
  document.getElementById('opts').innerHTML = OPTS.map((o) => `<section class="opt"><h2>${o.name}</h2><p class="note">${o.note}</p>
    <div class="row">${o.render().map((p, i) => `<figure style="margin:0">${p}${o.caps ? `<figcaption class="cap-under">${o.caps[i]}</figcaption>` : ''}</figure>`).join('')}</div></section>`).join('');
}
document.getElementById('states').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  S = STATES.find((s) => s.id === b.dataset.s);
  draw();
});
draw();
</script>
</body>
</html>
