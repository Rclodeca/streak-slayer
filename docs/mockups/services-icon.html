<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Services icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The Shop tab (replaces Trials) under the pinned shopkeeper backdrop. Pixel-cut Moonlit only. Wares are placeholders
   from docs/ideas/2026-11-10-shop.md: gold buys for this run, gems buy for good. Item art is the native 32x32 at 2 CSS px. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 22px; max-width: 760px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.col p { margin: 0 0 12px; min-height: 108px; font-size: 15px; }

.phone {
  --bg: #07080c; --ink: #f0f3f7; --text: #a9adb6; --dim: #7d8190; --touch: #dbe2ee; --brass: #d2bb85;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --well: #0a0c12; --well-hi: #1a1f2b; --well-lo: #040508;
  --phys: #e86154; --magic: #c870d6; --heal: #4ac777; --true: #f1e9d6; --health: #c33a2e; --crit: #d6a24f; --steel: #a8a092; --arcane: #8d9bd1; --life: #b8433a; --exp: #d8b46a;
  --common: #9d9382; --uncommon: #6cc47f; --rare: #5f95e6; --epic: #b57be8; --relic: #f58a35;
  --gold: #f0c64e; --gem: #6fd6ea; --broke: #b65a50;
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --px3: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  width: 390px; height: 840px; position: relative; background: var(--bg); border: 1px solid #000; border-radius: 34px; overflow: hidden;
  box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text); display: flex; flex-direction: column;
}
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }

/* pinned shop (like HomeBase) */
.home { flex: none; position: relative; z-index: 3; background: #07080c; border-bottom: 3px solid #05060a; box-shadow: 0 10px 18px -8px rgba(0,0,0,.7); padding-top: 14px; }
.crop { position: relative; height: 232px; overflow: hidden; }
.art { position: absolute; top: 0; left: -21px; width: 432px; height: 232px; }
.art > img { position: absolute; inset: 0; width: 432px; height: 232px; image-rendering: pixelated; max-width: none; }
.plate { position: absolute; z-index: 1; background: rgba(7,8,12,.88); clip-path: var(--px2); padding: 5px 10px; box-shadow: inset 2px 2px 0 #333c52, inset -2px -2px 0 #0c0f15; color: var(--ink); }
.plate.title { left: 12px; top: 12px; font: 600 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; }
.purse { position: absolute; z-index: 1; display: flex; gap: 6px; }
.purse .plate { position: static; display: flex; align-items: center; gap: 5px; font: 700 16px/1 'Alegreya', serif; }
.purse .plate .i { font-size: 14px; }
.menu { position: absolute; top: 20px; right: 0; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; background: #2d2c50; color: #d9b96e; clip-path: polygon(3px 0, 100% 0, 100% 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px); }
.menu .i { font-size: 20px; }
.c-gold { color: var(--gold); --c: var(--gold); } .c-gem { color: var(--gem); --c: var(--gem); }

.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 18px; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; }
.scroll::-webkit-scrollbar { display: none; }
.tabbar { flex: none; height: 58px; background: #0a0c12; border-top: 2px solid #05060a; display: flex; justify-content: space-around; align-items: center; font: 600 10px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: #6b7080; }
.tabbar span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tabbar .i { font-size: 18px; }
.tabbar .on { color: var(--touch); }

/* banner (section title, option B cloth) */
.banner { display: flex; align-items: center; height: 38px; flex: none; }
.banner .medal { width: 38px; height: 38px; flex: none; z-index: 1; display: grid; place-items: center; background: var(--card); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); color: var(--brass); font-size: 20px; }
.banner .cloth { margin-left: -4px; flex: 1; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 14px; background: #202a40; color: var(--ink); font: 600 13px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); box-shadow: inset 0 2px 0 var(--hi); }
.banner .cloth em { font: 700 12px 'Alegreya Sans'; letter-spacing: .06em; color: var(--dim); font-style: normal; text-transform: none; }
.banner.gems .cloth { background: #1a3040; }

.panel { background: var(--card); clip-path: var(--px3); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); position: relative; }
.r-common { --rar: var(--common); } .r-uncommon { --rar: var(--uncommon); } .r-rare { --rar: var(--rare); } .r-epic { --rar: var(--epic); } .r-relic { --rar: var(--relic); } .r-none { --rar: #4a5570; }
.rar { font: 700 10px 'Alegreya Sans'; letter-spacing: .1em; text-transform: uppercase; color: var(--rar); }
.name { font: 700 16px/1.15 'Alegreya', serif; color: var(--ink); }
.eff { font-size: 13px; color: #cdbf9a; line-height: 1.25; }
.keep { font: 700 10px 'Alegreya Sans'; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.b { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; }
.b .i { font-size: 13px; color: var(--c); } .b b { color: var(--ink); font-weight: 800; } .b span { color: var(--text); }
.bons { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.c-health { --c: var(--health); } .c-phys { --c: var(--phys); } .c-magic { --c: var(--magic); } .c-true { --c: var(--true); } .c-heal { --c: var(--heal); } .c-crit { --c: var(--crit); } .c-life { --c: var(--life); } .c-exp { --c: var(--exp); }

/* sockets: item art at native 2 CSS px, or an icon for tonics/services */
.sock { position: relative; flex: none; display: grid; place-items: center; overflow: hidden; background: color-mix(in srgb, var(--rar) 14%, var(--well)); box-shadow: inset 2px 2px 0 var(--well-lo), inset -2px -2px 0 color-mix(in srgb, var(--rar) 40%, var(--well-hi)); clip-path: var(--px2); }
.sock img { width: 64px; height: 64px; image-rendering: pixelated; max-width: none; }
.sock.s48 img { width: 48px; height: 48px; }
.sock .i { font-size: 26px; color: var(--c, var(--ink)); }
.sock.on { box-shadow: inset 0 0 0 2px var(--touch), inset 4px 4px 0 var(--well-lo); background: color-mix(in srgb, var(--rar) 28%, var(--well)); }
.sock.sold { opacity: .35; }

/* prices + buy */
.price { display: inline-flex; align-items: center; gap: 4px; font: 700 14px/1 'Alegreya', serif; color: var(--ink); white-space: nowrap; }
.price .i { font-size: 13px; }
.price.no { color: var(--broke); }
.buy { border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; background: #2a3348; color: var(--ink); clip-path: var(--px2);
  box-shadow: inset 2px 2px 0 #4a5672, inset -2px -4px 0 #10141e; font: 600 12px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; }
.buy:active { box-shadow: inset 2px 4px 0 #10141e, inset -2px -2px 0 #4a5672; }
.buy .price { font-size: 15px; letter-spacing: 0; }
.buy.no { background: #1a1d27; color: var(--dim); box-shadow: inset 2px 2px 0 #262b38, inset -2px -2px 0 #0b0d13; cursor: default; }
.climb { display: inline-flex; gap: 2px; vertical-align: middle; }
.climb i { width: 6px; height: 6px; background: #2a3042; display: block; }
.climb i.f { background: var(--brass); }

/* ===== A: the counter ===== */
.on-counter { position: absolute; z-index: 1; left: 84px; top: 88px; width: 64px; height: 64px; display: grid; place-items: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); transition: transform .15s; }
.on-counter img { width: 64px; height: 64px; image-rendering: pixelated; }
.on-counter .i { font-size: 34px; color: var(--c); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c) 60%, transparent)); }
.on-counter::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: -2px; height: 6px; background: radial-gradient(closest-side, color-mix(in srgb, var(--rar) 70%, transparent), transparent); }
.tag { position: absolute; z-index: 1; left: 80px; top: 158px; padding: 4px 9px 4px; background: #e9dcc0; color: #2a2014; clip-path: var(--px2); box-shadow: inset -2px -2px 0 #b9a47e; font: 700 15px/1 'Alegreya', serif; display: flex; align-items: center; gap: 4px; }
.tag::before { content: ''; position: absolute; left: 50%; top: -6px; width: 2px; height: 6px; background: #6b5434; }
.tag .i { font-size: 13px; color: #8a6a1c; } .tag.g .i { color: #2a7f93; }
.say { position: absolute; z-index: 1; right: 44px; top: 62px; max-width: 128px; padding: 6px 9px; background: rgba(240,243,247,.94); color: #141822; clip-path: var(--px2); font: 600 13px/1.2 'Alegreya', serif; }
.say::after { content: ''; position: absolute; left: -6px; bottom: 6px; border: 6px solid transparent; border-left: 0; border-right-color: rgba(240,243,247,.94); }
.a-card { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--rar); }
.a-card .head { display: flex; gap: 10px; align-items: center; }
.a-card .head > div { flex: 1; min-width: 0; }
.a-card .foot { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-top: 2px; }
.a-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ware { border: 0; padding: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.ware .sock { width: 100%; height: 72px; }
.ware .price { font-size: 13px; }

/* ===== B: shopkeeper's word ===== */
.dialog { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: #0f121b; clip-path: var(--px3); box-shadow: inset 2px 2px 0 #2a3246, inset -2px -2px 0 #05060a; }
.dialog .who { font: 600 10px 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); }
.dialog .line { font: 600 16px/1.25 'Alegreya', serif; color: var(--ink); }
.dialog .line::after { content: '▾'; color: var(--dim); font-size: 11px; margin-left: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.feat { padding: 0; overflow: hidden; }
.feat .velvet { position: relative; height: 120px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, color-mix(in srgb, var(--rar) 34%, #12162a) 0%, #0b0e18 70%); }
.feat .velvet img { width: 96px; height: 96px; image-rendering: pixelated; position: relative; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.feat .velvet::after { content: ''; position: absolute; left: 50%; bottom: 14px; width: 70px; height: 8px; margin-left: -35px; background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); }
.feat .ribbon { position: absolute; left: 10px; top: 10px; padding: 3px 8px; background: var(--rar); color: #0b0e18; font: 700 10px 'Alegreya Sans'; letter-spacing: .12em; text-transform: uppercase; clip-path: var(--px2); }
.feat .dots { position: absolute; right: 12px; top: 13px; display: flex; gap: 4px; }
.feat .dots i { width: 6px; height: 6px; background: #3a4256; } .feat .dots i.on { background: var(--touch); }
.feat .arrowl, .feat .arrowr { position: absolute; top: 38px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--dim); font-size: 22px; cursor: pointer; border: 0; background: none; }
.feat .arrowl { left: 0; } .feat .arrowr { right: 0; }
.feat .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; border-top: 2px solid var(--rar); }
.feat .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 7px; }
.row .sock { width: 52px; height: 52px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid .eff { font-size: 12.5px; }
.row .buy { min-width: 76px; padding: 0 10px; }
.row .buy .price { font-size: 15px; }

/* ===== C: two purses ===== */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--well); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--well-lo), inset -2px -2px 0 var(--well-hi); padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 7px 0 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; clip-path: var(--px2); min-height: 44px; }
.seg button .t { font: 600 11px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; }
.seg button .v { display: flex; align-items: center; gap: 5px; font: 700 18px/1 'Alegreya', serif; color: var(--ink); }
.seg button .v .i { font-size: 15px; }
.seg button.on { background: #202a40; color: var(--ink); box-shadow: inset 0 2px 0 var(--hi); }
.seg button.on.gem { background: #1a3040; }
.seg button:not(.on) .v { color: var(--dim); }
.c-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.c-card { border: 0; cursor: pointer; padding: 8px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.c-card::before { content: ''; position: absolute; left: 3px; right: 3px; top: 0; height: 2px; background: var(--rar); }
.c-card .sock { width: 76px; height: 72px; }
.c-card .name { font-size: 13.5px; line-height: 1.1; min-height: 30px; display: flex; align-items: center; }
.c-card .pp { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 5px 8px; background: var(--well); clip-path: var(--px2); box-shadow: inset 2px 2px 0 var(--well-lo), inset -2px -2px 0 var(--well-hi); width: 100%; }
.c-note { font-size: 12.5px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.c-note .i { font-size: 13px; }
.cd { font: 700 11px 'Alegreya Sans'; letter-spacing: .06em; color: var(--dim); display: inline-flex; gap: 4px; align-items: center; }
.slots8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 4px 0 2px; }
.slots8 i { height: 22px; background: color-mix(in srgb, var(--gem) 30%, var(--well)); clip-path: var(--px2); display: block; box-shadow: inset 2px 2px 0 color-mix(in srgb, var(--gem) 50%, var(--well-hi)); }
.slots8 i.next { background: var(--well); box-shadow: inset 0 0 0 2px var(--gem); animation: blink 1.6s steps(2) infinite; }
.slots8 i.lock { background: #080a10; box-shadow: inset 2px 2px 0 var(--well-lo), inset -2px -2px 0 var(--well-hi); }
.swatches { display: flex; gap: 6px; margin-top: 2px; }
.swatches i { width: 26px; height: 26px; display: block; clip-path: var(--px2); box-shadow: inset 2px 2px 0 rgba(255,255,255,.18), inset -2px -2px 0 rgba(0,0,0,.35); }
.big-card { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.big-card .head { display: flex; gap: 10px; align-items: center; }
.big-card .head > div { flex: 1; min-width: 0; }

/* ===== D: shelves ===== */
.cab { --wood: #2c2018; --wood-hi: #4a3626; --wood-lo: #140e09; position: relative; padding: 10px 10px 4px; background: linear-gradient(#1d150f, #241a13); clip-path: var(--px3); box-shadow: inset 3px 3px 0 var(--wood-hi), inset -3px -3px 0 var(--wood-lo); }
.cab.vault { --wood: #1d2735; --wood-hi: #3a4a62; --wood-lo: #080b11; background: linear-gradient(#111826, #182132); }
.cab.vault::after { content: ''; position: absolute; inset: 6px; background: linear-gradient(115deg, transparent 30%, rgba(160,220,255,.07) 38%, transparent 44%, transparent 62%, rgba(160,220,255,.05) 68%, transparent 72%); pointer-events: none; }
.cab .lbl { display: flex; justify-content: center; margin: -2px 0 8px; }
.cab .lbl span { padding: 3px 12px 4px; background: #3a2c1c; color: #e2c98d; font: 600 11px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; clip-path: var(--px2); box-shadow: inset 2px 2px 0 #6a5332, inset -2px -2px 0 #1b130b; display: flex; gap: 6px; align-items: center; }
.cab.vault .lbl span { background: #22324a; color: #bfe4f0; box-shadow: inset 2px 2px 0 #3e5676, inset -2px -2px 0 #0a1018; }
.shelf { display: grid; grid-template-columns: repeat(4, 1fr); align-items: end; gap: 4px; padding: 0 4px; min-height: 76px; }
.board { height: 8px; margin: 0 -10px 22px; background: var(--wood); box-shadow: inset 0 2px 0 var(--wood-hi), inset 0 -3px 0 var(--wood-lo), 0 4px 6px rgba(0,0,0,.5); position: relative; }
.on-shelf { position: relative; border: 0; padding: 0; background: none; cursor: pointer; height: 74px; display: grid; place-items: end center; }
.on-shelf img { width: 64px; height: 64px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.on-shelf .jar { width: 46px; height: 52px; margin-bottom: 2px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, #0b0e15); clip-path: polygon(8px 0, calc(100% - 8px) 0, calc(100% - 8px) 6px, 100% 12px, 100% 100%, 0 100%, 0 12px, 8px 6px); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--c) 45%, transparent), inset -2px -2px 0 rgba(0,0,0,.4); }
.on-shelf .jar .i { font-size: 22px; color: var(--c); }
.on-shelf .ptag { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); padding: 3px 6px; background: #e9dcc0; color: #2a2014; clip-path: var(--px2); box-shadow: inset -2px -2px 0 #b9a47e; font: 700 12px/1 'Alegreya', serif; display: flex; align-items: center; gap: 3px; white-space: nowrap; z-index: 1; }
.on-shelf .ptag .i { font-size: 11px; color: #8a6a1c; }
.cab.vault .ptag { background: #cfe7ee; box-shadow: inset -2px -2px 0 #8db3bf; } .cab.vault .ptag .i { color: #2a7f93; }
.on-shelf .ptag.no { color: #8a3328; }
.on-shelf.sel::before { content: ''; position: absolute; left: 50%; bottom: 0; width: 64px; height: 64px; margin-left: -32px; background: radial-gradient(closest-side, color-mix(in srgb, var(--rar, var(--c)) 45%, transparent), transparent); }
.on-shelf:not(.sel) img, .on-shelf:not(.sel) .jar { transition: transform .12s; }
.on-shelf:hover img { transform: translateY(-2px); }
.scrim { position: absolute; inset: 0; z-index: 5; background: rgba(3,4,8,.55); display: none; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; transform: translateY(105%); transition: transform .22s ease-out; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); }
.sheet .panel { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--rar); }
.sheet .grab { width: 40px; height: 4px; background: #3a4256; margin: 0 auto 2px; }
.sheet .head { display: flex; gap: 12px; align-items: center; }
.sheet .head > div { flex: 1; }
.sheet .name { font-size: 19px; }
.sheet .acts { display: flex; gap: 8px; margin-top: 4px; }
.sheet .acts .buy { flex: 1; }
.sheet .acts .buy.ghost { flex: none; background: transparent; box-shadow: inset 0 0 0 2px #333c52; color: var(--text); }
.phone.open .scrim { display: block; } .phone.open .sheet { transform: none; }
/* ---- round two: dialogue on the scene, Shop | Vault tabs ---- */
.cold::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(40,90,140,.38), rgba(20,50,90,.5)); mix-blend-mode: color; pointer-events: none; transition: opacity .25s; }
.art .tint { position: absolute; inset: 0; pointer-events: none; transition: opacity .3s; opacity: 0; background: linear-gradient(rgba(30,70,120,.45), rgba(10,30,60,.55)); mix-blend-mode: color; }
.art > img { transition: filter .3s; } .vaulted .art:has(.tint.dark) > img { filter: brightness(.55) saturate(.75); }
.scroll > * { flex-shrink: 0; }

  background: #121624; color: var(--dim); clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% 100%, 0 100%, 0 3px, 3px 3px); box-shadow: inset 2px 2px 0 #20263a; }

/* tabs: 4 two pennants hung from a rod */
.rod { flex: none; position: relative; height: 66px; margin: -2px -4px 0; }
