<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut level up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* The level-up popup (EventChoiceModal.vue, "choose" step) in Pixel-cut
   (Moonlit). Same order as now: level emblem, stat gains, "Choose 1 event",
   three event cards. Tap a card to press it; tap again to lift it. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 560px; }
.wrap { display: flex; justify-content: center; }
button { font: inherit; }

.phone {
  --bg: #07080c; --frame: #141720; --well: #0d1017; --ink: #f0f3f7; --text: #a9adb6; --dim: #6a6f7a; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --good: #7fc17a;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --sunk: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b;
  --lifted: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo);
  position: relative; width: 390px; min-height: 760px; padding: 64px 10px 28px; background: radial-gradient(70% 30% at 50% 6%, #1c2230, transparent 70%), var(--bg);
  border: 1px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.phone::before { content: ''; position: absolute; inset: 0; background: rgba(3,4,6,.6); pointer-events: none; }
.phone > * { position: relative; }
svg.i { width: 14px; height: 14px; flex: none; }

/* Popup chrome, as in pixel-forms.html. Not dismissible, so no close key. */
.modal { clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); padding: 0 12px 14px; }
.mhead { display: flex; align-items: center; justify-content: center; min-height: 52px; }
.mhead h3 { margin: 0; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }

/* Emblem: a brass plate (brass = earned) with the new level cut into it */
.emblem { position: relative; width: 92px; height: 92px; margin: 2px auto 14px; display: grid; place-items: center; animation: pop .5s cubic-bezier(.2,.8,.3,1); }
.emblem::before, .emblem::after { content: ''; position: absolute; clip-path: var(--px); }
.emblem::before { inset: 0; background: linear-gradient(#e6d3a1, #a58f58); }
.emblem::after { inset: 4px; background: #11141c; box-shadow: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b; }
.emblem .up { position: absolute; z-index: 1; top: 12px; color: var(--brass); }
.emblem .up svg { width: 16px; height: 16px; display: block; }
.emblem b { position: relative; z-index: 1; margin-top: 12px; font: 700 34px/1 'Cinzel', serif; color: var(--brass); text-shadow: 0 2px 0 #05070a; }
.emblem .lv { position: absolute; z-index: 1; bottom: 11px; font: 600 8px 'Cinzel', serif; letter-spacing: .28em; color: #8d7a4a; padding-left: .28em; }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } }
@media (prefers-reduced-motion: reduce) { .emblem { animation: none; } }

/* What the level gave: one sunk well, icon + number per stat */
.gains { clip-path: var(--px); background: var(--well); box-shadow: var(--sunk); display: flex; justify-content: center; gap: 6px 20px; padding: 11px 12px; margin: 0 0 16px; }
.gains span { display: inline-flex; align-items: center; gap: 6px; font: 800 15px 'Alegreya Sans', sans-serif; color: var(--ink); }
.gains svg { width: 16px; height: 16px; }

.sub { margin: 0 2px 10px; text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.sub em { font-style: normal; color: var(--brass); }

/* Event cards: the raised cards from the main screen, a 3px lip that
   presses flat on tap. Icon sits in a small sunk socket. */
.cards { display: grid; gap: 9px; }
.ev { --lp: 3px; position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: calc(68px + var(--lp)); padding: 8px 12px calc(8px + var(--lp)) 10px; text-align: left; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ev::before, .ev::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px); }
.ev::before { top: var(--lp); bottom: 0; background: var(--lip); }
.ev::after { top: 0; bottom: var(--lp); background: var(--card); box-shadow: var(--lifted); transition: top .07s, bottom .07s; }
.ev > * { position: relative; z-index: 1; transition: transform .07s; }
.ev:active::after, .ev.down::after { top: var(--lp); bottom: 0; }
.ev:active > *, .ev.down > * { transform: translateY(var(--lp)); }
.ev.down::after { background: #151a27; }
.sock { flex: none; width: 46px; height: 46px; display: grid; place-items: center; clip-path: var(--px2); background: #07090d; box-shadow: inset 0 0 0 2px #2a3140, inset 4px 4px 0 #020305; }
.sock svg { width: 22px; height: 22px; }
.tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ti { font: 600 17.5px 'Alegreya', Georgia, serif; color: var(--ink); }
.de { font: 500 13.5px/1.3 'Alegreya Sans', sans-serif; color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · level up</h1>
  <p class="lede">The level-up popup. Brass emblem for the new level, a sunk well for what it gave, then the three events as raised cards. Tap one to press it.</p>
  <div class="wrap"><div class="phone" id="phone"></div></div>
</div>
<script>
const LU = {"chevronsUp":"<path d=\"m17 11-5-5-5 5\"/><path d=\"m17 18-5-5-5 5\"/>","health":"<path d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\"/>","physical":"<path d=\"m11 19-6-6\"/><path d=\"m5 21-2-2\"/><path d=\"m8 16-4 4\"/><path d=\"M9.5 17.5 21 6V3h-3L6.5 14.5\"/>","magic":"<path d=\"m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72\"/><path d=\"m14 7 3 3\"/><path d=\"M5 6v4\"/><path d=\"M19 14v4\"/><path d=\"M10 2v2\"/><path d=\"M7 8H3\"/><path d=\"M21 16h-4\"/><path d=\"M11 3H9\"/>","true":"<path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/>","healing":"<path d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\"/><path d=\"M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27\"/>","quest":"<path d=\"M15 12h-5\"/><path d=\"M15 8h-5\"/><path d=\"M19 17V5a2 2 0 0 0-2-2H4\"/><path d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\"/>","special":"<path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\"/>","ult":"<path d=\"M10.5 3 8 9l4 13 4-13-2.5-6\"/><path d=\"M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z\"/><path d=\"M2 9h20\"/>","streak":"<path d=\"M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4\"/>","slots":"<path d=\"M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"/><path d=\"M8 10h8\"/><path d=\"M8 18h8\"/><path d=\"M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6\"/><path d=\"M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2\"/>","reroll":"<rect width=\"12\" height=\"12\" x=\"2\" y=\"10\" rx=\"2\" ry=\"2\"/><path d=\"m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6\"/><path d=\"M6 18h.01\"/><path d=\"M10 14h.01\"/><path d=\"M15 6h.01\"/><path d=\"M18 9h.01\"/>","gift":"<path d=\"M12 7v14\"/><path d=\"M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8\"/><path d=\"M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5\"/><rect x=\"3\" y=\"7\" width=\"18\" height=\"4\" rx=\"1\"/>","healBoost":"<path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"/><path d=\"M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12\"/>","itemDoubled":"<path d=\"m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9\"/><path d=\"m18 15 4-4\"/><path d=\"m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5\"/>","critBoost":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>","x":"<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>"};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LU[n]}</svg>`;
// Icon colours are the app's --icon-* / --dmg-* values.
const COL = { health: '#f43f5e', physical: '#f87171', magic: '#b98cfb', healing: '#22c55e', special: '#fbbf24', quest: '#94a3b8', ult: '#c084fc', gift: '#f5c451' };
const ic = (n) => `<span style="color:${COL[n]};display:inline-flex">${icon(n)}</span>`;

const GAINS = [['health', '+412'], ['physical', '+38'], ['healing', '+21']];
const EVENTS = [
  ['special', 'Gain a Special', 'A random daily skill permanently deals ×1.5 damage.'],
  ['healing', 'Restore health', 'Heal 10% of your max health.'],
  ['quest', 'Side quest', 'Earn a rare and powerful item.'],
];

document.getElementById('phone').innerHTML = `<div class="modal">
  <div class="mhead"><h3>Level up!</h3></div>
  <div class="emblem"><span class="up" aria-hidden="true">${icon('chevronsUp')}</span><b>12</b><span class="lv">LEVEL</span></div>
  <div class="gains">${GAINS.map(([k, v]) => `<span>${ic(k)}${v}</span>`).join('')}</div>
  <p class="sub">Choose 1 event · <em>2 picks waiting</em></p>
  <div class="cards">${EVENTS.map(([k, t, d]) => `<button class="ev" type="button"><span class="sock">${ic(k)}</span><span class="tx"><strong class="ti">${t}</strong><span class="de">${d}</span></span></button>`).join('')}</div>
</div>`;
document.querySelectorAll('.ev').forEach((b) => b.addEventListener('click', () => b.classList.toggle('down')));
</script>
</body>
</html>
