<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Plate columns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya:wght@500&display=swap" />
<style>
/* Real app screenshots (iPhone width, 2x), cropped to the skill rows. Each column is a CSS layer from plate-columns/
   Ashen as it is now. */
:root { --text: #b0a796; --text-h: #ece3cd; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--text-h); background: #070606; font: 500 16px/1.4 'Alegreya', Georgia, serif; }
.page { max-width: 1760px; margin: 0 auto; padding: 30px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; margin: 0 0 6px; }
.lede { text-align: center; color: var(--text); margin: 0 0 24px; }
h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(150,141,126,.3), transparent); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.col { width: 330px; max-width: 100%; }
.key b { display: block; font: 600 11px 'Cinzel', serif; letter-spacing: .18em; color: var(--text-h); margin-bottom: 4px; }
.key { color: var(--text); font-size: 15px; min-height: 90px; }
.col img { width: 100%; display: block; border: 1px solid rgba(150,141,126,.18); border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <h1>Plate columns</h1>
  <p class="lede">The numeral plate is back. Lining up streak, rank and damage, with one streak size (it still gets bolder and brighter). Ranks II, III, IV, I and VIII.</p>
  <div id="cols"></div>
</div>
<script>
const COLS = [
  ['now', 'Now', 'Plates hug their numeral; the streak grows with its count, so nothing holds a place.'],
  ['a', 'A · Three columns', 'Streak, plate, damage, each in a fixed slot. Every plate the same width.'],
  ['b', 'B · Rank first', 'Plate, streak, damage: the plates make their own column ahead of the numbers.'],
  ['c', 'C · Rank by the name', 'The plate follows the skill\u2019s name, like a title. Streak and damage are the only columns on the right.'],
  ['d', 'D · Rank on the left', 'The plate sits between the check and the name. Names, streaks and damage each start in line.'],
];
const el = document.getElementById('cols');
el.insertAdjacentHTML('beforeend', `<div class="row">${COLS.map(([, t, d]) => `<div class="col key"><b>${t}</b>${d}</div>`).join('')}</div>`);
el.insertAdjacentHTML('beforeend', `<h2>Skill rows</h2><div class="row">${COLS.map(([v]) => `<div class="col"><img src="plate-columns/rows-${v}.png" alt=""></div>`).join('')}</div>`);
</script>
</body>
</html>
