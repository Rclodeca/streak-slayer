<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Pixel-cut challenge card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* Side quests become challenges. Three things to pick: the level-up card, the button that opens
   the challenges, and the challenges popup. Pixel-cut (Moonlit), real Lucide icons. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 22px; max-width: 680px; }
.band { text-align: center; font: 600 12px 'Cinzel', serif; letter-spacing: .3em; color: #ece8de; margin: 42px 0 8px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); text-transform: uppercase; }
.bandnote { text-align: center; margin: 0 auto 20px; max-width: 640px; font-size: 15px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; align-items: flex-start; }
.col { width: 390px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; text-transform: uppercase; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; text-transform: uppercase; }
.col > p { margin: 0 0 12px; min-height: 84px; font-size: 15px; }
button { font: inherit; }
ul { list-style: none; margin: 0; padding: 0; }

.phone {
  --bg: #07080c; --frame: #141720; --well: #0d1017; --ink: #f0f3f7; --text: #a9adb6; --dim: #6a6f7a; --touch: #dbe2ee;
  --brass: #d2bb85; --exp: #d9a93c; --gift: #c8a96e; --good: #7fc17a;
  --card: #1b2030; --hi: #333c52; --lo: #0c0f15; --lip: #05060a;
  --done: #3c4352; --s-card: #0e1117; --s-hi: #161a24; --s-lo: #07090d; --s-name: #5b606b;
  --px: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
  --px2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --sunk: inset 2px 2px 0 #05070a, inset -2px -2px 0 #1a1f2b;
  --lifted: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo);
  position: relative; width: 390px; background: radial-gradient(70% 22% at 72% 4%, #1c2230, transparent 70%), var(--bg);
  border: 1px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
svg.i { width: 14px; height: 14px; flex: none; }

/* ---------- Popup chrome (as in pixel-forms / pixel-levelup) ---------- */
.mphone { min-height: 700px; padding: 54px 10px 28px; }
.mphone::before { content: ''; position: absolute; inset: 0; background: rgba(3,4,6,.6); pointer-events: none; z-index: 0; }
.mphone > * { position: relative; z-index: 1; }
.modal { clip-path: var(--px); background: var(--frame); box-shadow: inset 2px 2px 0 #2a3142, inset -2px -2px 0 #0a0c11; border-bottom: 3px solid var(--lip); padding: 0 12px 16px; }
.mhead { display: flex; align-items: center; min-height: 52px; }
.mhead h3 { margin: 0; flex: 1; font: 600 13px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); }
.mhead .ct { margin-right: 10px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--text); }
.close { width: 40px; height: 40px; margin-right: -4px; display: grid; place-items: center; clip-path: var(--px2); background: rgba(219,226,238,.06); border: 1px solid rgba(219,226,238,.25); color: var(--touch); }
.close svg { width: 16px; height: 16px; }
.lbl { display: block; margin: 0 0 7px; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }

/* ================= 1 · Level-up cards ================= */
.lphone { min-height: 0; padding: 54px 10px 28px; }
.sub { margin: 4px 2px 10px; text-align: center; font: 600 10px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--text); }
.cards { display: grid; gap: 9px; }
.ev { --lp: 3px; position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: calc(72px + var(--lp)); padding: 8px 12px calc(8px + var(--lp)) 10px; text-align: left; border: 0; background: none; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
.ev::before, .ev::after { content: ''; position: absolute; left: 0; right: 0; clip-path: var(--px); }
.ev::before { top: var(--lp); bottom: 0; background: var(--lip); }
.ev::after { top: 0; bottom: var(--lp); background: var(--card); box-shadow: var(--lifted); transition: top .07s, bottom .07s; }
.ev > * { position: relative; z-index: 1; transition: transform .07s; }
.ev:active::after, .ev.down::after { top: var(--lp); bottom: 0; }
.ev:active > *, .ev.down > * { transform: translateY(var(--lp)); }
.ev.down::after { background: #151a27; }
.sock { flex: none; width: 46px; height: 46px; display: grid; place-items: center; clip-path: var(--px2); background: #07090d; box-shadow: inset 0 0 0 2px #2a3140, inset 4px 4px 0 #020305; }
.sock svg { width: 22px; height: 22px; }
.tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.cap { font: 600 9.5px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); }
.ti { font: 600 17.5px 'Alegreya', Georgia, serif; color: var(--ink); }
.de { font: 500 13.5px/1.3 'Alegreya Sans', sans-serif; color: var(--text); }
/* A · Caption: the card is the usual card; a brass caption above the title says it's a side quest */
/* B · Rim: brass rim round the card, a brass-ringed socket, and a gift with a question mark at the right edge */
.o-b .ev.side::after { box-shadow: var(--lifted), inset 0 0 0 3px #7c6a3f; }
.o-b .ev.side .sock { box-shadow: inset 0 0 0 2px #7c6a3f, inset 4px 4px 0 #020305; }
.o-b .ev.side .gf { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--gift); font: 700 16px 'Alegreya', serif; }
.o-b .ev.side .gf svg { width: 20px; height: 20px; }


/* Shared by the options below */
.o .ev.side::after { box-shadow: var(--lifted), inset 0 0 0 3px #7c6a3f; }
.o .ev.side .sock { box-shadow: inset 0 0 0 2px #7c6a3f, inset 4px 4px 0 #020305; color: var(--brass); }
.gf { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--gift); font: 700 16px 'Alegreya', serif; }
.gf svg { width: 20px; height: 20px; }
.ev.side .de b { color: var(--ink); font-weight: 700; }
.mk { display: inline-flex; align-items: center; gap: 5px; }
.mk svg { width: 11px; height: 11px; }
/* A · Do: caption + a "Goal" lead-in on the deed */
.o-a .cap { display: inline-flex; align-items: center; gap: 6px; }
.o-a .cap svg { width: 11px; height: 11px; }
.o-a .de .lead { color: var(--brass); font-weight: 800; letter-spacing: .02em; }
/* B · Goal strip: sunk well inside the card holding the deed, with a target icon */
.o-b .tx { gap: 6px; }
.o-b .goal { display: flex; align-items: center; gap: 8px; padding: 6px 8px; clip-path: var(--px2); background: var(--well); box-shadow: var(--sunk); font: 600 13.5px/1.25 'Alegreya Sans', sans-serif; color: var(--text); }
.o-b .goal svg { width: 14px; height: 14px; color: var(--brass); flex: none; }
/* C · Track: an empty progress bar that ends in the prize, so it reads as unfinished work */
.o-c .tx { gap: 6px; }
.o-c .trk { display: flex; align-items: center; gap: 8px; }
.o-c .trk .bar { position: relative; flex: 1; height: 12px; clip-path: var(--px2); background: #090b10; box-shadow: var(--sunk); }
.o-c .trk .bar span { position: absolute; right: 5px; top: 0; bottom: 0; display: flex; align-items: center; font: 800 10.5px/1 'Alegreya Sans', sans-serif; color: var(--dim); }
.o-c .trk .gf { font-size: 15px; } .o-c .trk .gf svg { width: 17px; height: 17px; }
/* D · Banner: brass tab across the top edge with a flag and "Challenge", prize named in words */
.o-d .ev.side { padding-top: 30px; min-height: calc(98px + var(--lp)); }
.o-d .ev.side .tab { position: absolute; z-index: 2; left: 14px; top: 6px; display: inline-flex; align-items: center; gap: 6px; font: 700 9.5px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); }
.o-d .ev.side .tab svg { width: 12px; height: 12px; }
.o-d .ev.side .tab::after { content: ''; width: 90px; height: 1px; background: rgba(210,187,133,.35); }
.o-d .ev.side .win { font: 700 12.5px 'Alegreya Sans', sans-serif; color: var(--gift); display: inline-flex; align-items: center; gap: 5px; }
.o-d .ev.side .win svg { width: 14px; height: 14px; }
.cur .tag { color: var(--dim); }
</style>
</head>
<body>
<div class="page">
  <h1>Pixel-cut · challenge card</h1>
  <p class="lede">The level-up side-quest card, so it reads as a challenge you must complete, not a perk you get on tap. Shown with "Rank up". Each option is the same third card; the other two are unchanged. Tap a card to see it press.</p>
  <div class="grid" id="g"></div>
</div>
<script>
const LU = {"menu":"<path d=\"M4 5h16\"/><path d=\"M4 12h16\"/><path d=\"M4 19h16\"/>","scroll-text":"<path d=\"M15 12h-5\"/><path d=\"M15 8h-5\"/><path d=\"M19 17V5a2 2 0 0 0-2-2H4\"/><path d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\"/>","trophy":"<path d=\"M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978\"/><path d=\"M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978\"/><path d=\"M18 9h1.5a1 1 0 0 0 0-5H18\"/><path d=\"M4 22h16\"/><path d=\"M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z\"/><path d=\"M6 9H4.5a1 1 0 0 1 0-5H6\"/>","flag":"<path d=\"M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528\"/>","swords":"<polyline points=\"14.5 17.5 3 6 3 3 6 3 17.5 14.5\"/><line x1=\"13\" x2=\"19\" y1=\"19\" y2=\"13\"/><line x1=\"16\" x2=\"20\" y1=\"16\" y2=\"20\"/><line x1=\"19\" x2=\"21\" y1=\"21\" y2=\"19\"/><polyline points=\"14.5 6.5 18 3 21 3 21 6 17.5 9.5\"/><line x1=\"5\" x2=\"9\" y1=\"14\" y2=\"18\"/><line x1=\"7\" x2=\"4\" y1=\"17\" y2=\"20\"/><line x1=\"3\" x2=\"5\" y1=\"19\" y2=\"21\"/>","zap":"<path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/>","target":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>","flame":"<path d=\"M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4\"/>","calendar-check":"<path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"m9 16 2 2 4-4\"/>","chevrons-up":"<path d=\"m17 11-5-5-5 5\"/><path d=\"m17 18-5-5-5 5\"/>","gem":"<path d=\"M10.5 3 8 9l4 13 4-13-2.5-6\"/><path d=\"M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z\"/><path d=\"M2 9h20\"/>","hammer":"<path d=\"m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9\"/><path d=\"m18 15 4-4\"/><path d=\"m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5\"/>","plus":"<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>","gift":"<path d=\"M12 7v14\"/><path d=\"M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8\"/><path d=\"M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5\"/><rect x=\"3\" y=\"7\" width=\"18\" height=\"4\" rx=\"1\"/>","x":"<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","shield-check":"<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/><path d=\"m9 12 2 2 4-4\"/>","sunrise":"<path d=\"M12 2v8\"/><path d=\"m4.93 10.93 1.41 1.41\"/><path d=\"M2 18h2\"/><path d=\"M20 18h2\"/><path d=\"m19.07 10.93-1.41 1.41\"/><path d=\"M22 22H2\"/><path d=\"m8 6 4-4 4 4\"/><path d=\"M16 18a4 4 0 0 0-8 0\"/>","star":"<path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\"/>","crown":"<path d=\"M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z\"/><path d=\"M5 21h14\"/>","eye-off":"<path d=\"M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49\"/><path d=\"M14.084 14.158a3 3 0 0 1-4.242-4.242\"/><path d=\"M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143\"/><path d=\"m2 2 20 20\"/>"};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LU[n]}</svg>`;
const OTHER = [
  ['<span style="color:#fbbf24;display:inline-flex">' + icon('star') + '</span>', 'Gain a Special', 'A random daily skill permanently deals ×1.5 damage.'],
  ['<span style="color:#22c55e;display:inline-flex">' + icon('shield-check') + '</span>', 'Restore health', 'Heal 10% of your max health.'],
];
const evCard = ([ic, t, d]) => `<button class="ev" type="button"><span class="sock">${ic}</span><span class="tx"><strong class="ti">${t}</strong><span class="de">${d}</span></span></button>`;
const sk = (c = 'var(--brass)') => `<span class="sock"><span style="color:${c};display:inline-flex">${icon('chevrons-up')}</span></span>`;
const gift = `<span class="gf">${icon('gift')}?</span>`;
const S = {
  cur: `<button class="ev side" type="button">${sk('var(--brass)')}<span class="tx"><span class="cap">Side quest</span><strong class="ti">Rank up</strong><span class="de">Raise a skill's rank.</span></span>${gift}</button>`,
  a: `<button class="ev side" type="button">${sk()}<span class="tx"><span class="cap">${icon('flag')}Side quest · Challenge</span><strong class="ti">Rank up</strong><span class="de"><span class="lead">Goal:</span> raise a skill's rank.</span></span>${gift}</button>`,
  b: `<button class="ev side" type="button">${sk()}<span class="tx"><span class="cap">Challenge</span><strong class="ti">Rank up</strong><span class="goal">${icon('target')}Raise a skill's rank.</span></span>${gift}</button>`,
  c: `<button class="ev side" type="button">${sk()}<span class="tx"><span class="cap">Challenge</span><strong class="ti">Rank up</strong><span class="de">Raise a skill's rank.</span><span class="trk"><span class="bar"><span>0 / 1</span></span>${gift}</span></span></button>`,
  d: `<button class="ev side" type="button"><span class="tab">${icon('flag')}Challenge</span>${sk()}<span class="tx"><strong class="ti">Rank up</strong><span class="de">Raise a skill's rank to earn:</span><span class="win">${icon('gift')}A hidden relic</span></span></button>`,
};
const phone = (s) => `<div class="phone lphone"><div class="modal"><div class="mhead"><h3 style="text-align:center;color:var(--ink)">Level up!</h3></div>
  <p class="sub">Choose 1 event</p><div class="cards">${evCard(OTHER[0])}${evCard(OTHER[1])}${s}</div></div></div>`;
document.getElementById('g').innerHTML = [
  { k: 'cur', tag: 'Now', n: 'As built', d: 'The caption says "Side quest", but the line under the name is just the deed, so it reads like the thing you get. This is the problem.' },
  { k: 'a', tag: 'Option A', n: 'Challenge caption', d: 'The smallest fix. A flag and "Challenge" in the caption, and the deed starts with a brass "Goal:" so it reads as something to do.' },
  { k: 'b', tag: 'Option B', n: 'Goal strip', d: 'The deed moves into its own sunk strip with a target icon, set apart from the name, like an objective line. Caption becomes just "Challenge".' },
  { k: 'c', tag: 'Option C', n: 'Empty track', d: 'An empty 0 / 1 progress bar runs from the deed to the gift. Unfinished work with a prize at the end: the clearest that you have to complete it.' },
  { k: 'd', tag: 'Option D', n: 'Banner', d: 'A brass "Challenge" tab across the top, and the last line says outright: raise a skill\'s rank to earn a hidden relic. Taller card, plainest wording.' },
].map((o) => `<div class="col o o-${o.k}${o.k === 'cur' ? ' cur' : ''}"><div class="tag">${o.tag}</div><h2>${o.n}</h2><p>${o.d}</p>${phone(o.k === 'cur' ? S.cur : S[o.k])}</div>`).join('');
document.querySelectorAll('.ev').forEach((b) => b.addEventListener('click', () => b.classList.toggle('down')));
</script>
</body>
</html>
