<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Overdrive signal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya:wght@500&family=Alegreya+Sans:wght@400&display=swap" />
<style>
/* Live (animated) options for the Overdrive halo on a done skill's check, in Moonlit Ashen.
   The diamond and row match the app; only the halo changes per option. */
:root { --text: #a9adb6; --text-h: #e8ebf0; --ember: #e0783a; --moon: #dbe2ee; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--text-h); background: #07080c; font: 500 16px/1.4 'Alegreya', Georgia, serif; }
.page { max-width: 1100px; margin: 0 auto; padding: 30px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; margin: 0 0 6px; }
.lede { text-align: center; color: var(--text); margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.opt { background: #141720; border-radius: 6px; padding: 14px 14px 10px; box-shadow: inset 0 1px 0 rgba(170,185,215,.18); }
.opt h2 { font: 600 11px 'Cinzel', serif; letter-spacing: .2em; margin: 0 0 4px; }
.opt p { margin: 0 0 10px; color: var(--text); font: 400 14px/1.35 'Alegreya Sans', sans-serif; min-height: 40px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 4px; background: rgba(0,0,0,.22); margin-bottom: 6px; }
.name { flex: 1; font-size: 17px; }
.name.done { color: #787c87; text-decoration: line-through; text-decoration-color: rgba(180,190,205,.62); }
.name small { display: block; font: 400 12px 'Alegreya Sans', sans-serif; color: #6f7480; text-decoration: none; }
.check { position: relative; flex: none; width: 13px; height: 13px; margin: 0 9px; transform: rotate(45deg);
  background: rgba(0,0,0,.45); border: 1px solid var(--moon); }
.check.done { background: #3c4352; border-color: #566074; }
.check.halo::before { content: ''; position: absolute; pointer-events: none; }

/* Current (as shipped) */
.o0 .halo::before { inset: -5px; border: 1px solid var(--ember); box-shadow: 0 0 12px 2px rgba(224,120,58,.5); animation: o0 2.4s ease-in-out infinite; }
@keyframes o0 { 50% { opacity: .3; } }

/* A: slow, shallow breath, dimmer glow */
.o1 .halo::before { inset: -5px; border: 1px solid rgba(224,120,58,.75); box-shadow: 0 0 6px 0 rgba(224,120,58,.25); animation: o1 5s ease-in-out infinite; }
@keyframes o1 { 50% { opacity: .55; } }

/* B: still, dim ring, no glow, no motion */
.o2 .halo::before { inset: -5px; border: 1px solid rgba(224,120,58,.5); }

/* C: still ring, one soft glint every few seconds */
.o3 .halo::before { inset: -5px; border: 1px solid rgba(224,120,58,.5); animation: o3 6s ease-in-out infinite; }
@keyframes o3 { 0%, 70%, 100% { border-color: rgba(224,120,58,.5); box-shadow: none; } 85% { border-color: rgba(224,120,58,.9); box-shadow: 0 0 8px 1px rgba(224,120,58,.35); } }

/* D: moonlit silver ring (no orange), slow shallow breath */
.o4 .halo::before { inset: -5px; border: 1px solid rgba(170,185,215,.6); box-shadow: 0 0 6px rgba(200,214,240,.2); animation: o4 5s ease-in-out infinite; }
@keyframes o4 { 50% { opacity: .5; } }

/* E: broken ring — four ember corner ticks, still */
.o5 .halo::before { inset: -6px;
  background:
    linear-gradient(var(--ember), var(--ember)) 0 0 / 3px 3px no-repeat,
    linear-gradient(var(--ember), var(--ember)) 100% 0 / 3px 3px no-repeat,
    linear-gradient(var(--ember), var(--ember)) 0 100% / 3px 3px no-repeat,
    linear-gradient(var(--ember), var(--ember)) 100% 100% / 3px 3px no-repeat;
  opacity: .7; }
@media (prefers-reduced-motion: reduce) { .halo::before { animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <h1>Overdrive signal</h1>
  <p class="lede">The halo on a done skill's check that can still be Overdriven. Live, so watch them for a few seconds.</p>
  <div class="grid" id="g"></div>
</div>
<script>
const OPTS = [
  ['Current', 'Ember ring and glow, pulsing to 30% every 2.4s.'],
  ['A · Slow breath', 'Same ember ring, glow nearly gone, 5s cycle that only dips to 55%.'],
  ['B · Still ring', 'Dim ember ring, no glow, no motion. Reads as a mark, not an alert.'],
  ['C · Glint', 'Still dim ring that gives one soft ember glint every 6s.'],
  ['D · Moonlit', 'Silver ring, not orange, with the slow breath. Matches what you can touch.'],
  ['E · Corner ticks', 'Four small ember ticks around the diamond. No glow, no motion.'],
];
const row = (n, cls, done, sub) => `<div class="row"><span class="check ${done ? 'done' : ''} ${cls}"></span><span class="name ${done ? 'done' : ''}">${n}${sub ? `<small>${sub}</small>` : ''}</span></div>`;
document.getElementById('g').innerHTML = OPTS.map(([t, d], i) => `<div class="opt o${i}"><h2>${t}</h2><p>${d}</p>
${row('Morning run', 'halo', true, 'Overdrive ready')}${row('Read a chapter', '', true)}${row('Practice scales', '', false)}</div>`).join('');
</script>
</body>
</html>
