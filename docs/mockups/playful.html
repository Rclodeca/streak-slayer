<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — Playful directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" />
<style>
/* A little more playful, still serious art. Same screen and data in each;
   spacing, checks, borders and colour change. Moonlit is the base. */
* { box-sizing: border-box; }
body { margin: 0; background: #1b1c20; color: #b8b6b0; font: 500 16px/1.35 'Alegreya Sans', system-ui, sans-serif; }
.page { padding: 28px 16px 60px; }
h1 { text-align: center; font: 600 14px 'Cinzel', serif; letter-spacing: .32em; color: #ece8de; margin: 0 0 6px; }
.lede { text-align: center; margin: 0 auto 26px; max-width: 640px; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 24px; justify-content: center; align-items: flex-start; }
.col { width: 340px; flex: none; }
.col .tag { font: 600 10px 'Cinzel', serif; letter-spacing: .2em; color: #8f8b80; margin-bottom: 3px; }
.col h2 { font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: #ece8de; margin: 0 0 3px; }
.col p { margin: 0 0 12px; min-height: 84px; font-size: 15px; }

/* ---------- Base: Moonlit as it is now ---------- */
.phone {
  --bg: #07080c; --frame: #141720; --ink: #e8ebf0; --text: #a9adb6; --touch: #dbe2ee; --line: rgba(150,141,126,.22);
  --brass: #d2bb85; --exp: #d9a93c; --bad: #d4574a; --phys: #e5705c; --magic: #a98be0; --heal: #7fc17a; --true: #f1e9d6;
  --spent: #6a6f7a; --done: #3c4352; --done-line: #566074;
  position: relative; width: 340px; background: var(--bg); border: 1px solid #000; border-radius: 26px; overflow: hidden;
  box-shadow: 0 18px 44px rgba(0,0,0,.5); color: var(--text);
}
.cap { font: 600 11px 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; }
.stage { position: relative; height: 262px; background: radial-gradient(70% 55% at 72% 55%, #1c2230, transparent 70%), var(--bg); }
.topbar { position: absolute; inset: 14px 14px auto; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.topbar .cap { color: var(--ink); letter-spacing: .3em; }
.menu { width: 38px; height: 38px; border-radius: 8px; background: rgba(219,226,238,.08); border: 1px solid rgba(219,226,238,.35); display: grid; place-content: center; gap: 4px; }
.menu i { display: block; width: 16px; height: 2px; background: var(--touch); }
.boss { position: absolute; right: 6px; top: 42px; width: 150px; image-rendering: pixelated;
  filter: drop-shadow(2px 0 0 #2a1a10) drop-shadow(-2px 0 0 #2a1a10) drop-shadow(0 2px 0 #2a1a10) drop-shadow(0 -2px 0 #2a1a10) drop-shadow(0 0 12px rgba(224,120,58,.4)); }
.hero { position: absolute; left: 4px; top: 120px; width: 124px; image-rendering: pixelated; filter: drop-shadow(0 0 18px rgba(0,0,0,.9)) brightness(.88); }
.unit { position: absolute; z-index: 1; }
.unit.b { left: 14px; top: 62px; width: 168px; }
.unit.h { left: 150px; top: 182px; width: 176px; }
.uname { display: flex; align-items: center; gap: 6px; font: 600 12px 'Cinzel', serif; letter-spacing: .2em; color: var(--ink); margin-bottom: 4px; }
.uname small { font-size: 11px; color: var(--brass); letter-spacing: .1em; }
.bar { position: relative; height: 13px; border-radius: 2px; background: rgba(0,0,0,.5); border: 1px solid rgba(0,0,0,.5); overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#c4402a, #8c2616); }
.bar.xp { height: 5px; margin-top: 3px; } .bar.xp b { background: var(--exp); }
.bar span { position: absolute; right: 5px; top: -1px; font: 700 10.5px/13px 'Alegreya Sans', sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.7); }
.bar.xp span { display: none; }
.badge { display: none; }
.barnums { display: none; }

.sec { position: relative; margin: 14px 12px 0; padding: 12px 12px 8px; background: var(--frame); border: 1px solid var(--line); border-radius: 10px; }
.sec::before { content: ''; position: absolute; top: -1px; left: 12px; right: 12px; height: 1px; background: linear-gradient(90deg, transparent, rgba(219,226,238,.45), transparent); }
.sec::after { content: ''; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--frame); border: 1px solid rgba(219,226,238,.45); }
.shead { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.shead h3 { margin: 0; font: 600 12px 'Cinzel', serif; letter-spacing: .22em; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.shead h3 svg { display: none; }
.add { font: 700 12px 'Alegreya Sans', sans-serif; color: var(--touch); background: rgba(219,226,238,.08); border: 1px solid rgba(219,226,238,.35); border-radius: 8px; padding: 8px 12px; min-height: 36px; }
.group { font: 600 10px 'Cinzel', serif; letter-spacing: .24em; color: var(--text); margin: 10px 0 2px; }
ul { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 6px 8px 8px; }
.tab { flex: none; display: grid; place-items: center; }
.chk { width: 13px; height: 13px; margin: 0 4px; transform: rotate(45deg); background: rgba(0,0,0,.45); border: 1px solid var(--touch); }
.chk svg { display: none; }
.row.on .chk { background: var(--done); border-color: var(--done-line); }
.bad .chk { border-color: var(--bad); }
.body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.nm { flex: 1; min-width: 0; font: 600 16.5px 'Alegreya', Georgia, serif; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; align-items: center; gap: 8px; }
.streak { min-width: 30px; display: inline-flex; align-items: center; gap: 2px; font: 700 13px 'Alegreya Sans', sans-serif; color: var(--ink); }
.streak svg { width: 12px; height: 12px; stroke: var(--text); fill: none; stroke-width: 1.8; }
.plate { min-width: 28px; text-align: center; font: 600 9.5px/1 'Cinzel', serif; color: var(--brass); background: rgba(0,0,0,.4); border: 1px solid rgba(190,160,100,.45); border-radius: 3px; padding: 3px 5px 2px; }
.plate:empty { visibility: hidden; }
.dmg { min-width: 40px; text-align: right; font: 700 15px 'Alegreya Sans', sans-serif; color: var(--c); }
.dmg svg { display: none; }
.veil { position: absolute; inset: 0; border-radius: 10px; pointer-events: none; }
.row.on .veil { background: linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,.18)); }
.row.on .nm { color: var(--spent); }
.row.on .dmg { color: color-mix(in srgb, var(--c) 50%, var(--spent)); }
.row.on .streak, .row.on .plate { opacity: .45; }
.resist .nm { color: var(--text); font-weight: 500; }
.resist .dmg { color: color-mix(in srgb, var(--c) 60%, var(--text)); }
.resist .chk { border-color: color-mix(in srgb, var(--bad) 70%, transparent); }
.week { font: 700 12px 'Alegreya Sans', sans-serif; color: #5f6470; }
.fab { display: none; }
.end { height: 18px; }

/* ---------- A · Roomy: only the spacing changes ---------- */
.t-roomy .sec { margin: 18px 12px 0; padding: 16px 14px 12px; border-radius: 14px; }
.t-roomy .group { margin: 16px 0 8px; }
.t-roomy ul { display: flex; flex-direction: column; gap: 6px; }
.t-roomy .sec { padding: 16px 10px 12px; }
.t-roomy .row { min-height: 56px; padding: 12px 10px 12px 12px; gap: 12px; background: rgba(255,255,255,.025); border-radius: 12px; }
.t-roomy .meta { gap: 6px; }
.t-roomy .chk { width: 17px; height: 17px; border-width: 1.5px; }
.t-roomy .nm { font-size: 17.5px; }
.t-roomy .add { border-radius: 999px; padding: 8px 16px; }

/* ---------- B · Tabs: Habitica's coloured side block, our colours ---------- */
.t-tabs { --bg: #0c0e14; }
.t-tabs .sec { background: none; border: 0; padding: 4px 0 0; margin: 14px 12px 0; }
.t-tabs .sec::before, .t-tabs .sec::after { display: none; }
.t-tabs .shead { padding: 0 2px; }
.t-tabs .group { margin: 12px 2px 6px; }
.t-tabs ul { display: flex; flex-direction: column; gap: 8px; }
.t-tabs .row { min-height: 60px; padding: 0; gap: 0; background: #181c26; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.t-tabs .tab { align-self: stretch; width: 52px; background: color-mix(in srgb, var(--c) 72%, #181c26); }
.t-tabs .chk { width: 24px; height: 24px; margin: 0; transform: none; border-radius: 7px; background: rgba(0,0,0,.22); border: 0; box-shadow: inset 0 2px 3px rgba(0,0,0,.25); display: grid; place-items: center; }
.t-tabs .body { padding: 10px 12px 10px 14px; }
.t-tabs .nm { font: 500 17px 'Alegreya Sans', sans-serif; }
.t-tabs .row.on .tab { background: #262b38; }
.t-tabs .row.on .chk { background: rgba(0,0,0,.25); }
.t-tabs .row.on .chk svg { display: block; width: 16px; height: 16px; stroke: color-mix(in srgb, var(--c) 70%, #8a909c); fill: none; stroke-width: 3; }
.t-tabs .row.on .veil { display: none; }
.t-tabs .resist .row { background: #141720; }
.t-tabs .resist .tab { background: #2a1c1f; }
.t-tabs .resist .chk { background: none; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bad) 75%, transparent); }
.t-tabs .add { border-radius: 10px; background: #232838; border: 0; }
.t-tabs .bar { height: 10px; border-radius: 5px; border: 0; background: #1d212c; }
.t-tabs .bar b { border-radius: 5px; background: #e0574a; }
.t-tabs .bar span { display: none; }
.t-tabs .barnums { display: flex; justify-content: space-between; margin-top: 3px; font: 500 11.5px 'Alegreya Sans', sans-serif; color: var(--text); }
.t-tabs .bar.xp { height: 6px; margin-top: 5px; } .t-tabs .bar.xp b { background: var(--exp); }

/* ---------- C · Gems: the check becomes a socket that lights up ---------- */
.t-gems .sec { border-radius: 16px; padding: 14px 12px 10px; background: linear-gradient(#171b25, #12151d); border-color: rgba(150,160,190,.14); }
.t-gems .group { margin: 14px 4px 6px; }
.t-gems ul { display: flex; flex-direction: column; gap: 5px; }
.t-gems .row { min-height: 54px; padding: 8px 12px 8px 10px; gap: 12px; background: rgba(0,0,0,.28); border-radius: 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.03); }
.t-gems .chk { width: 22px; height: 22px; margin: 0 4px; border-radius: 4px; border: 2px solid color-mix(in srgb, var(--c) 55%, #2a2f3c); background: rgba(0,0,0,.45); box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
.t-gems .row.on .chk { border-color: color-mix(in srgb, var(--c) 80%, #fff);
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 40%, #fff) 0 22%, var(--c) 22% 55%, color-mix(in srgb, var(--c) 60%, #000) 55%);
  box-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 0 1px rgba(255,255,255,.25); }
.t-gems .resist .chk { border-color: color-mix(in srgb, var(--bad) 55%, #2a2f3c); }
.t-gems .plate { width: 24px; height: 24px; min-width: 0; padding: 0; display: grid; place-items: center; border-radius: 50%; font-size: 9px;
  background: radial-gradient(circle at 35% 30%, #4a3f28, #221c12); border: 1.5px solid #b39a66; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.t-gems .streak svg { stroke: #e09a52; }
.t-gems .add { border-radius: 999px; padding: 8px 16px; }
.t-gems .bar { height: 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,.7); }
.t-gems .bar b { border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }

/* ---------- D · Strike buttons: chunky cards, tap the damage ---------- */
.t-chunky .sec { background: none; border: 0; padding: 4px 0 0; }
.t-chunky .sec::before, .t-chunky .sec::after { display: none; }
.t-chunky .shead { padding: 0 2px; }
.t-chunky .group { margin: 12px 2px 6px; }
.t-chunky ul { display: flex; flex-direction: column; gap: 10px; }
.t-chunky .row { min-height: 64px; padding: 10px 10px 10px 14px; gap: 12px; background: #171b25; border: 1.5px solid #262c3a; border-bottom-width: 4px; border-radius: 14px; }
.t-chunky .tab { order: 3; }
.t-chunky .chk { display: none; }
.t-chunky .body { flex-direction: column; align-items: flex-start; gap: 3px; }
.t-chunky .nm { width: 100%; font-size: 17px; }
.t-chunky .meta { gap: 8px; }
.t-chunky .streak { min-width: 0; font-size: 12px; color: var(--text); }
.t-chunky .plate:empty { display: none; }
.t-chunky .dmg { order: 3; min-width: 64px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-align: center; color: #fff; font-size: 16px;
  background: linear-gradient(color-mix(in srgb, var(--c) 85%, #fff), var(--c)); border-radius: 12px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000); text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.t-chunky .dmg svg { display: block; width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }
.t-chunky .row.on { border-color: #1c212c; background: #12151d; }
.t-chunky .row.on .veil { display: none; }
.t-chunky .row.on .dmg { transform: translateY(4px); box-shadow: none; background: #232836; color: color-mix(in srgb, var(--c) 45%, #6a6f7a); text-shadow: none; }
.t-chunky .row.on .dmg svg { stroke: currentColor; }
.t-chunky .resist .row { background: #12151d; border-color: #1f2430; }
.t-chunky .resist .dmg { background: none; box-shadow: none; border: 2px solid color-mix(in srgb, var(--bad) 60%, transparent); color: color-mix(in srgb, var(--bad) 80%, #fff); text-shadow: none; }
.t-chunky .resist .dmg svg { stroke: currentColor; }
.t-chunky .add { border-radius: 12px; background: #2a3142; border: 0; box-shadow: 0 3px 0 #0e1118; color: var(--ink); }

/* ---------- E · Dusk: a warmer, more colourful dark ---------- */
.t-dusk { --bg: #110e1c; --frame: #1c1830; --ink: #f1edf8; --text: #aea7c2; --touch: #c9b8ff; --spent: #6d6782; --done: #3a3354; --done-line: #5b5180;
  --phys: #ff7a66; --magic: #b794ff; --heal: #84d88c; }
.t-dusk .stage { background: radial-gradient(80% 45% at 50% 100%, rgba(255,140,120,.20), transparent 70%), radial-gradient(60% 50% at 75% 40%, rgba(160,120,255,.18), transparent 70%), linear-gradient(#1a1430, #110e1c); }
.t-dusk .menu { background: rgba(201,184,255,.1); border-color: rgba(201,184,255,.35); border-radius: 12px; } .t-dusk .menu i { background: var(--touch); }
.t-dusk .sec { border: 0; border-radius: 18px; padding: 14px 14px 10px; box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); }
.t-dusk .sec::before, .t-dusk .sec::after { display: none; }
.t-dusk .group { margin: 12px 0 4px; color: #8c84a6; }
.t-dusk .row { min-height: 52px; padding: 8px 8px 8px 6px; gap: 12px; }
.t-dusk .row + .row { border-top: 1px solid rgba(201,184,255,.07); }
.t-dusk .chk { width: 22px; height: 22px; margin: 0; transform: none; border-radius: 7px; border: 2px solid var(--touch); background: rgba(0,0,0,.2); display: grid; place-items: center; }
.t-dusk .row.on .chk { background: color-mix(in srgb, var(--touch) 30%, #1c1830); border-color: transparent; }
.t-dusk .row.on .chk svg { display: block; width: 14px; height: 14px; stroke: var(--touch); fill: none; stroke-width: 3; }
.t-dusk .row.on .veil { display: none; }
.t-dusk .resist .chk { border-color: color-mix(in srgb, var(--bad) 80%, transparent); }
.t-dusk .plate { border-radius: 6px; }
.t-dusk .streak svg { stroke: #ff9a6a; }
.t-dusk .add { display: none; }
.t-dusk .bar { height: 10px; border-radius: 5px; border: 0; background: rgba(0,0,0,.45); margin-left: 22px; overflow: visible; }
.t-dusk .bar b { border-radius: 5px; background: linear-gradient(90deg, #ff5a6a, #ff7a66); }
.t-dusk .bar.xp b { background: linear-gradient(90deg, #f0b23c, #ffd060); }
.t-dusk .bar.xp { height: 7px; margin-top: 7px; }
.t-dusk .bar span { display: none; }
.t-dusk .badge { display: grid; place-items: center; position: absolute; left: -24px; top: 50%; width: 18px; height: 18px; margin-top: -9px; }
.t-dusk .badge svg { width: 16px; height: 16px; }
.t-dusk .barnums { display: flex; justify-content: space-between; margin: 3px 0 0 22px; font: 500 11px 'Alegreya Sans', sans-serif; color: var(--text); }
.t-dusk .fab { display: grid; place-items: center; position: absolute; left: 50%; bottom: 22px; width: 54px; height: 54px; margin-left: -27px; transform: rotate(45deg); border-radius: 12px;
  background: linear-gradient(135deg, #a78bff, #7a5ce0); box-shadow: 0 8px 20px rgba(122,92,224,.5), inset 0 1px 0 rgba(255,255,255,.3); z-index: 3; }
.t-dusk .fab svg { transform: rotate(-45deg); width: 24px; height: 24px; stroke: #fff; stroke-width: 3; stroke-linecap: round; }
.t-dusk .end { height: 86px; }

/* ---------- F · Orbs: round everything, the most playful ---------- */
.t-orbs .sec { border-radius: 20px; padding: 14px 10px 10px; border-color: rgba(160,170,200,.12); }
.t-orbs .sec::after { display: none; }
.t-orbs .shead { padding: 0 4px; }
.t-orbs .shead h3 svg { display: block; width: 16px; height: 16px; stroke: var(--brass); fill: none; stroke-width: 1.8; }
.t-orbs .group { margin: 14px 8px 6px; }
.t-orbs ul { display: flex; flex-direction: column; gap: 7px; }
.t-orbs .row { min-height: 54px; padding: 7px 8px 7px 9px; gap: 11px; background: #1b2030; border: 1px solid rgba(255,255,255,.05); border-radius: 999px; }
.t-orbs .chk { width: 30px; height: 30px; margin: 0; transform: none; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, transparent); background: rgba(0,0,0,.3); }
.t-orbs .row.on .chk { border-color: transparent; background: radial-gradient(circle at 35% 30%, #fff 0 8%, color-mix(in srgb, var(--c) 70%, #fff) 14%, var(--c) 45%, color-mix(in srgb, var(--c) 55%, #000) 100%);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 14px color-mix(in srgb, var(--c) 50%, transparent); }
.t-orbs .row.on { background: #141824; }
.t-orbs .row.on .veil { display: none; }
.t-orbs .resist .chk { border-color: color-mix(in srgb, var(--bad) 65%, transparent); }
.t-orbs .resist .row { background: #161a26; }
.t-orbs .streak { min-width: 0; padding: 4px 8px 4px 6px; border-radius: 999px; background: rgba(240,150,80,.12); color: #f2b07a; font-size: 12px; }
.t-orbs .streak:empty { display: none; }
.t-orbs .streak svg { stroke: #f2a060; }
.t-orbs .plate { border-radius: 999px; padding: 4px 7px 3px; }
.t-orbs .plate:empty { display: none; }
.t-orbs .dmg { min-width: 48px; padding: 6px 10px; border-radius: 999px; text-align: center; background: color-mix(in srgb, var(--c) 14%, transparent); }
.t-orbs .row.on .dmg { background: rgba(255,255,255,.03); }
.t-orbs .add { border-radius: 999px; padding: 8px 16px; }
.t-orbs .bar { height: 14px; border-radius: 999px; border: 2px solid rgba(0,0,0,.6); }
.t-orbs .bar b { border-radius: 999px; background: linear-gradient(#ef6a52, #b8331f); box-shadow: inset 0 2px 0 rgba(255,255,255,.28); }
.t-orbs .bar span { top: -2px; }
.t-orbs .bar.xp { height: 8px; } .t-orbs .bar.xp b { background: linear-gradient(#f4c45a, #c88a1c); }

/* ---------- G · Hotbar: skills as ability tiles ---------- */
.t-hotbar .sec { border-radius: 14px; }
.t-hotbar .group { margin: 12px 2px 6px; }
.t-hotbar ul { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.t-hotbar .row { min-height: 92px; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 6px; padding: 10px 11px 10px;
  background: radial-gradient(120% 70% at 50% 0, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%), #10131b;
  border: 1px solid color-mix(in srgb, var(--c) 35%, #232836); border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.t-hotbar .tab { position: absolute; right: 9px; top: 11px; }
.t-hotbar .chk { width: 12px; height: 12px; margin: 0; border-color: color-mix(in srgb, var(--c) 70%, #fff); }
.t-hotbar .body { flex-direction: column; align-items: stretch; gap: 6px; }
.t-hotbar .nm { padding-right: 20px; font-size: 16px; white-space: normal; line-height: 1.15; }
.t-hotbar .meta { order: 2; gap: 6px; }
.t-hotbar .streak { min-width: 0; font-size: 12px; }
.t-hotbar .plate:empty { display: none; }
.t-hotbar .dmg { order: 3; text-align: left; font-size: 22px; line-height: 1; letter-spacing: .01em; }
.t-hotbar .row.on { border-color: #1c2029; background: #0d0f15; }
.t-hotbar .row.on .chk { background: var(--done); border-color: var(--done-line); }
.t-hotbar .row.on .veil { background: rgba(0,0,0,.28); }
.t-hotbar .resist ul { grid-template-columns: 1fr; gap: 0; }
.t-hotbar .resist .row { min-height: 44px; flex-direction: row; align-items: center; padding: 8px 6px 8px 8px; background: none; border: 0; box-shadow: none; }
.t-hotbar .resist .tab { position: static; }
.t-hotbar .resist .body { flex-direction: row; align-items: center; }
.t-hotbar .resist .dmg { font-size: 15px; text-align: right; }
.t-hotbar .resist .nm { padding: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>Playful</h1>
  <p class="lede">Now, then seven directions from a light touch to quite playful. The art and data don't change; spacing, checks, borders and colour do.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const S = {
  check: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>',
  flame: '<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/></svg>',
  sword: '<svg viewBox="0 0 24 24"><path d="M5 19 17 7M14 4h6v6M7 15l2 2"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="#ff5a6a"><path d="M12 20S4 15 4 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15 12 20 12 20z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="#ffc94a"><path d="M12 2c.7 5 3 7.3 8 8-5 .7-7.3 3-8 8-.7-5-3-7.3-8-8 5-.7 7.3-3 8-8z"/></svg>',
};
const NUM = ['', 'I', 'II', 'III', 'IV'];

const skills = {
  Daily: [
    { n: 'Morning run',   t: 'phys',  d: 412, s: 23, r: 3, on: true },
    { n: 'Read 20 pages', t: 'magic', d: 288, s: 9,  r: 2, on: true },
    { n: 'Stretch',       t: 'heal',  d: 141, s: 0,  r: 0 },
    { n: 'Pushups',       t: 'phys',  d: 196, s: 4,  r: 1 },
    { n: 'Meditate',      t: 'true',  d: 174, s: 0,  r: 0 },
  ],
  Weekly: [
    { n: 'Long hike',     t: 'phys',  d: 600, s: 6,  r: 1 },
  ],
};
const resist = [
  { n: 'Doomscroll',    t: 'phys',  d: 110, s: 9, r: 1 },
  { n: 'Late snacking', t: 'magic', d: 80,  s: 3, r: 0 },
  { n: 'Takeout',       t: 'magic', d: 150, s: 3, r: 0, week: true },
];

const row = (h) => `<li class="row${h.on ? ' on' : ''}" style="--c: var(--${h.t})">
  <span class="tab"><span class="chk">${S.check}</span></span>
  <span class="body">
    <span class="nm">${h.n}</span>
    <span class="meta">${h.week ? '<span class="week">Week</span>' : ''}<span class="streak">${h.s >= 3 ? S.flame + h.s : ''}</span><span class="plate">${NUM[h.r]}</span></span>
  </span>
  <span class="dmg">${S.sword}${h.d}</span>
  <span class="veil"></span>
</li>`;

const unit = (cls, name, lvl, hp, max, pct, xp) => `<div class="unit ${cls}">
  <div class="uname">${name}${lvl ? ` <small>${lvl}</small>` : ''}</div>
  <div class="bar"><span class="badge">${S.heart}</span><b style="width:${pct}%"></b><span>${hp} / ${max}</span></div>
  ${xp != null ? `<div class="bar xp"><span class="badge">${S.star}</span><b style="width:${xp}%"></b></div>` : ''}
  <div class="barnums"><span>${hp} / ${max}</span><span>${xp != null ? 'Health' : ''}</span></div>
</div>`;

const screen = (id) => `<div class="phone t-${id}">
  <div class="stage">
    <div class="topbar"><span class="cap">Boss #9</span><span class="menu"><i></i><i></i><i></i></span></div>
    <img class="boss" src="../../public/sprites/bosses/balanced@3x.png" alt="">
    <img class="hero" src="../../public/sprites/player/warrior@3x.png" alt="">
    ${unit('b', 'Drifter', '', 266, 648, 41)}
    ${unit('h', 'Ryn', 14, '1.04K', '5.74K', 38, 62)}
  </div>
  <section class="sec">
    <div class="shead"><h3>${S.sword}Skills</h3><button class="add" type="button">+ New habit</button></div>
    ${Object.entries(skills).map(([g, rows]) => `<div class="group">${g}</div><ul>${rows.map(row).join('')}</ul>`).join('')}
  </section>
  <section class="sec resist">
    <div class="shead"><h3>${S.shield}Resist</h3></div>
    <ul>${resist.map(row).join('')}</ul>
  </section>
  <div class="end"></div>
  <span class="fab">${S.plus}</span>
</div>`;

const OPTIONS = [
  { id: 'now',    tag: 'REFERENCE', n: 'Now', d: 'Moonlit as it is: thin panels, small diamonds, tight 44px rows.' },
  { id: 'roomy',  tag: 'A · LIGHT TOUCH', n: 'Roomy', d: 'Only the spacing changes. Each skill sits in its own soft well, 56px tall, bigger diamond and name, more air between groups.' },
  { id: 'tabs',   tag: 'B · HABITICA NOD', n: 'Tabs', d: 'Panels drop away; every skill is its own card with a coloured block on the left, coloured by damage type. Rounded checks, plain sans names, round bars with numbers under.' },
  { id: 'gems',   tag: 'C · RPG PLAYFUL', n: 'Gems', d: 'The check is a gem socket rimmed in the damage colour. Done, the gem lights up and glows while the row dims. Ranks become brass coins, the flame warms up.' },
  { id: 'chunky', tag: 'D · TACTILE', n: 'Strike', d: 'Thick cards with a lip. No checkbox: you tap the damage itself, a chunky button that presses down and stays down until dawn. Resist buttons are outlined.' },
  { id: 'dusk',   tag: 'E · COLOUR', n: 'Dusk', d: 'A warmer, more colourful dark: plum stone, lavender touch, a sunset under the stage. Bars get heart and star badges; a diamond + button floats at the bottom.' },
  { id: 'orbs',   tag: 'F · MOST PLAYFUL', n: 'Orbs', d: 'Round everything. Pill rows, round checks that fill into a glowing orb, streak and damage in soft chips, panel titles with a little crest.' },
  { id: 'hotbar', tag: 'G · WILDCARD', n: 'Hotbar', d: 'Skills as ability tiles in two columns, like a spell bar. Big damage number, type-tinted glow. Resist stays a quiet list.' },
];

document.getElementById('grid').innerHTML = OPTIONS.map((o) => `<div class="col">
  <div class="tag">${o.tag}</div><h2>${o.n.toUpperCase()}</h2><p>${o.d}</p>
  ${screen(o.id)}
</div>`).join('');
</script>
</body>
</html>
